<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace CBD - fleurs, huiles, e-liquides, pommades | CBD Atlas</title>
<meta name="description" content="Le supermarche du CBD legal : fleurs, resines, huiles, e-liquides, pommades, infusions, comestibles et cristaux. Filtres par taux de CBD, prix, ville et livraison.">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="/img/produit/fleur.svg">
</head>
<body>
<div class="wrap">
  <div class="hero" style="padding:34px 0 12px;text-align:left">
    <h1 style="font-size:2rem">Le supermarche du CBD</h1>
    <p style="margin:0">Tous les produits des distributeurs abonnes, filtres par forme, taux de CBD, prix et mode de retrait. THC &le; 0,3 %, certificat d'analyse par lot.</p>
  </div>

  <div class="filtres">
    <input id="q" placeholder="Rechercher : amnesia, huile 10 %, baume..." style="flex:1;min-width:220px">
    <select id="type"><option value="">Toutes les formes</option></select>
    <select id="tri">
      <option value="pertinence">Trier : pertinence</option>
      <option value="prix_asc">Prix croissant</option>
      <option value="prix_desc">Prix decroissant</option>
      <option value="cbd">Taux de CBD</option>
    </select>
    <input id="prix_max" type="number" min="0" step="1" placeholder="Prix max" style="width:110px">
    <input id="cbd_min" type="number" min="0" max="100" step="1" placeholder="CBD min %" style="width:120px">
    <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="achetable" checked> Achetable en ligne</label>
    <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="livraison"> Livraison</label>
  </div>

  <p class="sous" id="compte"></p>
  <div class="grid g4" id="produits"></div>
  <div style="text-align:center;margin:22px 0"><button class="btn ghost" id="plus" hidden>Charger plus</button></div>
</div>

<div class="voile" id="voile"><div class="modale" id="fiche"></div></div>

<script src="/js/app.js"></script>
<script>
(function () {
  const { api, esc, euro, Panier } = window.CBD;
  let page = 1, total = 0, courants = [];

  const params = () => {
    const p = new URLSearchParams();
    const v = (id) => document.getElementById(id).value.trim();
    if (v('q')) p.set('q', v('q'));
    if (v('type')) p.set('type', v('type'));
    if (v('prix_max')) p.set('prix_max', v('prix_max'));
    if (v('cbd_min')) p.set('cbd_min', v('cbd_min'));
    if (document.getElementById('achetable').checked) p.set('achetable', '1');
    if (document.getElementById('livraison').checked) p.set('livraison', '1');
    p.set('tri', v('tri'));
    p.set('page', page);
    return p;
  };

  function carteProduit(p) {
    return `<article class="prod" data-id="${esc(p.id)}">
      <img class="visuel" src="${esc(p.image)}" alt="${esc(p.nom)}" loading="lazy">
      <div class="corps">
        <h4>${esc(p.nom)} ${p.mise_en_avant ? '<span class="tag or">Top</span>' : ''}</h4>
        <div class="meta">${esc(p.enseigne)} &middot; ${esc(p.ville)}</div>
        <div class="meta">CBD ${p.taux_cbd} % &middot; THC ${p.taux_thc} % &middot; ${esc(p.spectre)}</div>
        <div class="meta">${p.livraison ? 'Livraison ' + euro(p.frais_livraison) + ' en ' + p.delai_livraison_h + ' h' : 'Retrait en boutique'}</div>
        <div class="bas">
          <span class="prix">${euro(p.prix)}<span style="font-weight:500;font-size:.75rem;color:var(--texte-doux)"> / ${esc(p.unite)}</span></span>
          ${p.achetable && p.stock > 0
            ? '<button class="btn mini" data-add="' + esc(p.id) + '">Ajouter</button>'
            : '<span class="tag gris">' + (p.stock ? 'Vitrine' : 'Epuise') + '</span>'}
        </div>
      </div></article>`;
  }

  async function charger(reset) {
    if (reset) { page = 1; courants = []; }
    const r = await api('/api/produits?' + params().toString());
    total = r.total;
    courants = courants.concat(r.produits);
    document.getElementById('compte').textContent = total + ' produit(s) trouve(s).';
    document.getElementById('produits').innerHTML = courants.length
      ? courants.map(carteProduit).join('') : '<div class="vide">Aucun produit ne correspond a ces filtres.</div>';
    document.getElementById('plus').hidden = courants.length >= total;
    brancher();
  }

  function brancher() {
    document.querySelectorAll('[data-add]').forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); Panier.ajouter(courants.find((p) => p.id === b.getAttribute('data-add'))); };
    });
    document.querySelectorAll('.prod[data-id]').forEach((el) => {
      el.onclick = () => fiche(courants.find((p) => p.id === el.getAttribute('data-id')));
    });
  }

  function fiche(p) {
    if (!p) return;
    document.getElementById('fiche').innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px"><h2 style="margin:0">${esc(p.nom)}</h2>
        <button class="btn ghost mini" id="fermer">Fermer</button></div>
      <img src="${esc(p.image)}" alt="" style="width:130px;border-radius:14px;margin:14px 0">
      <p>${esc(p.description)}</p>
      <div class="grid g2" style="gap:8px;margin-top:12px">
        <div><label>Forme</label>${esc(p.type)}</div>
        <div><label>Variete</label>${esc(p.variete || '-')}</div>
        <div><label>Taux de CBD</label>${p.taux_cbd} %</div>
        <div><label>Taux de THC</label>${p.taux_thc} % <span class="tag ok">conforme</span></div>
        <div><label>Spectre</label>${esc(p.spectre)}</div>
        <div><label>Culture / extraction</label>${esc(p.culture)}</div>
        <div><label>Terpenes</label>${esc(p.terpenes)}</div>
        <div><label>Lot / COA</label>${esc(p.lot)} ${p.coa ? '<span class="tag ok">analyse disponible</span>' : '<span class="tag rouge">manquant</span>'}</div>
        <div><label>Vendeur</label>${esc(p.enseigne)} &mdash; ${esc(p.boutique)}, ${esc(p.ville)}</div>
        <div><label>Stock</label>${p.stock}</div>
      </div>
      <p style="margin-top:14px;font-size:1.3rem;font-weight:800">${euro(p.prix)} <span style="font-size:.8rem;font-weight:500;color:var(--texte-doux)">/ ${esc(p.unite)}</span></p>
      ${p.achetable && p.stock > 0 ? '<button class="btn" id="add2">Ajouter au panier</button>'
        : '<p class="tag gris">Ce vendeur est en formule vitrine : rendez-vous en boutique.</p>'}
      <p style="margin-top:14px;font-size:.8rem;color:var(--texte-doux)">Produit de consommation courante contenant au maximum 0,3 % de THC. N'est pas un medicament, ne soigne aucune pathologie. Interdit aux mineurs, aux femmes enceintes et allaitantes.</p>`;
    document.getElementById('voile').classList.add('ouvert');
    document.getElementById('fermer').onclick = () => document.getElementById('voile').classList.remove('ouvert');
    const add = document.getElementById('add2');
    if (add) add.onclick = () => Panier.ajouter(p);
  }

  document.getElementById('voile').onclick = (e) => { if (e.target.id === 'voile') e.target.classList.remove('ouvert'); };
  document.getElementById('plus').onclick = () => { page++; charger(false); };
  ['q', 'prix_max', 'cbd_min'].forEach((id) => {
    let t; document.getElementById(id).oninput = () => { clearTimeout(t); t = setTimeout(() => charger(true), 250); };
  });
  ['type', 'tri', 'achetable', 'livraison'].forEach((id) => { document.getElementById(id).onchange = () => charger(true); });

  (async function () {
    const ency = await api('/api/encyclopedie');
    const sel = document.getElementById('type');
    ency.types.forEach((t) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(t.id)}">${t.emoji} ${esc(t.nom)}</option>`));
    const u = new URLSearchParams(location.search);
    if (u.get('type')) sel.value = u.get('type');
    if (u.get('q')) document.getElementById('q').value = u.get('q');
    charger(true);
  })();
})();
</script>
</body>
</html>
