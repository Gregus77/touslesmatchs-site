<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutiques CBD pres de chez vous - carte et horaires | CBD Atlas</title>
<meta name="description" content="Carte des magasins CBD en France : adresse, horaires, telephone, livraison, frais de port et delais. Recherche par ville ou par geolocalisation.">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="/img/produit/fleur.svg">
</head>
<body>
<div class="wrap">
  <div class="hero" style="padding:34px 0 14px;text-align:left">
    <h1 style="font-size:2rem">Trouver une boutique CBD</h1>
    <p style="margin:0">Magasins referencies par des distributeurs abonnes. Horaires, livraison, delais et catalogue en temps reel.</p>
  </div>

  <div class="filtres">
    <input id="q" placeholder="Ville, code postal, enseigne..." style="flex:1;min-width:200px">
    <button class="btn ghost" id="geoloc">📍 Autour de moi</button>
    <select id="rayon">
      <option value="25">25 km</option><option value="50" selected>50 km</option>
      <option value="100">100 km</option><option value="300">300 km</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="livre"> Livre a domicile</label>
    <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="ouvert"> Ouvert maintenant</label>
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start">
    <div class="mapbox" id="carte"></div>
    <div>
      <p class="sous" id="compte"></p>
      <div class="grid" id="liste" style="gap:12px"></div>
    </div>
  </div>
</div>

<div class="voile" id="voile"><div class="modale" id="fiche"></div></div>

<style>@media(max-width:900px){.wrap .grid[style*="1.1fr"]{grid-template-columns:1fr}}</style>

<script src="/js/app.js"></script>
<script src="/js/carte.js"></script>
<script>
(function () {
  const { api, esc, euro, Panier } = window.CBD;
  let moi = null, boutiques = [];

  const JOURS = [['lun','Lundi'],['mar','Mardi'],['mer','Mercredi'],['jeu','Jeudi'],['ven','Vendredi'],['sam','Samedi'],['dim','Dimanche']];

  async function charger() {
    const p = new URLSearchParams();
    const q = document.getElementById('q').value.trim();
    if (q) p.set('q', q);
    if (document.getElementById('livre').checked) p.set('livraison', '1');
    if (document.getElementById('ouvert').checked) p.set('ouvert', '1');
    if (moi) { p.set('lat', moi.lat); p.set('lng', moi.lng); p.set('rayon', document.getElementById('rayon').value); }
    const r = await api('/api/boutiques?' + p.toString());
    boutiques = r.boutiques;
    document.getElementById('compte').textContent =
      r.total + ' boutique(s)' + (moi ? ' dans un rayon de ' + document.getElementById('rayon').value + ' km' : '') + '.';
    rendreListe();
    CarteFrance.dessiner(document.getElementById('carte'), boutiques, ouvrirFiche, moi);
  }

  function rendreListe() {
    document.getElementById('liste').innerHTML = boutiques.length ? boutiques.map((b) => `
      <article class="carte" style="cursor:pointer" data-id="${esc(b.id)}">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div>
            <h3>${esc(b.nom)} ${b.mise_en_avant ? '<span class="tag or">Enseigne</span>' : ''}</h3>
            <p>${esc(b.adresse)}, ${esc(b.code_postal)} ${esc(b.ville)}</p>
          </div>
          <div style="text-align:right;flex:none">
            <div style="font-weight:800">${b.note ? b.note.toFixed(1) : '-'}</div>
            <div style="font-size:.75rem;color:var(--texte-doux)">${b.avis} avis</div>
          </div>
        </div>
        <p style="margin-top:8px">
          <span class="tag gris">${b.produits} produits</span>
          ${b.vente_en_ligne ? '<span class="tag">Commande en ligne</span>' : '<span class="tag gris">Vitrine</span>'}
          ${b.livraison ? '<span class="tag">Livraison ' + euro(b.frais_livraison) + '</span>' : '<span class="tag gris">Retrait uniquement</span>'}
          ${b.distance_km != null ? '<span class="tag">' + b.distance_km + ' km</span>' : ''}
        </p>
      </article>`).join('') : '<div class="vide">Aucune boutique ne correspond a ces criteres.</div>';

    document.querySelectorAll('#liste [data-id]').forEach((el) => {
      el.onclick = () => ouvrirFiche(boutiques.find((b) => b.id === el.getAttribute('data-id')));
    });
  }

  async function ouvrirFiche(b) {
    if (!b) return;
    const f = await api('/api/boutiques/' + b.id);
    const horaires = JOURS.map(([k, l]) =>
      `<tr><td>${l}</td><td>${esc((f.horaires || {})[k] || 'Non communique')}</td></tr>`).join('');

    document.getElementById('fiche').innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div>
          <h2 style="margin:0 0 4px">${esc(f.nom)}</h2>
          <p class="sous" style="margin:0">${esc(f.enseigne)} &middot; ${esc(f.adresse)}, ${esc(f.code_postal)} ${esc(f.ville)}</p>
        </div>
        <button class="btn ghost mini" id="fermer">Fermer</button>
      </div>
      <p style="margin:12px 0">
        ${f.ouvert ? '<span class="tag ok">Ouvert maintenant</span>' : '<span class="tag gris">Ferme actuellement</span>'}
        ${f.vente_en_ligne ? '<span class="tag">Commande en ligne</span>' : '<span class="tag gris">Consultation seule</span>'}
        ${f.click_and_collect ? '<span class="tag">Click &amp; collect</span>' : ''}
      </p>
      <div class="grid g2" style="gap:10px">
        <div><label>Telephone</label>${esc(f.telephone || 'Non communique')}</div>
        <div><label>Livraison</label>${f.livraison ? esc(f.conditions_livraison) + '<br><strong>' + euro(f.frais_livraison) + '</strong> &middot; ' + f.delai_livraison_h + ' h' : 'Retrait en boutique uniquement'}</div>
      </div>
      <h3 style="margin:16px 0 6px">Horaires</h3>
      <table>${horaires}</table>
      <h3 style="margin:16px 0 6px">Catalogue (${f.catalogue.length})</h3>
      <div class="grid g4">${f.catalogue.map((p) => `
        <div class="prod">
          <img class="visuel" src="${esc(p.image)}" alt="" loading="lazy">
          <div class="corps">
            <h4>${esc(p.nom)}</h4>
            <div class="meta">CBD ${p.taux_cbd} % &middot; THC ${p.taux_thc} %</div>
            <div class="bas"><span class="prix">${euro(p.prix)}</span>
              ${p.achetable && p.stock > 0 ? '<button class="btn mini" data-add="' + esc(p.id) + '">+</button>' : '<span class="tag gris">Vitrine</span>'}</div>
          </div></div>`).join('')}</div>`;

    document.getElementById('voile').classList.add('ouvert');
    document.getElementById('fermer').onclick = () => document.getElementById('voile').classList.remove('ouvert');
    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.onclick = () => Panier.ajouter(f.catalogue.find((p) => p.id === btn.getAttribute('data-add')));
    });
  }

  document.getElementById('voile').onclick = (e) => {
    if (e.target.id === 'voile') e.target.classList.remove('ouvert');
  };
  document.getElementById('geoloc').onclick = () => {
    if (!navigator.geolocation) return alert('Geolocalisation indisponible sur ce navigateur.');
    navigator.geolocation.getCurrentPosition(
      (pos) => { moi = { lat: pos.coords.latitude, lng: pos.coords.longitude }; charger(); },
      () => alert('Position refusee. Utilisez la recherche par ville.'));
  };
  ['q'].forEach((id) => { let t; document.getElementById(id).oninput = () => { clearTimeout(t); t = setTimeout(charger, 250); }; });
  ['rayon', 'livre', 'ouvert'].forEach((id) => { document.getElementById(id).onchange = charger; });

  const ville = new URLSearchParams(location.search).get('ville');
  if (ville) document.getElementById('q').value = ville;
  charger();
})();
</script>
</body>
</html>
