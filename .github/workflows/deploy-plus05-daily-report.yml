name: Deploy plus05 daily report
on:
  push:
    branches: [feat/plus05-favorite]
    paths: [.github/workflows/deploy-plus05-daily-report.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 9m
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            test "$(git branch --show-current)" = "feat/plus05-favorite"
            oldsha=$(git rev-parse HEAD)
            test -z "$(git status --porcelain --untracked-files=no)"
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            cp .env ".env.before-plus05-daily-$stamp"
            rollback(){
              git reset --hard "$oldsha" || true
              docker compose build api >/dev/null 2>&1 || true
              docker compose up -d --no-deps --force-recreate api >/dev/null 2>&1 || true
            }
            trap rollback ERR
            git fetch origin feat/plus05-favorite
            git merge --ff-only origin/feat/plus05-favorite
            docker compose build api
            docker compose up -d --no-deps --force-recreate api
            ok=0
            for i in $(seq 1 25); do
              if curl -fsS --max-time 5 "https://www.touslesmatchs.com/api/health?plus05daily=$stamp" >/tmp/h.json 2>/dev/null; then
                if python3 - <<'PY'
import json
d=json.load(open('/tmp/h.json'))
raise SystemExit(0 if d.get('ok') is True else 1)
PY
                then ok=1; break; fi
              fi
              sleep 2
            done
            test "$ok" = "1"
            sleep 70
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FLAGS=$(docker compose exec -T api sh -lc 'printf "%s|%s|%s" "$PLUS05_ENABLED" "$AUTO_CONCILE_OBSERVER" "$PLUS05_JEV_SHADOW"')"
            docker compose logs --no-color --since 3m api | grep -E '\[plus05-daily\]|digest quotidien|\[plus05\] charge' | tail -20 || true
            echo HEALTH_OK=1
            trap - ERR
