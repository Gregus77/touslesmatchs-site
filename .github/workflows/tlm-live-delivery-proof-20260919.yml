name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public score coherence and preserve official history
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,pathlib,sqlite3,urllib.request,datetime,sys
            backup=pathlib.Path(json.loads(pathlib.Path('data/tlm-live-coherence-current.json').read_text())['backup'])
            flags={}
            def score(value):
             if isinstance(value,dict): value=[value.get('home'),value.get('away')]
             elif isinstance(value,str): value=value.split('-')
             else:return None
             if len(value)!=2 or any(x is None for x in value):return None
             try:return tuple(int(x) for x in value)
             except:return None
            try:
             deployment=json.loads((backup/'deployment.json').read_text());assert deployment['status']=='APPLIED'
             data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=25))
             matches=data.get('matches',[])
             mismatches=[m for m in matches if not m.get('ou25',{}).get('official') and m.get('ou25',{}).get('snapshot_score') is not None and score(m['ou25']['snapshot_score'])!=score({'home':m.get('score_home'),'away':m.get('score_away')})]
             flags['PUBLIC_NO_STALE_CURRENT_VOTES']=all(not m['ou25'].get('vote_count') and not m['ou25'].get('consensus_direction') and all(not v.get('direction') for v in m['ou25'].get('votes',[])) for m in mismatches)
             flags['STALE_REASONS_EXPOSED']=all(m.get('analysis_exclusion_reason') or m['ou25'].get('synchronization_reason') for m in mismatches)
             flags['STALE_CASE_OBSERVED']=bool(mismatches)
             target=[m for m in matches if 'mirassol' in str(m.get('home','')).lower() and 'botafogo' in str(m.get('away','')).lower()]
             flags['TARGET_STILL_VISIBLE']=bool(target)
             flags['TARGET_NO_MISLEADING_CURRENT_VOTES']=all(m.get('ou25',{}).get('official') or score(m.get('ou25',{}).get('snapshot_score'))==score({'home':m.get('score_home'),'away':m.get('score_away')}) or not m.get('ou25',{}).get('vote_count') for m in target)
             old=sqlite3.connect('file:'+str(backup/'tlm.db')+'?mode=ro',uri=True);current=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
             cols=[x[1] for x in old.execute('pragma table_info(official_vote_snapshots)')]
             immutable=[c for c in ['id','minute','score_home','score_away','votes_json','consensus','created_at'] if c in cols];assert 'id' in immutable
             q='SELECT '+','.join(immutable)+' FROM official_vote_snapshots'
             original={row[0]:row for row in old.execute(q)};now={row[0]:row for row in current.execute(q)}
             flags['EXISTING_SNAPSHOTS_UNCHANGED']=all(now.get(k)==v for k,v in original.items())
             flags['NEW_VOTES_OBSERVED']=bool(current.execute('select 1 from agent_calls where vote_produit=1 and datetime(created_at)>=datetime(?) limit 1',(deployment['at'],)).fetchone())
             old.close();current.close()
             (backup/'public-verification.json').write_text(json.dumps({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'flags':flags}))
             for key,value in flags.items():print(key+'='+str(value))
             assert flags['PUBLIC_NO_STALE_CURRENT_VOTES'] and flags['STALE_REASONS_EXPOSED'] and flags['EXISTING_SNAPSHOTS_UNCHANGED']
             print('PUBLIC_COHERENCE_VERIFIED=True')
            except Exception:
             print('PUBLIC_COHERENCE_VERIFIED=False');sys.exit(1)
            PY
