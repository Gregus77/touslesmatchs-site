name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deploy tested image with exact environment value comparison
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,pathlib,subprocess,time,urllib.request,os,fcntl
            def run(a):return subprocess.check_output(a,text=True,stderr=subprocess.DEVNULL).strip()
            lock=open('/var/lock/tlm-production-deploy.lock','a');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
            state=json.loads(pathlib.Path('data/tlm-firsthalf-candidate.json').read_text());assert state['testsPassed']
            backup=pathlib.Path(state['backup']);cand=backup/'candidate';before=json.loads((backup/'inspect.json').read_text())
            current=json.loads(run(['docker','inspect','touslesmatchs-api']))[0]
            envmap=lambda x:dict(s.split('=',1) for s in x['Config']['Env'])
            assert envmap(current)==envmap(before)
            assert current['Image']==before['Image']
            assert urllib.request.urlopen('http://127.0.0.1:3001/health',timeout=10).status==200
            print('ROLLBACK_HEALTH_AND_ENV_VERIFIED=True')
            merged='399bc39f03b3e899bca507afa4d2224efa77928d'
            assert run(['git','rev-parse','HEAD'])==merged
            assert run(['git','ls-remote','origin','refs/heads/'+run(['git','branch','--show-current'])]).split()[0]==merged
            planned=json.loads((backup/'compose.after.json').read_text())
            assert planned['services']['api']['environment']==envmap(before)
            print('PLANNED_ENV_VALUES_UNCHANGED=True')
            def up(file):
             with open(backup/'deployment.private.log','a') as log:
              return subprocess.run(['docker','compose','-p','touslesmatchs','-f',str(file),'up','-d','--no-deps','--no-build','api'],stdout=log,stderr=log).returncode==0
            try:
             assert up(backup/'compose.after.json')
             healthy=False
             for _ in range(20):
              try:
               if urllib.request.urlopen('http://127.0.0.1:3001/health',timeout=2).status==200:healthy=True;break
              except:pass
              time.sleep(2)
             assert healthy
             actual=json.loads(run(['docker','inspect','touslesmatchs-api']))[0]
             assert envmap(actual)==envmap(before)
             assert actual['Config']['Cmd']==before['Config']['Cmd'] and actual['Config']['Entrypoint']==before['Config']['Entrypoint']
             for name in ['server.js','telegram_client.js','official_signal_snapshots.js','first_half_delivery.js']:
              assert run(['docker','exec','touslesmatchs-api','cat','/app/'+name])==(cand/name).read_text().strip()
             assert urllib.request.urlopen('https://www.touslesmatchs.com/api/health',timeout=10).status==200
             p=backup/'deployment.json';p.write_text(json.dumps({'status':'APPLIED','commit':merged,'image':actual['Image'],'testsPassed':True,'financialConfigUnchanged':True,'phasePreflightEnabled':True}));os.chmod(p,0o600)
             print('FIRST_HALF_RULE_DEPLOYED=True')
             print('RUNTIME_FILES_VERIFIED=True')
             print('CANONICAL_COMMIT_VERIFIED=True')
             print('BUDGET_AND_MODELS_PRESERVED=True')
             print('PUBLIC_API_HEALTH_OK=True')
            except:
             up(backup/'compose.before.json')
             print('FIRST_HALF_DEPLOYMENT_ROLLED_BACK=True')
             raise
            PY
