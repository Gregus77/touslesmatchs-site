name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify normalized snapshot score and individual votes
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,sqlite3,urllib.request
            data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=15))
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            for m in data.get('matches',[]):
             if 'mirassol' not in str(m.get('home','')).lower() or 'botafogo' not in str(m.get('away','')).lower():continue
             o=m.get('ou25') or {};s=o.get('snapshot_score')
             if isinstance(s,dict):h,a=s.get('home'),s.get('away')
             elif isinstance(s,str) and '-' in s:
              try:h,a=map(int,s.split('-'))
              except:h,a=None,None
             else:h,a=None,None
             print('NORMALIZED_SNAPSHOT_SCORE_MATCHES='+str(h==m.get('score_home') and a==m.get('score_away')))
             print('SNAPSHOT_IS_OLD_ONE_ZERO='+str(h==1 and a==0))
             print('UNDER_VOTES_MAJORITY='+str(o.get('under_count',0)>o.get('over_count',0)))
             print('VIEW_ALREADY_MARKED_HISTORICAL='+str(bool(o.get('historical'))))
             rows=db.execute("select match_key,bet from agent_market_predictions where lower(home) like '%mirassol%' and lower(away) like '%botafogo%' and market_line='buts' order by created_at desc limit 30").fetchall()
             print('INDIVIDUAL_UNDER_AT_TWO_ZERO_EXISTS='+str(any(str(k).endswith('_2-0') and 'under' in str(b).lower() for k,b in rows)))
            db.close()
            PY
