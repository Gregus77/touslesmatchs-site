name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real post-repair votes and deliveries read-only
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,json,sqlite3,datetime,urllib.request
            since='2026-09-19 18:12:36'
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
            print('NOW='+datetime.datetime.now(datetime.timezone.utc).isoformat())
            rows=db.execute("select agent_name,http_status,issue,count(*) n,sum(vote_produit) votes,max(created_at) last from agent_calls where created_at>=? group by agent_name,http_status,issue",(since,)).fetchall()
            seats=['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen']
            issues=['ok','http_erreur','timeout','illisible','vide','reseau','indisponible']
            print('POST_CALLS='+json.dumps([{**dict(r),'agent_name':r['agent_name'] if r['agent_name'] in seats else 'other','issue':r['issue'] if r['issue'] in issues else 'other'} for r in rows]))
            rows=db.execute("select channel,count(*) n,max(telegram_message_id) message_id,max(created_at) last from telegram_signal_deliveries where created_at>=? and ok=1 and telegram_message_id is not null group by channel",(since,)).fetchall()
            print('POST_DELIVERIES='+json.dumps([{**dict(r),'channel':r['channel'] if r['channel'] in ['free','premium','ru_free','ru_premium'] else 'other'} for r in rows]))
            print('SPENDING='+json.dumps([dict(r) for r in db.execute("select day,status,count(*) n,round(sum(charged_eur),4) charged from openrouter_global_calls where day=date('now') group by day,status")]))
            db.close()
            for path,expected in [('/app/server.js','ec355eea6ee0bc403f74a40376b979507fc25c5b417b11a62e2483cb05ca2c95'),('/app/ai_budget_guard.js','071bd258c5d2e27bfb880772463ea005c8b3c6460ee4b80a2457bdea1a472acb')]:
             p=subprocess.run(['docker','exec','touslesmatchs-api','sha256sum',path],capture_output=True,text=True)
             print('CODE_UNCHANGED='+json.dumps({'file':path,'same':p.returncode==0 and p.stdout.split()[0]==expected}))
            for endpoint in ['/health','/live-matches']:
             try:
              with urllib.request.urlopen('http://127.0.0.1:3001'+endpoint,timeout=12) as r:
               d=json.loads(r.read());print('HTTP='+json.dumps({'route':endpoint,'status':r.status}))
              if endpoint=='/live-matches':
               matches=d.get('matches',[])
               print('LIVE_COUNTS='+json.dumps({'all':len(matches),'15_45':sum(isinstance(x.get('minute'),(int,float)) and 15<=x['minute']<=45 for x in matches),'analysable':sum(x.get('analysable') is True for x in matches)}))
               out=[]
               for m in matches:
                q=m.get('ou25',{})
                out.append({'fixture':m.get('fixtureId',m.get('id')),'minute':m.get('minute'),'analysable':m.get('analysable'),'analysis_verified':m.get('analysis_verified'),'delivered':m.get('signal_delivered'),'telegram_proven':m.get('telegram_delivery_proven'),'ou25_keys':list(q.keys()) if isinstance(q,dict) else []})
               print('LIVE_STATES='+json.dumps(out))
             except Exception as e:print('HTTP_READ_FAILED='+type(e).__name__)
            PY
            python3 - <<'PY'
            import subprocess,json,sqlite3,urllib.request,re,time,datetime
            env={}
            p=subprocess.run(['docker','inspect','touslesmatchs-api'],capture_output=True,text=True)
            i=json.loads(p.stdout)[0]
            for v in i['Config']['Env']:
             k,_,x=v.partition('=');env[k]=x
            print('OBSERVER_CONFIG='+json.dumps({k:env.get(k) if re.fullmatch(r'[0-9.]+|true|false',env.get(k,'')) else 'unset_or_other' for k in ['AUTO_CONCILE_ENABLED','AUTO_CONCILE_INTERVAL_MS','AUTO_CONCILE_MAX_PER_CYCLE','AUTO_CONCILE_MAX_MATCHES','OPENROUTER_FALLBACK_DAILY_CAP']}),flush=True)
            for step in range(9):
             db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
             rows=db.execute("select agent_name,count(*),sum(vote_produit),max(created_at) from agent_calls where created_at>='2026-09-19 18:12:36' group by agent_name").fetchall()
             seats=['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen']
             print('WATCH='+json.dumps({'time':datetime.datetime.now(datetime.timezone.utc).isoformat(),'seats':[{'seat':r[0] if r[0] in seats else 'other','calls':r[1],'votes':r[2],'last':r[3]} for r in rows]}),flush=True)
             db.close()
             if sum(r[2] or 0 for r in rows)>=5:break
             if step<8:time.sleep(30)
            p=subprocess.run(['docker','logs','--since','2026-09-19T18:12:19Z','touslesmatchs-api'],capture_output=True,text=True)
            s=p.stdout+'\n'+p.stderr
            terms=['runAutoConcile','auto-concile','daily_requests','plafond de requêtes','budget','aucun vote exploitable','aucun fournisseur','429','402','EADDRINUSE','Cannot find module']
            print('LOG_CATEGORIES='+json.dumps({k:s.lower().count(k.lower()) for k in terms}))
            try:
             with urllib.request.urlopen('http://127.0.0.1:3001/live-matches',timeout=15) as r:d=json.loads(r.read())
             rows=[]
             for m in d.get('matches',[]):
              q=m.get('ou25') or {}
              if q.get('consensus_at') and str(q['consensus_at'])>='2026-09-19T18:12:36':
               rows.append({'fixture':m.get('fixtureId'),'votes':q.get('vote_count'),'consensus':q.get('consensus_count'),'over':q.get('over_count'),'under':q.get('under_count'),'at':q.get('consensus_at')})
             print('API_AFTER='+json.dumps(rows))
            except Exception as e:print('API_READ_ERROR='+type(e).__name__)
            PY
