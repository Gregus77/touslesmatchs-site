name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read aggregate evidence without sending messages or changing production
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,json,pathlib,hashlib,re,sqlite3
            def run(a):return subprocess.run(a,capture_output=True,text=True,timeout=30)
            inspect=json.loads(run(['docker','inspect','touslesmatchs-api']).stdout)[0]
            env=dict(x.split('=',1) for x in inspect['Config']['Env'])
            allow=['OPENROUTER_MAX_REQUESTS_PER_DAY','OPENROUTER_MAX_MATCHES_PER_DAY','OPENROUTER_MAX_REQUESTS_PER_MODEL_PER_DAY','OPENROUTER_PARIS_SCHEDULE','OPENROUTER_DAILY_BUDGET_EUR','OPENROUTER_CONCILE_DAILY_BUDGET_EUR','AI_GUARD_SPIKE_THRESHOLD','OPENROUTER_HARD_STOP','OPENROUTER_FALLBACK_DAILY_CAP']
            print('RUNTIME_LIMITS='+json.dumps({k:env.get(k) if re.fullmatch(r'[0-9.]+|true|false',env.get(k,'')) else 'unset_or_other' for k in allow}))
            p=run(['docker','compose','config','--format','json'])
            if p.returncode==0:
             c=json.loads(p.stdout)['services']['api']; e=c.get('environment',{})
             print('COMPOSE_ENV_DIFFERENCES='+json.dumps([k for k in set(env)|set(e) if str(env.get(k,''))!=str(e.get(k,''))]))
             print('COMPOSE_LIMITS='+json.dumps({k:e.get(k) if re.fullmatch(r'[0-9.]+|true|false',str(e.get(k,''))) else 'unset_or_other' for k in allow}))
             print('COMPOSE_API_FIELDS='+json.dumps(list(c.keys())))
             print('RUNTIME_MOUNTS='+json.dumps([{'source':m['Source'],'dest':m['Destination'],'rw':m['RW']} for m in inspect['Mounts']]))
            for path,remote in [('scripts/ai_budget_guard.js','/app/ai_budget_guard.js'),('scripts/api_server.js','/app/server.js'),('scripts/ai_models.config.js','/app/ai_models.config.js'),('scripts/telegram_client.js','/app/telegram_client.js')]:
             data=pathlib.Path(path).read_bytes();r=run(['docker','exec','touslesmatchs-api','sha256sum',remote])
             live=r.stdout.split()[0] if r.returncode==0 else 'missing'
             print('FILE_HASH='+json.dumps({'path':path,'local':hashlib.sha256(data).hexdigest(),'runtime':live,'same':live==hashlib.sha256(data).hexdigest()}))
            g=pathlib.Path('scripts/ai_budget_guard.js').read_text()
            for term in ['function parisBudget','function getDailyStats','function reserveGlobal']:
             i=g.find(term); print('GUARD_FRAGMENT='+json.dumps({'function':term,'code':g[i:i+1800] if i>=0 else 'absent'}))
            js="const m=require('/app/ai_models.config');console.log('SAFE_MODELS='+JSON.stringify(m.listEnabledModels().map(k=>({key:k,limit:m.getModel(k).dailyLimit,maxTokens:m.getModel(k).maxTokensOut}))));"
            r=run(['docker','exec','touslesmatchs-api','node','-e',js])
            for l in r.stdout.splitlines():
             if l.startswith('SAFE_MODELS='):print(l)
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            print('MODEL_COUNTS='+json.dumps(db.execute("select model_key,count(*) from ai_call_budget_log where status='ok' and created_at>=date('now') group by model_key").fetchall()))
            print('OPENING='+json.dumps(db.execute("select day,eur from openrouter_global_opening where day=date('now')").fetchall()))
            db.close()
            for path in ['scripts/test_ai_budget_guard.js','scripts/test_openrouter_global_budget.js','scripts/test_hermes_schedule_and_shared_budget_20260918.js','scripts/test_ia3_provider_routing_20260918.js']:
             print('TEST_PRESENT='+json.dumps({'path':path,'exists':pathlib.Path(path).exists()}))
            p=pathlib.Path('/opt/backups/tlm-openrouter-weekend-20260919/codex-private.log')
            if p.exists():
             s=p.read_text(errors='replace').lower()
             # Only literal known blockers; no raw log output.
             for token in ['permission denied','sandbox','network','bloqu','refus']:
              matches=[s[max(0,m.start()-120):m.end()+180] for m in re.finditer(re.escape(token),s)]
              print('BLOCK_CONTEXT_FLAGS='+json.dumps({'token':token,'docker':any('docker' in x for x in matches),'git':any('git' in x for x in matches),'dns':any('dns' in x or 'resolve' in x for x in matches),'socket':any('socket' in x for x in matches),'approval':any('approv' in x for x in matches),'network':any('network' in x or 'réseau' in x for x in matches)}))
            PY
