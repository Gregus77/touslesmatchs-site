name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real post-repair votes and deliveries read-only
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import sqlite3,json,urllib.request,subprocess
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
            r=db.execute("select * from official_vote_snapshots where fixture_id=? order by created_at desc limit 1",('1493141',)).fetchone()
            if r:
             def num(v):
              try:return float(v)
              except:return None
             minute=num(r['minute']);conf=num(r['confidence']);odd=num(r['real_odd'])
             print('SNAPSHOT_CHECKS='+json.dumps({'present':True,'four_agree':(num(r['consensus_votes']) or 0)>=4,'minute_35_45':minute is not None and 35<=minute<=45,'confidence_present':conf is not None,'confidence_at_least_77':conf is not None and conf>=77,'odd_present':odd is not None and odd>0,'odd_in_130_210':odd is not None and 1.30<=odd<=2.10}))
             rows=db.execute("select block_reason from signal_decision_journal where match_key=? or snapshot_key=? order by id desc limit 12",(r['analysis_match_key'],r['id'])).fetchall()
             s=' '.join(str(x[0] or '') for x in rows).lower()
             print('JOURNAL_CHECKS='+json.dumps({'reason_present':bool(s.strip()),'odds':any(x in s for x in ['cote','odd']),'confidence':any(x in s for x in ['confiance','confidence']),'window':any(x in s for x in ['minute','window','fenêtre']),'recovery':'recovery' in s,'quorum':'quorum' in s,'already_sent':any(x in s for x in ['already','déjà','deja']),'data':any(x in s for x in ['data','donnée']),'red_card':any(x in s for x in ['rouge','red_card'])}))
             # Semantic analysis of rejection messages stays local; only booleans leave VPS.
             a=db.execute("select diffusion_block,raison,stats_status from concile_analyses where match_key=? order by id desc limit 1",(r['analysis_match_key'],)).fetchone()
             if a:
              s=' '.join(str(v or '') for v in a).lower()
              print('ANALYSIS_CHECKS='+json.dumps({'present':True,'odds':any(x in s for x in ['cote','odd']),'confidence':any(x in s for x in ['confiance','confidence']),'recovery':'recovery' in s,'data':any(x in s for x in ['data','donnée']),'insufficient':any(x in s for x in ['insuffis','missing','absen']),'stale':any(x in s for x in ['stale','périm','ancien'])}))
            db.close()
            p=subprocess.run(['docker','logs','--since','2026-09-19T18:12:19Z','touslesmatchs-api'],capture_output=True,text=True)
            s=(p.stdout+p.stderr).lower()
            for term in ['telegram','signal','diffusion','1493141']:
             lines=[l for l in s.splitlines() if term in l]
             joined=' '.join(lines)
             print('DELIVERY_LOG_FLAGS='+json.dumps({'topic':term,'present':bool(lines),'odds':any(x in joined for x in ['cote','odd']),'confidence':any(x in joined for x in ['confidence','confiance']),'recovery':'recovery' in joined,'data':any(x in joined for x in ['missing','insuffis','données']),'error':any(x in joined for x in ['error','erreur','failed']),'window':any(x in joined for x in ['window','fenêtre','minute'])}))
            PY
