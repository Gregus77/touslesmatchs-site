name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read aggregate evidence without sending messages or changing production
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,json,pathlib,hashlib
            def run(a):
             p=subprocess.run(a,capture_output=True,text=True,timeout=40)
             if p.returncode:raise RuntimeError('command_failed')
             return p.stdout
            i=json.loads(run(['docker','inspect','touslesmatchs-api']))[0]
            c=json.loads(run(['docker','compose','config','--format','json']))['services']['api']
            branch=run(['git','branch','--show-current']).strip();head=run(['git','rev-parse','HEAD']).strip();up=run(['git','rev-parse','--abbrev-ref','--symbolic-full-name','@{u}']).strip()
            remote=run(['git','ls-remote','origin','refs/heads/'+branch]).split()[0]
            print('BRANCH_GATE='+json.dumps({'branch':branch,'head':head,'upstream':up,'remote':remote,'same':head==remote}))
            print('CONFIG_COMPAT='+json.dumps({'command':c.get('command')==i['Config'].get('Cmd'),'entrypoint':c.get('entrypoint')==i['Config'].get('Entrypoint'),'restart':c.get('restart')==i['HostConfig']['RestartPolicy']['Name'],'running':i['State']['Running']}))
            print('API_IMAGE='+i['Image'])
            p=pathlib.Path('.env')
            print('ENV_FILE='+json.dumps({'exists':p.exists(),'symlink':p.is_symlink(),'mode':oct(p.stat().st_mode & 0o777)}))
            rows=[x for x in p.read_text().splitlines() if x.startswith('OPENROUTER_MAX_REQUESTS_PER_DAY=')]
            print('ENV_REQUEST_LIMIT='+json.dumps({'count':len(rows),'value':rows[0].split('=',1)[1] if len(rows)==1 and rows[0].split('=',1)[1].isdigit() else 'other'}))
            # Tests in-memory against actual running guard; network notifications explicitly disabled.
            js=r"""
            const D=require('better-sqlite3'),g=require('/app/ai_budget_guard'),assert=require('assert');
            const log=console.log;console.log=console.warn=console.error=()=>{};
            const db=new D(':memory:');g.ensureSchema(db);
            const cfg=g.CFG;assert.equal(cfg.hardStop,true);const original=cfg.maxRequestsPerDay;
            const oldDate=new Date().toISOString().slice(0,10)+' 00:01:00';
            const insert=db.prepare("INSERT INTO ai_call_budget_log(request_key,model_key,match_key,status,cost_estimate_eur,created_at) VALUES (?,?,?,'ok',0,?)");
            for(let n=0;n<750;n++)insert.run('seed'+n,'seed','seedmatch',oldDate);
            const input={modelKey:'deepseek',matchKey:'isolated-quota-test',market:'Over 2.5',promptVersion:'quota-proof'};
            cfg.maxRequestsPerDay=750;assert.equal(g.canProceed(db,input).allowed,false);
            cfg.maxRequestsPerDay=1000;assert.equal(g.canProceed(db,input).allowed,true);
            db.prepare("UPDATE ai_call_budget_log SET cost_estimate_eur=100 WHERE id=1").run();assert.equal(g.canProceed(db,input).allowed,false);
            db.prepare('DELETE FROM ai_call_budget_log').run();
            g.globalSchema(db);const limit=g.parisBudget().limit;
            assert.equal(limit,6);assert(g.reserveGlobal(db,{model:'isolation'},limit-0.01));assert.equal(g.reserveGlobal(db,{model:'isolation'},0.02),null);
            cfg.maxRequestsPerDay=original;db.close();log('QUOTA_AND_FINANCIAL_TESTS=PASS');
            """
            p=subprocess.run(['docker','exec','-e','TELEGRAM_BOT_TOKEN=','-e','TELEGRAM_ADMIN_CHAT_ID=','touslesmatchs-api','node','-e',js],capture_output=True,text=True,timeout=30)
            print('TEST_EXIT='+str(p.returncode))
            print('QUOTA_AND_FINANCIAL_TESTS='+('PASS' if p.returncode==0 and 'QUOTA_AND_FINANCIAL_TESTS=PASS' in p.stdout else 'FAIL'))
            PY
