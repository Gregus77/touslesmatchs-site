name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Bounded isolated shadow candidate transport test
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,json,os,pathlib,datetime
            code=r"""
            const D=require('better-sqlite3'),g=require('/app/ai_budget_guard'),models=require('/app/ai_models.config'),https=require('https'),fs=require('fs');
            const db=new D('/data/tlm.db');
            const get=url=>new Promise((resolve,reject)=>{const req=https.get(url,{timeout:15000},r=>{let s='';r.on('data',x=>s+=x);r.on('end',()=>{try{resolve(JSON.parse(s))}catch{reject(Error('parse'))}});});req.on('error',reject);req.on('timeout',()=>req.destroy(Error('timeout')));});
            (async()=>{
             const p=g.parisBudget(),s=g.getDailyStats(db),candidate=models.getModel('kimi').id;
             const catalog=await get('https://openrouter.ai/api/v1/models');
             const entry=catalog.data.find(x=>x.id===candidate);
             const independent=!['deepseek','perplexity','luna','qwen'].some(k=>models.getModel(k).id===candidate);
             console.log('CANDIDATE_IS_SHADOW='+String(models.getModel('kimi').mode==='test'));
             console.log('CANDIDATE_DISTINCT='+String(independent));
             console.log('CANDIDATE_LISTED='+String(!!entry));
             if(!entry||!independent) return;
             const recent=db.prepare("SELECT count(*) n FROM agent_calls WHERE model=? AND vote_produit=1").get(candidate).n;
             console.log('CANDIDATE_PRIOR_REAL_VOTE='+String(recent>0));
             const body={model:candidate,max_tokens:400,temperature:0.3,messages:[{role:'user',content:'Test technique isolé, sans pronostic officiel et sans données de match. Réponds uniquement avec cet objet JSON pour vérifier le transport et le format : {"status":"ok","abstention":true,"raison":"Données de match absentes"}.'}]};
             const fx=Number(process.env.OPENROUTER_USD_PER_EUR||1),pricing=entry.pricing;
             const reservation=((Buffer.byteLength(JSON.stringify(body.messages))+512)*Number(pricing.prompt||0)+400*Number(pricing.completion||0)+Number(pricing.request||0)+Number(pricing.web_search||0)+.01)/fx;
             const tests=db.prepare("SELECT coalesce(sum(coalesce(charged_eur,reserved_eur)),0) n FROM openrouter_global_calls WHERE day=? AND model=?").get(p.day,candidate).n;
             if(!(reservation>0&&reservation<=.05&&tests+reservation<=.25&&s.requests<s.budget.maxRequestsPerDay)){console.log('CANDIDATE_TEST_BUDGET_ALLOWED=false');return;}
             console.log('CANDIDATE_TEST_BUDGET_ALLOWED=true');
             const response=await g.withGlobalBudget(db,body,()=>new Promise((resolve,reject)=>{
             const req=https.request('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+process.env.OPENROUTER_API_KEY,'Content-Type':'application/json'},timeout:25000},r=>{let raw='';r.on('data',x=>raw+=x);r.on('end',()=>{try{resolve({...JSON.parse(raw),_httpStatus:r.statusCode})}catch{resolve({_httpStatus:r.statusCode})}})});
             req.on('error',reject);req.on('timeout',()=>req.destroy(Error('timeout')));req.end(JSON.stringify(body));
             }));
             let valid=false;try{const raw=response.choices?.[0]?.message?.content||'';const obj=JSON.parse(raw.replace(/^```(?:json)?\s*|\s*```$/g,''));valid=obj.status==='ok'&&obj.abstention===true;}catch{}
             const ok=response._httpStatus===200&&valid;
             console.log('CANDIDATE_HTTP_OK='+String(response._httpStatus===200));
             console.log('CANDIDATE_VALID_RESPONSE='+String(valid));
             const path='/data/tlm-seat3-candidate-20260919.json';
             fs.writeFileSync(path,JSON.stringify({at:new Date().toISOString(),candidate,ok,independent,kind:'transport_test_not_official',financialLimit:p.limit}),{mode:0o600});
             db.close();
            })().catch(()=>{console.log('CANDIDATE_TEST_COMPLETED=false');db.close()});
            """
            p=subprocess.run(['docker','exec','-i','touslesmatchs-api','node'],input=code,capture_output=True,text=True)
            for l in p.stdout.splitlines():
             if l.startswith('CANDIDATE_') and l.rsplit('=',1)[-1] in ['true','false']:print(l)
            if p.returncode:print('CANDIDATE_PROCESS_OK=False')
            PY
