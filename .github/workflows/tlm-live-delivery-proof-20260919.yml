name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real votes after approved budget recovery
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,pathlib,sqlite3,urllib.request,subprocess,datetime,os
            backup=pathlib.Path(json.loads(pathlib.Path('data/tlm-budget-recovery-current.json').read_text())['backup'])
            deployment=json.loads((backup/'deployment.json').read_text());since=deployment['at']
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
            flags={}
            for i,seat in enumerate(['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen'],1):
             flags['SEAT_'+str(i)+'_NEW_REAL_VOTE']=bool(db.execute("select 1 from agent_calls where agent_name=? and vote_produit=1 and datetime(created_at)>=datetime(?) limit 1",(seat,since)).fetchone())
            data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=20))
            flags['CURRENT_ANALYSIS_WINDOW_PRESENT']=any(isinstance(m.get('minute'),(int,float)) and 15<=m['minute']<=45 and m.get('status') not in ['HT','FT'] for m in data.get('matches',[]))
            flags['CURRENT_ELIGIBLE_MATCH_PRESENT']=any(m.get('analysable') and isinstance(m.get('minute'),(int,float)) and 15<=m['minute']<=45 and m.get('status') not in ['HT','FT'] for m in data.get('matches',[]))
            flags['NEW_TELEGRAM_DELIVERY_PROVEN']=bool(db.execute("select 1 from telegram_signal_deliveries where ok=1 and telegram_message_id is not null and datetime(created_at)>=datetime(?) limit 1",(since,)).fetchone())
            route=json.loads(pathlib.Path('data/tlm-seat3-routing-current.json').read_text())
            flags['KIMI_ROUTE_PRESERVED']=bool(db.execute('select 1 from model_overrides where logical_id=? and model_id=?',(route['logical'],route['candidate'])).fetchone())
            for k,v in flags.items():print(k+'='+str(v))
            fd=os.open(str(backup/'verification.json'),os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
            with os.fdopen(fd,'w') as f:json.dump({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'flags':flags},f)
            db.close()
            code="const g=require('/app/ai_budget_guard'),D=require('better-sqlite3'),db=new D('/data/tlm.db',{readonly:true});const s=g.getDailyStats(db);console.log('REQUEST_HEADROOM_AVAILABLE='+String(s.requests<s.budget.maxRequestsPerDay));console.log('ALL_MODEL_QUOTAS_AVAILABLE='+String(s.byModel.every(x=>x.requests<400)));console.log('FROM_THIRTY_PRESERVED='+String(require('/app/official_signal_snapshots').OFFICIAL_FROM_MINUTE===30));db.close();"
            p=subprocess.run(['docker','exec','touslesmatchs-api','node','-e',code],capture_output=True,text=True)
            for l in p.stdout.splitlines():
             if l.split('=')[0] in ['REQUEST_HEADROOM_AVAILABLE','ALL_MODEL_QUOTAS_AVAILABLE','FROM_THIRTY_PRESERVED'] and l.rsplit('=',1)[-1] in ['true','false']:print(l)
            PY
