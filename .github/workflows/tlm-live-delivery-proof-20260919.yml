name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare and test first-half delivery candidate safely
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,pathlib,os,json,datetime,sqlite3,fcntl
            def run(a):return subprocess.check_output(a,text=True,stderr=subprocess.DEVNULL).strip()
            lock=open('/var/lock/tlm-production-deploy.lock','a');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
            branch=run(['git','branch','--show-current']);head=run(['git','rev-parse','HEAD']);up=run(['git','rev-parse','--abbrev-ref','@{upstream}'])
            assert up=='origin/'+branch and run(['git','ls-remote','origin','refs/heads/'+branch]).split()[0]==head
            subprocess.run(['git','fetch','origin','codex/first-half-delivery-20260919'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True)
            revision=run(['git','rev-parse','FETCH_HEAD'])
            assert revision=='2caa6cbd4c12d5f28d054cc299ae62c0c7946877'
            stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
            backup=pathlib.Path('/opt/backups/tlm-firsthalf-'+stamp);backup.mkdir(mode=0o700)
            cand=backup/'candidate';cand.mkdir(mode=0o700)
            def save(path,content):
             path.write_text(content);os.chmod(path,0o600)
            save(backup/'worktree.patch',run(['git','diff','--binary','HEAD']))
            inspect=json.loads(run(['docker','inspect','touslesmatchs-api']))[0]
            save(backup/'inspect.json',json.dumps(inspect))
            for name in ['server.js','telegram_client.js','official_signal_snapshots.js','bookmakers.config.js']:
             src=run(['docker','exec','touslesmatchs-api','cat','/app/'+name])
             save(backup/(name+'.before'),src)
             save(cand/name,src)
            for name in ['first_half_delivery.js','test_first_half_delivery_20260919.js']:
             save(cand/name,run(['git','show',revision+':scripts/'+name]))
            patches=json.loads("{\"server.js\":[{\"old\":\"const clientTelegramPublisher = telegramClient.createPublisher({\",\"new\":\"const firstHalfDelivery = require('./first_half_delivery');\\nconst validateFirstHalfDelivery = firstHalfDelivery.createValidator({\\n  db,\\n  fetchFixture: async (id) => {\\n    if (!/^\\\\d+$/.test(String(id)) || !API_SPORTS_KEY || !apiSportsBudgetOk()) throw new Error('period_unavailable');\\n    const response = await httpGet('https://v3.football.api-sports.io/fixtures?id=' + encodeURIComponent(id), {'x-apisports-key': API_SPORTS_KEY});\\n    if (apiSportsErrors(response)) throw new Error('period_unavailable');\\n    return (response.response || []).find(f => String(f.fixture?.id) === String(id));\\n  },\\n});\\nconst clientTelegramPublisher = telegramClient.createPublisher({\\n  validateSignal: validateFirstHalfDelivery,\"}],\"telegram_client.js\":[{\"old\":\"paymentAvailable=()=>false}) {\",\"new\":\"paymentAvailable=()=>false,validateSignal=async()=>({ok:false,terminal:true})}) {\"},{\"old\":\"        const claim=db.prepare(\\\"UPDATE client_telegram_outbox SET state='sending'\",\"new\":\"        if(row.kind==='signal') {\\n          let gate;try {gate=await validateSignal(row);} catch {gate={ok:false};}\\n          if(!gate?.ok) {\\n            db.prepare(\\\"UPDATE client_telegram_outbox SET state=?,next_at=? WHERE delivery_key=? AND state='pending'\\\")\\n              .run(gate?.terminal?'expired':'pending',now()+30000,row.delivery_key);\\n            continue;\\n          }\\n          if(row.expires_at<=now()){db.prepare(\\\"UPDATE client_telegram_outbox SET state='expired' WHERE delivery_key=?\\\").run(row.delivery_key);continue;}\\n        }\\n        const claim=db.prepare(\\\"UPDATE client_telegram_outbox SET state='sending'\"}],\"official_signal_snapshots.js\":[{\"old\":\"const OFFICIAL_FROM_MINUTE = 35;\",\"new\":\"const OFFICIAL_FROM_MINUTE = 30;\"}]}")
            for name,edits in patches.items():
             source=(cand/name).read_text()
             for edit in edits:
              assert source.count(edit['old'])==1
              source=source.replace(edit['old'],edit['new'])
             save(cand/name,source)
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            dest=sqlite3.connect(str(backup/'tlm.db'));db.backup(dest);dest.close();db.close();os.chmod(backup/'tlm.db',0o600)
            target='/tmp/tlm-firsthalf-'+stamp
            subprocess.run(['docker','cp',str(cand),'touslesmatchs-api:'+target],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True)
            for name in ['server.js','telegram_client.js','official_signal_snapshots.js','first_half_delivery.js']:
             result=subprocess.run(['docker','exec','touslesmatchs-api','node','--check',target+'/'+name],capture_output=True,text=True)
             assert result.returncode==0
            result=subprocess.run(['docker','exec','-e','NODE_PATH=/app/node_modules','touslesmatchs-api','node',target+'/test_first_half_delivery_20260919.js'],capture_output=True,text=True)
            ok=result.returncode==0 and 'FIRST_HALF_WINDOW_TESTS_PASSED=True' in result.stdout
            save(backup/'tests.private.log',result.stdout+result.stderr)
            save(backup/'state.json',json.dumps({'branch':branch,'head':head,'revision':revision,'backup':str(backup),'testsPassed':ok}))
            save(pathlib.Path('/opt/touslesmatchs/data/tlm-firsthalf-candidate.json'),json.dumps({'backup':str(backup),'testsPassed':ok,'revision':revision}))
            print('CANONICAL_BRANCH_VERIFIED=True')
            print('PRECHANGE_BACKUP_COMPLETE=True')
            print('ACTUAL_RUNTIME_CANDIDATE_SYNTAX_OK=True')
            print('FIRST_HALF_WINDOW_TESTS_PASSED='+str(ok))
            PY
