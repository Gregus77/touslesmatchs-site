name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify persisted seat vote and anonymous access policy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,pathlib,urllib.request,datetime,sqlite3
            info=json.loads(pathlib.Path('data/tlm-seat3-routing-current.json').read_text())
            data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=20))
            fresh=[]
            for m in data.get('matches',[]):
             o=m.get('ou25') or {}
             try:
              if datetime.datetime.fromisoformat(str(o.get('consensus_at')).replace('Z','+00:00'))>=datetime.datetime.fromisoformat(info['at']) and o.get('vote_count')==5:fresh.append(o)
             except:pass
            print('NEW_FIVE_VOTE_SNAPSHOT_PRESENT='+str(bool(fresh)))
            print('PUBLIC_DETAILS_LOCKED='+str(any(o.get('locked') for o in fresh)))
            print('PUBLIC_VOTE_ARRAY_PRESENT='+str(any(isinstance(o.get('votes'),list) and len(o['votes'])==5 for o in fresh)))
            print('PUBLIC_VOTE_OBJECT_PRESENT='+str(any(isinstance(o.get('votes'),dict) for o in fresh)))
            d=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            rows=d.execute("select votes_json from official_vote_snapshots where datetime(created_at)>=datetime(?)",(info['at'],)).fetchall()
            valid=False
            for (raw,) in rows:
             try:
              votes=json.loads(raw)
              if len(votes)>=3 and votes[2].get('direction') in ['over','under'] and votes[2].get('status')=='voted':valid=True
             except:pass
            print('NEW_IA3_PERSISTED_SNAPSHOT_VOTE='+str(valid))
            d.close()
            PY
