name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm exact per-seat quota and replacement status
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import sqlite3,json,subprocess
            d=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);d.row_factory=sqlite3.Row
            r=d.execute("select model,created_at from agent_calls where agent_name='Mistral-Large' order by id desc limit 1").fetchone()
            if r:
             rows=d.execute("select status from openrouter_global_calls where model=? and abs((julianday(created_at)-julianday(?))*86400)<10",(r['model'],r['created_at'])).fetchall()
             print('IA3_LATEST_HAS_PROVIDER_RESERVATION='+str(bool(rows)))
             print('IA3_LATEST_PROVIDER_REJECTION='+str(any(x['status']=='rejected' for x in rows)))
             o=d.execute("select model_id from model_overrides where logical_id='mistralai/mistral-small-2603'").fetchone()
             print('IA3_REPLACEMENT_STILL_SELECTED='+str(bool(o and o[0]==r['model'])))
            for i,seat in enumerate(['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen'],1):
             r=d.execute("select detail,issue from agent_calls where agent_name=? order by id desc limit 1",(seat,)).fetchone()
             s=str(r['detail'] or '').lower() if r else ''
             print('SEAT_'+str(i)+'_MODEL_DAILY_LIMIT_REASON='+str('plafond quotidien du modèle' in s))
             print('SEAT_'+str(i)+'_NO_PROVIDER_AVAILABLE='+str(bool(r and r['issue']=='indisponible')))
            d.close()
            code="""const D=require('better-sqlite3'),g=require('/app/ai_budget_guard'),m=require('/app/ai_models.config'),d=new D('/data/tlm.db',{readonly:true});const s=g.getDailyStats(d);for(const [i,key] of ['perplexity','deepseek','mistral','luna','qwen'].entries()){const used=s.byModel.filter(x=>m.normalizeModelKey(x.model_key)===key).reduce((v,x)=>v+x.requests,0);console.log('SEAT_'+(i+1)+'_QUOTA_EXHAUSTED='+String(used>=m.getModel(key).dailyLimit));}d.close();"""
            p=subprocess.run(['docker','exec','touslesmatchs-api','node','-e',code],text=True,capture_output=True)
            for l in p.stdout.splitlines():
             if l.startswith('SEAT_') and l.rsplit('=',1)[-1] in ['true','false']:print(l)
            PY
