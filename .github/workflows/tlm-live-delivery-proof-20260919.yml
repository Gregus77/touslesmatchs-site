name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify seat three recovery using owner-authorized booleans
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import sqlite3,json,urllib.request
            d=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);d.row_factory=sqlite3.Row
            r=d.execute("select count(*) n,sum(vote_produit) votes from agent_calls where agent_name='Mistral-Large' and created_at>=datetime('now','-30 minutes')").fetchone()
            print('IA3_RECENT_CALLS_PRESENT='+str(bool(r['n'])))
            print('IA3_RECENT_REAL_VOTE='+str(bool(r['votes'])))
            r=d.execute("select http_status,issue,vote_produit,detail from agent_calls where agent_name='Mistral-Large' order by id desc limit 1").fetchone()
            if r:
             s=str(r['detail'] or '').lower()
             print('IA3_LATEST_REAL_VOTE='+str(bool(r['vote_produit'])))
             print('IA3_LATEST_HTTP429='+str(r['http_status']==429))
             print('IA3_LATEST_TIMEOUT='+str(r['issue']=='timeout'))
             print('IA3_LATEST_BUDGET_REASON='+str('budget' in s))
             print('IA3_LATEST_QUOTA_REASON='+str(any(w in s for w in ['quota','daily_requests','daily limit','model_daily','per_model'])))
            try:
             data=json.load(urllib.request.urlopen('http://127.0.0.1:3001/live-matches',timeout=15))
             fresh=[m.get('ou25') or {} for m in data.get('matches',[]) if 15<=int(m.get('minute') or 0)<=45 and not m.get('pinnedSignal')]
             print('CURRENT_ANALYSIS_WINDOW_PRESENT='+str(bool(fresh)))
             print('CURRENT_FIVE_VOTES_PRESENT='+str(any(o.get('vote_count')==5 for o in fresh)))
            except:print('LIVE_CHECK_COMPLETED=False')
            d.close()
            PY
