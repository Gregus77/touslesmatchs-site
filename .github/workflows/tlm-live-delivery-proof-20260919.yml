name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real post-repair votes and deliveries read-only
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import urllib.request,json,sqlite3
            with urllib.request.urlopen('http://127.0.0.1:3001/live-matches',timeout=15) as r:d=json.loads(r.read())
            flags={k:False for k in ['new_five_votes','new_signal_delivered','missing_odds','confidence_block','outside_window','recovery_block','league_block','other_block']}
            for m in d.get('matches',[]):
             q=m.get('ou25') or {}
             if str(m.get('fixtureId',m.get('id')))!='1493141':continue
             flags['new_five_votes']=q.get('vote_count')==5
             flags['new_signal_delivered']=m.get('telegram_delivery_proven') is True
             text=' '.join(str(m.get(k) or '') for k in ['block_reason','analysis_exclusion_reason','diffusion_block','delivery_status']).lower()
             flags['missing_odds']=any(x in text for x in ['cote','odds','odd'])
             flags['confidence_block']=any(x in text for x in ['confiance','confidence'])
             flags['outside_window']=any(x in text for x in ['fenêtre','fenetre','window','minute'])
             flags['recovery_block']='recovery' in text
             flags['league_block']=any(x in text for x in ['championnat','league','competition'])
             flags['other_block']=bool(text.strip()) and not any(flags[k] for k in ['missing_odds','confidence_block','outside_window','recovery_block','league_block'])
            print('RECOVERY_FLAGS='+json.dumps(flags))
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            count=db.execute("select count(*) from telegram_signal_deliveries where ok=1 and telegram_message_id is not null and created_at>='2026-09-19 18:12:36'").fetchone()[0]
            print('NEW_TELEGRAM_DELIVERY_PRESENT='+str(count>0))
            # Classify locally, without publishing records, odds, names, IDs or free text.
            texts=db.execute("select block_reason from signal_decision_journal where created_at>='2026-09-19 18:12:36' and match_key in (select distinct match_key from agent_calls where created_at>='2026-09-19 18:12:36' and vote_produit=1)").fetchall()
            s=' '.join(str(x[0] or '') for x in texts).lower()
            print('DISPOSITION_FLAGS='+json.dumps({'odds':any(x in s for x in ['cote','odds','odd']),'confidence':any(x in s for x in ['confiance','confidence']),'window':any(x in s for x in ['fenêtre','fenetre','window','minute']),'recovery':'recovery' in s,'reason_recorded':bool(s.strip())}))
            db.close()
            for path in ['/','/api/health','/api/live-matches']:
             try:
              with urllib.request.urlopen('https://www.touslesmatchs.com'+path,timeout=15) as r:
               status=r.status;body=r.read(5000000)
              info={'path':path,'http':status}
              if path=='/api/live-matches':
               data=json.loads(body);matches=data.get('matches',[]) if isinstance(data,dict) else data
               info['new_five_votes_public']=any((m.get('ou25') or {}).get('vote_count')==5 for m in matches if str(m.get('fixtureId',m.get('id')))=='1493141')
              print('PUBLIC_PROOF='+json.dumps(info))
             except Exception:print('PUBLIC_READ_FAILED=True')
            PY
