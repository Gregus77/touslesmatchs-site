name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Distinguish provider refusal from internal limits
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import sqlite3,json,subprocess
            d=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);d.row_factory=sqlite3.Row
            r=d.execute("select model,created_at,http_status from agent_calls where agent_name='Mistral-Large' order by id desc limit 1").fetchone()
            if r:
             rows=d.execute("select status from openrouter_global_calls where model=? and abs((julianday(created_at)-julianday(?))*86400)<10",(r['model'],r['created_at'])).fetchall()
             print('IA3_PROVIDER_REQUEST_REJECTED='+str(any(x['status']=='rejected' for x in rows)))
             print('IA3_PROVIDER_REQUEST_COMPLETED='+str(any(x['status']=='completed' for x in rows)))
             print('IA3_GLOBAL_RESERVATION_PRESENT='+str(bool(rows)))
            for seat in ['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen']:
             r=d.execute("select vote_produit from agent_calls where agent_name=? order by id desc limit 1",(seat,)).fetchone()
             print('SEAT_'+str(['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen'].index(seat)+1)+'_LATEST_VOTE='+str(bool(r and r[0])))
            d.close()
            code="""const D=require('better-sqlite3'),g=require('/app/ai_budget_guard'),d=new D('/data/tlm.db',{readonly:true});const s=g.getDailyStats(d),p=g.parisBudget();const u=d.prepare('select coalesce(sum(coalesce(charged_eur,reserved_eur)),0) n from openrouter_global_calls where day=?').get(p.day).n;console.log('GLOBAL_MONEY_AVAILABLE='+String(u+0.05<p.limit));console.log('GLOBAL_REQUESTS_AVAILABLE='+String(s.requests<s.budget.maxRequestsPerDay));console.log('IA3_MODEL_QUOTA_AVAILABLE='+String(s.byModel.filter(x=>/mistral/i.test(x.model_key)).every(x=>x.requests<180)));d.close()"""
            p=subprocess.run(['docker','exec','touslesmatchs-api','node','-e',code],capture_output=True,text=True)
            if p.returncode==0:
             for l in p.stdout.splitlines():
              if l in [k+'='+v for k in ['GLOBAL_MONEY_AVAILABLE','GLOBAL_REQUESTS_AVAILABLE','IA3_MODEL_QUOTA_AVAILABLE'] for v in ['true','false']]:print(l)
            else:print('GUARD_CHECK_COMPLETED=False')
            PY
