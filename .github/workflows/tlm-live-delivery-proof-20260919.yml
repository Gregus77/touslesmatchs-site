name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Classify image build issue without private logs
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,pathlib
            p=pathlib.Path(json.loads(pathlib.Path('data/tlm-firsthalf-candidate.json').read_text())['backup'])
            s=(p/'build.private.log').read_text().lower()
            for k,v in {'BUILD_IMAGE_RESOLUTION_ERROR':any(x in s for x in ['pull access denied','failed to resolve source metadata','load metadata','invalid reference format']),'BUILD_DISK_ERROR':'no space left' in s,'BUILD_COPY_ERROR':'failed to compute cache key' in s,'BUILD_DOCKERFILE_ERROR':'dockerfile parse error' in s}.items():print(k+'='+str(v))
            PY
