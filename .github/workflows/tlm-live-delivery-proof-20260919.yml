name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify model routing cause without exposing configuration
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import sqlite3,json,subprocess,urllib.request
            d=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            r=d.execute("select model,host from agent_calls where agent_name='Mistral-Large' and http_status=429 order by id desc limit 1").fetchone()
            print('IA3_FAILED_FREE_MODEL='+str(bool(r and r[0].endswith(':free'))))
            print('IA3_FAILED_SMALL_2603='+str(bool(r and r[0]=='mistralai/mistral-small-2603')))
            print('IA3_FAILED_OPENROUTER='+str(bool(r and r[1]=='openrouter.ai')))
            env=json.loads(subprocess.check_output(['docker','inspect','touslesmatchs-api'],text=True))[0]['Config']['Env']
            v=dict(x.split('=',1) for x in env)
            logical=v.get('OR_MISTRAL_MODEL') or 'mistralai/mistral-small-2603'
            o=d.execute("select model_id from model_overrides where logical_id=? and lower(coalesce(reason,'')) not like 'promotion :%'",(logical,)).fetchone()
            print('IA3_ACTIVE_OVERRIDE='+str(bool(o)))
            print('IA3_OVERRIDE_FREE='+str(bool(o and o[0].endswith(':free'))))
            print('IA3_CONFIGURED_FREE='+str(logical.endswith(':free')))
            print('IA3_FAILED_LOGICAL_MATCH='+str(bool(r and r[0]==logical)))
            try:
             cat=json.load(urllib.request.urlopen('https://openrouter.ai/api/v1/models',timeout=15))['data']
             ids={x['id'] for x in cat}
             print('MISTRAL_PAID_COUNTERPART_LISTED='+str(bool(r and r[0].removesuffix(':free') in ids)))
             print('MISTRAL_SMALL_2603_LISTED='+str('mistralai/mistral-small-2603' in ids))
            except:print('CATALOG_CHECK=False')
            d.close()
            PY
