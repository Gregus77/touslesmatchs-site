name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Save private recovery handoff and verification
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import json,pathlib,os,datetime,sqlite3,urllib.request
            db=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True)
            seats=['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen']
            counts={seat:db.execute("select count(*) from agent_calls where agent_name=? and vote_produit=1 and created_at>='2026-09-19 18:12:36'",(seat,)).fetchone()[0] for seat in seats}
            receipts=db.execute("select count(*) from telegram_signal_deliveries where ok=1 and telegram_message_id is not null and created_at>='2026-09-19 18:12:36'").fetchone()[0]
            spending=db.execute("select coalesce(sum(charged_eur),0) from openrouter_global_calls where day=date('now')").fetchone()[0]
            db.close()
            d={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'PARTIAL','request_recovery':'verified','request_limit':1000,'financial_limit_unchanged_eur':6,'post_repair_votes':counts,'public_five_votes_verified':True,'post_repair_telegram_receipts':receipts,'new_selection_rejected_by_recovery':True,'accounted_cost_eur':spending,'pending':['Review owner latest weekday/weekend financial budget policy before changing monetary limits; do not apply stale 2/5 pending code blindly','Finish prepared Hermes 09/21 changes and tests; source edits remain undeployed','Verify next admissible client Telegram signal in four destinations; no historical replay','Add the two separate Top5 vs Bottom5 team-goal 0.5 shadow experiments only after production stable'],'deployment':{'image_unchanged':True,'api_source_unchanged':True,'guard_source_unchanged':True,'source_env_updated':True,'backup':'/opt/backups/tlm-request-recovery-20260919T181219Z','frozen_api_compose':'/opt/backups/tlm-request-recovery-20260919T181219Z/api.after.json','note':'API recreated from verified existing image with frozen runtime launch/env and request limit only. Canonical compose still contains pending unverified launch changes; compare before future deployments.'}}
            p=pathlib.Path('/opt/backups/tlm-request-recovery-20260919T181219Z/verification.json')
            fd=os.open(str(p),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
            with os.fdopen(fd,'w') as f:json.dump(d,f,indent=2)
            print('HANDOFF_SAVED=True')
            print('ALL_FIVE_RESUMED='+str(all(n>0 for n in counts.values())))
            print('NEW_TELEGRAM_PROVEN='+str(receipts>0))
            print('FINANCIAL_HARD_STOP_PRESERVED=True')
            PY
