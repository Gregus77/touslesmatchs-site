name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Argentina and Brazil in active match scope
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import pathlib,json,time,urllib.request,subprocess
            p=json.loads(pathlib.Path('data/tlm-papa-banner-current.json').read_text())
            backup=pathlib.Path(p['backup'])
            print('BANNER_EXPIRED='+str(time.time()*1000>=p['expires']))
            print('BANNER_REMOVAL_CONFIRMED='+str((backup/'removed.json').exists()))
            r=subprocess.run(['systemctl','is-active',p['timer']],capture_output=True,text=True)
            print('BANNER_TIMER_ACTIVE='+str(r.stdout.strip()=='active'))
            data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=20))
            for key,country in [('ARGENTINA_MATCH_VISIBLE','argentina'),('BRAZIL_MATCH_VISIBLE','brazil')]:
             print(key+'='+str(any(country in str(m.get('country','')).lower() or country in str(m.get('competition','')).lower() for m in data.get('matches',[]))))
            PY
