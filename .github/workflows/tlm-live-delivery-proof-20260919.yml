name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify expired temporary banner removal
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import pathlib,json,time,urllib.request,subprocess,fcntl,sys,datetime
            try:
             lock=open('/var/lock/tlm-production-deploy.lock','a');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
             state=json.loads(pathlib.Path('data/tlm-papa-banner-current.json').read_text())
             backup=pathlib.Path(state['backup']).resolve()
             assert backup.parent==pathlib.Path('/opt/backups') and backup.name.startswith('tlm-papa-banner-')
             manifest=json.loads((backup/'manifest.json').read_text())
             expired=time.time()*1000>=state['expires']
             assert expired
             paths=[pathlib.Path(p).resolve() for p in manifest['paths']]
             assert all(p.is_relative_to(pathlib.Path('/opt/touslesmatchs')) for p in paths)
             needs_removal=any(manifest['block'] in p.read_text() for p in paths)
             fcntl.flock(lock,fcntl.LOCK_UN)
             if needs_removal:
              result=subprocess.run(['/usr/bin/python3',str(backup/'remove.py')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30)
              assert result.returncode==0
             removed=json.loads((backup/'removed.json').read_text()).get('removed') is True
             flags={'SERVER_REMOVAL_CONFIRMED':removed,'SOURCE_BLOCK_ABSENT':all('TLM-PAPA-TEMPORARY-START' not in p.read_text() for p in paths)}
             for label,path in [('HOME_BANNER_REMOVED','/'),('LIVE_BANNER_REMOVED','/live-ia')]:
              request=urllib.request.Request('https://www.touslesmatchs.com'+path+'?removal_check='+str(int(time.time())),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=20) as response:
               text=response.read().decode()
               flags[label]=response.status==200 and 'TLM-PAPA-TEMPORARY-START' not in text and 'tlm-papa-temporary' not in text
             for key,value in flags.items():print(key+'='+str(value))
             (backup/'removal-verification.json').write_text(json.dumps({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'flags':flags}))
             assert all(flags.values())
             print('REMOVAL_FULLY_VERIFIED=True')
            except Exception:
             print('REMOVAL_FULLY_VERIFIED=False');sys.exit(1)
            PY
