name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Argentina and Brazil in active match scope
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,json,urllib.request,pathlib,datetime
            code="const fs=require('fs'),vm=require('vm');const source=fs.readFileSync('/app/server.js','utf8');\nconst functions=['ownerExpandedLeagueAllowed','leagueHaystack','leagueTier','isWomenMatch','isUsaOrCanadaMatch','isAmericanFootballMatch','isLowTrustCompetition','isCategoryBanned','parseLiveMinuteValue','recoveryNormalize','isClientOu25MatchEligible','isPublicFootballScopeMatch','tlmScopeNorm','tlmScopeCountry'];\nlet code='';\nfor(const name of functions){const start=source.indexOf('function '+name+'(');const end=source.indexOf('\\n}',start)+2;if(start<0||end<2)throw Error('function_missing');code+=source.slice(start,end)+'\\n';}\nfor(const name of ['LOW_TRUST_COMPETITION_KEYWORDS','LEAGUE_TIER_SECONDARY','LEAGUE_TIER_WATCHLIST','TRUSTED_COMPETITIONS','CATEGORY_BAN_KEYWORDS']){\nconst start=source.indexOf('const '+name+' = [');const end=source.indexOf('\\n];',start)+3;if(start<0||end<3)throw Error('constant_missing');code+=source.slice(start,end)+'\\n';}\nconst start=source.indexOf('const PUBLIC_FOOTBALL_BLOCKED_COUNTRIES = new Set([');const end=source.indexOf('\\n]);',start)+4;if(start<0)throw Error('countries_missing');code+=source.slice(start,end)+'\\n';\nconst box={};vm.createContext(box);vm.runInContext(code,box);\nconst cases=[['ARGENTINA_FOLLOW_ENABLED','Argentina','Liga Profesional Argentina'],['BRAZIL_SERIE_A_FOLLOW_ENABLED','Brazil','Serie A'],['BRAZIL_SERIE_B_FOLLOW_ENABLED','Brazil','Serie B']];\nfor(const [label,country,league]of cases){const m={sport:'Football',country,league,competition:league+' · '+country,home:'Home',away:'Away',minute:30};console.log(label+'='+String(box.isClientOu25MatchEligible(m,false,45)&&box.isPublicFootballScopeMatch(m)));}\n"
            result=subprocess.run(['docker','exec','touslesmatchs-api','node','-e',code],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
            if result.returncode:
             print('RUNTIME_SCOPE_CHECK=False')
            else:
             for line in result.stdout.splitlines():
              if line.endswith('=true') or line.endswith('=false'):print(line)
            data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=20))
            for key,country in [('ARGENTINA_MATCH_VISIBLE','argentina'),('BRAZIL_MATCH_VISIBLE','brazil')]:
             print(key+'='+str(any(country in str(m.get('country','')).lower() or country in str(m.get('competition','')).lower() for m in data.get('matches',[]))))
            pathlib.Path('data/tlm-south-america-scope-verification.json').write_text(json.dumps({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':result.stdout,'ok':result.returncode==0}))
            PY
