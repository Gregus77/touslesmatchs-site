name: TLM read-only live and delivery proof
on:
  push:
    branches: [codex/live-delivery-proof-20260919]
    paths: [.github/workflows/tlm-live-delivery-proof-20260919.yml]
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose current five-seat availability without exposing counters
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import sqlite3,json,subprocess,urllib.request
            d=sqlite3.connect('file:/opt/touslesmatchs/data/tlm.db?mode=ro',uri=True);d.row_factory=sqlite3.Row
            for i,seat in enumerate(['Perplexity-Web','DeepSeek-V3','Mistral-Large','OpenRouter-Luna','OpenRouter-Qwen'],1):
             r=d.execute("select vote_produit,http_status,detail,created_at>=datetime('now','-20 minutes') recent from agent_calls where agent_name=? order by id desc limit 1",(seat,)).fetchone()
             s=str(r['detail'] or '').lower() if r else ''
             for label,value in {'RECENT':bool(r and r['recent']),'VOTE':bool(r and r['vote_produit']),'HTTP429':bool(r and r['http_status']==429),'LIMIT_REASON':any(x in s for x in ['budget','plafond','limit','quota'])}.items():print('SEAT_'+str(i)+'_'+label+'='+str(value))
            code="""const D=require('better-sqlite3'),g=require('/app/ai_budget_guard'),d=new D('/data/tlm.db',{readonly:true});const s=g.getDailyStats(d),p=g.parisBudget();const u=d.prepare('select coalesce(sum(coalesce(charged_eur,reserved_eur)),0) n from openrouter_global_calls where day=?').get(p.day).n;console.log('MONEY_HEADROOM='+String(u+.05<p.limit));console.log('MONEY_CAP_REACHED='+String(u>=p.limit-.01));console.log('REQUEST_HEADROOM='+String(s.requests<s.budget.maxRequestsPerDay));console.log('ANY_MODEL_QUOTA_REACHED='+String(s.byModel.some(x=>x.requests>=180)));console.log('CAP_IS_SIX='+String(p.limit===6));d.close();"""
            p=subprocess.run(['docker','exec','touslesmatchs-api','node','-e',code],text=True,capture_output=True)
            for l in p.stdout.splitlines():
             if l.split('=')[0] in ['MONEY_HEADROOM','MONEY_CAP_REACHED','REQUEST_HEADROOM','ANY_MODEL_QUOTA_REACHED','CAP_IS_SIX'] and l.rsplit('=',1)[-1] in ['true','false']:print(l)
            try:
             data=json.load(urllib.request.urlopen('https://www.touslesmatchs.com/api/live-matches',timeout=15))
             print('PUBLIC_LIVE_OK='+str(bool(data.get('ok'))))
             print('ANALYSIS_WINDOW_MATCHES_PRESENT='+str(any(isinstance(m.get('minute'),(int,float)) and 15<=m['minute']<=45 and m.get('status') not in ['HT','FT'] for m in data.get('matches',[]))))
             print('PUBLIC_FIVE_VOTES_PRESENT='+str(any((m.get('ou25') or {}).get('vote_count')==5 for m in data.get('matches',[]))))
            except:print('PUBLIC_LIVE_OK=False')
            d.close()
            PY
