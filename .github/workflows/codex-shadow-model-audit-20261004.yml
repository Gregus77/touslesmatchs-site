name: Codex shadow model audit 20261004
on:
  push:
    branches: [codex/readonly-vps-audit-20261004]
    paths: [.github/workflows/codex-shadow-model-audit-20261004.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/touslesmatchs
            echo "SHADOW_AUDIT_BEGIN"
            docker compose exec -T api node <<'NODE'
            const D=require('better-sqlite3');
            const db=new D(process.env.DB_PATH||'/data/tlm.db',{readonly:true,fileMustExist:true});
            function q(label,sql){try{console.log(label+'='+JSON.stringify(db.prepare(sql).all()))}catch(e){console.log(label+'='+JSON.stringify({error:e.message}))}}
            q('TOURNAMENT_MODELS',`
              SELECT model_name,model_id,COUNT(*) attempts,
                SUM(CASE WHEN error IS NULL THEN 1 ELSE 0 END) responses,
                SUM(CASE WHEN prediction='NO BET' AND error IS NULL THEN 1 ELSE 0 END) abstains,
                SUM(CASE WHEN outcome='win' THEN 1 ELSE 0 END) wins,
                SUM(CASE WHEN outcome='loss' THEN 1 ELSE 0 END) losses,
                ROUND(AVG(CASE WHEN error IS NULL THEN confidence END),1) avg_conf,
                ROUND(AVG(CASE WHEN error IS NULL THEN latency_ms END)) avg_ms
              FROM shadow_tournament_predictions
              GROUP BY model_name,model_id ORDER BY model_name`);
            q('SHADOW_MARKETS',`
              SELECT market,model_name,COUNT(*) attempts,
                SUM(CASE WHEN error IS NULL THEN 1 ELSE 0 END) responses,
                SUM(CASE WHEN selection='NO BET' AND error IS NULL THEN 1 ELSE 0 END) abstains,
                SUM(CASE WHEN outcome='win' THEN 1 ELSE 0 END) wins,
                SUM(CASE WHEN outcome='loss' THEN 1 ELSE 0 END) losses,
                ROUND(AVG(CASE WHEN error IS NULL THEN confidence END),1) avg_conf,
                ROUND(AVG(CASE WHEN error IS NULL THEN latency_ms END)) avg_ms
              FROM shadow_market_predictions
              GROUP BY market,model_name ORDER BY market,model_name`);
            q('SHADOW_ERRORS',`
              SELECT model_name,status,COALESCE(error,'') error,COUNT(*) n
              FROM shadow_tournament_calls GROUP BY model_name,status,COALESCE(error,'')
              ORDER BY n DESC`);
            q('OFFICIAL_SHADOW_AGENTS',`
              SELECT agent_name,COUNT(*) n,
                COUNT(DISTINCT match_key) matches,
                SUM(CASE WHEN outcome='win' THEN 1 ELSE 0 END) wins,
                SUM(CASE WHEN outcome='loss' THEN 1 ELSE 0 END) losses,
                ROUND(AVG(confidence),1) avg_conf,
                MAX(created_at) latest
              FROM shadow_evals GROUP BY agent_name ORDER BY agent_name`);
            q('MULTISPORT',`
              SELECT sport,COALESCE(agent,'') agent,COUNT(*) n,
                SUM(CASE WHEN result='win' THEN 1 ELSE 0 END) wins,
                SUM(CASE WHEN result='loss' THEN 1 ELSE 0 END) losses,
                SUM(CASE WHEN result IS NULL OR result='pending' THEN 1 ELSE 0 END) pending,
                ROUND(AVG(confidence),1) avg_conf,MAX(analysed_at) latest
              FROM multisport_shadow GROUP BY sport,COALESCE(agent,'') ORDER BY sport,agent`);
            q('PLUS05_WATCH',`
              SELECT day,risk_color,COUNT(*) n,MIN(fav_rank) min_fav_rank,MAX(opp_rank) max_opp_rank,
                SUM(CASE WHEN deep_json IS NOT NULL THEN 1 ELSE 0 END) deep_verified,
                MAX(last_reason) last_reason
              FROM plus05_watchlist GROUP BY day,risk_color ORDER BY day DESC,risk_color`);
            q('PLUS05_SIGNALS',`
              SELECT dry_run,outcome,COUNT(*) n,SUM(CASE WHEN outcome='win' THEN 1 ELSE 0 END) wins,
                SUM(CASE WHEN outcome='loss' THEN 1 ELSE 0 END) losses
              FROM plus05_signals GROUP BY dry_run,outcome`);
            db.close();
            NODE
            echo "SHADOW_TIMER_BEGIN"
            systemctl status tlm-shadow-tournament.timer --no-pager -l 2>/dev/null | head -25 || true
            systemctl status tlm-shadow-tournament.service --no-pager -l 2>/dev/null | head -40 || true
            echo "SHADOW_TIMER_END"
            echo "SHADOW_AUDIT_END"
