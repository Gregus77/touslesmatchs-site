name: Codex VPS baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-vps-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Hermes voice proof
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -euo pipefail
            echo "=== HERMES SERVICES ==="
            systemctl is-active tlm-owner-remote.service
            systemctl is-active tlm-hermes-guardian.service
            echo "=== OWNER OFFSET ==="
            cat /opt/touslesmatchs/data/owner_remote_offset.json 2>/dev/null || true
            echo
            echo "=== LAST OWNER REMOTE AUDIT EVENTS ==="
            tail -n 30 /opt/touslesmatchs/data/owner_remote_commands.jsonl 2>/dev/null || true
            echo "=== OWNER REMOTE JOURNAL ==="
            journalctl -u tlm-owner-remote.service --since "2026-10-05 12:45:00" --no-pager -n 120 2>/dev/null || true
            echo "=== END OWNER REMOTE JOURNAL ==="
            echo "=== TELEGRAM POLLERS ==="
            ps -eo pid,etimes,cmd | grep -E 'tlm_owner_remote|tg_poll|hermes_poll|getUpdates|owner_remote' | grep -v grep || true
            systemctl list-units --type=service --all --no-pager | grep -Ei 'telegram|hermes|owner|poll' || true
            systemctl list-timers --all --no-pager | grep -Ei 'telegram|hermes|owner|poll' || true
            crontab -l 2>/dev/null | grep -Ei 'telegram|hermes|poll|tg_poll' || true
            grep -RIlE 'tg_poll|hermes_poll|getUpdates' /etc/systemd/system /etc/cron.d /etc/cron.hourly /etc/cron.daily 2>/dev/null | head -50 || true
            echo "=== END TELEGRAM POLLERS ==="
            echo "=== TELEGRAM BOT UNIT ==="
            systemctl show telegram-bot.service -p ExecStart -p FragmentPath -p EnvironmentFiles --no-pager 2>/dev/null || true
            PID="$(systemctl show telegram-bot.service -p MainPID --value 2>/dev/null || true)"
            if [ -n "$PID" ] && [ "$PID" != "0" ]; then
              ps -p "$PID" -o pid,etimes,cmd --no-headers || true
            fi
            echo "=== END TELEGRAM BOT UNIT ==="
            echo "=== TELEGRAM BOT POLLING SIGNATURES ==="
            PID="$(systemctl show telegram-bot.service -p MainPID --value 2>/dev/null || true)"
            if [ -n "$PID" ] && [ "$PID" != "0" ]; then
              SCRIPT="$(tr '\0' '\n' < "/proc/$PID/cmdline" 2>/dev/null | grep -E '\.py$' | tail -1 || true)"
              if [ -n "$SCRIPT" ] && [ -f "$SCRIPT" ]; then
                grep -En 'getUpdates|run_polling|Updater\(|Application\.builder|HERMES_ADMIN_TLM_BOT|TELEGRAM_BOT_TOKEN' "$SCRIPT" 2>/dev/null || true
              fi
            fi
            echo "=== END TELEGRAM BOT POLLING SIGNATURES ==="
            echo "=== OWNER REMOTE JOURNAL 12:53-13:00 UTC ==="
            journalctl -u tlm-owner-remote.service --since "2026-10-05 12:53:00 UTC" --until "2026-10-05 13:00:00 UTC" --no-pager -n 200 || true
            echo "=== END OWNER REMOTE JOURNAL ==="
            echo "=== END READ-ONLY PROOF ==="
