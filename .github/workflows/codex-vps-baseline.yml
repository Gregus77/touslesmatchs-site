name: Codex VPS baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-vps-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Hermes voice proof
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -euo pipefail
            echo "=== HERMES SERVICES ==="
            systemctl is-active tlm-owner-remote.service
            systemctl is-active tlm-hermes-guardian.service
            echo "=== OWNER OFFSET ==="
            cat /opt/touslesmatchs/data/owner_remote_offset.json 2>/dev/null || true
            echo
            echo "=== LAST OWNER REMOTE AUDIT EVENTS ==="
            tail -n 30 /opt/touslesmatchs/data/owner_remote_commands.jsonl 2>/dev/null || true
            echo "=== END READ-ONLY PROOF ==="
