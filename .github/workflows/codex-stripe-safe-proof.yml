name: Codex Stripe safe proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-stripe-safe-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify current Stripe plans without charging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 4m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            curl -fsSL https://www.touslesmatchs.com/api/health >/dev/null
            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-api)" = "true"
            docker exec touslesmatchs-api node -e "$(printf '%s' '' | base64 -d)"
