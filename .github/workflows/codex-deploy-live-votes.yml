name: Codex deploy live vote visibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-deploy-live-votes.yml

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Preserve generated state, deploy and prove site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs

            git fetch origin main
            test "$(git branch --show-current)" = "main"
            test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "origin/main"
            DIRTY_FILES="$(git status --porcelain --untracked-files=no | sed -E 's/^...//')"
            if [ -n "$DIRTY_FILES" ]; then
              test "$DIRTY_FILES" = "shared/vps-status.json"
            fi
            COUNTS="$(git rev-list --left-right --count HEAD...origin/main)"
            test "$(printf '%s' "$COUNTS" | awk '{print $1}')" = "0"

            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP="/opt/backups/tlm-live-votes-$STAMP"
            install -d -m 700 "$BACKUP/public"
            cp -a public/app.html public/live-ia.html public/sw.js public/index.html public/resultats-quotidiens.html public/faq.html public/performances.html "$BACKUP/public/"
            if [ -f shared/vps-status.json ]; then
              install -D -m 600 shared/vps-status.json "$BACKUP/shared/vps-status.json"
            fi

            if [ -n "$DIRTY_FILES" ]; then
              git restore --source=HEAD --worktree -- shared/vps-status.json
            fi
            git pull --ff-only origin main

            grep -q 'TLM_APP_LIVE_VOTES_V1' public/app.html
            grep -q 'TLM_LIVE_OU25_VOTES_V1' public/live-ia.html
            grep -q 'tlm-app-v13-responsive-20260904' public/sw.js
            grep -q 'tlm-app-v13-responsive-20260904' public/index.html
            grep -q 'tlm-app-v13-responsive-20260904' public/app.html
            node scripts/test_mobile_responsive_parity.js
            ! grep -qiE 'tlm-real-maint-results|Mise à jour importante TousLesMatchs|Maintenance technique des 27|maintenanceDays' public/app.html public/index.html public/resultats-quotidiens.html
            ! grep -qE '15e (et|à) la 40e|15e-40e|n<=40|minute>40' public/index.html public/faq.html public/performances.html
            grep -q '15e et la 45e minute' public/index.html
            grep -q '15e et la 45e minute' public/faq.html
            grep -q '15e et la 45e minute' public/performances.html

            if ! grep -qxF '/shared/vps-status.json' .gitignore; then
              printf '\n# État généré par la vigie horaire sur le VPS\n/shared/vps-status.json\n' >> .gitignore
            fi
            git rm --cached --ignore-unmatch shared/vps-status.json
            git add .gitignore
            if ! git diff --cached --quiet; then
              git commit -m "chore: ne plus suivre l'état généré du VPS"
              git push origin HEAD:main
            fi

            rollback_site() {
              set +e
              cp -a "$BACKUP/public/." public/
              docker compose up -d --build site >/dev/null 2>&1
              git restore --source=HEAD --worktree -- public/app.html public/live-ia.html public/sw.js public/index.html public/resultats-quotidiens.html public/faq.html public/performances.html
              echo "ROLLBACK_SITE_OK"
            }
            trap rollback_site ERR

            node -e "$(printf '%s' '' | base64 -d)"

            docker compose up -d --build site
            sleep 10
            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-site)" = "true"

            curl -fsS "https://www.touslesmatchs.com/app.html?proof=$STAMP" -o "/tmp/tlm-app-$STAMP.html"
            curl -fsS "https://www.touslesmatchs.com/live-ia.html?proof=$STAMP" -o "/tmp/tlm-live-$STAMP.html"
            curl -fsS "https://www.touslesmatchs.com/sw.js?proof=$STAMP" -o "/tmp/tlm-sw-$STAMP.js"
            curl -fsS "https://www.touslesmatchs.com/?proof=$STAMP" -o "/tmp/tlm-index-$STAMP.html"
            curl -fsS "https://www.touslesmatchs.com/resultats-quotidiens.html?proof=$STAMP" -o "/tmp/tlm-results-$STAMP.html"
            curl -fsS "https://www.touslesmatchs.com/faq.html?proof=$STAMP" -o "/tmp/tlm-faq-$STAMP.html"
            curl -fsS "https://www.touslesmatchs.com/performances.html?proof=$STAMP" -o "/tmp/tlm-performance-$STAMP.html"
            curl -fsS "https://www.touslesmatchs.com/api/live-matches?t=$STAMP" -o "/tmp/tlm-matches-$STAMP.json"
            curl -fsS "https://www.touslesmatchs.com/api/health?t=$STAMP" >/dev/null

            grep -q 'TLM_APP_LIVE_VOTES_V1' "/tmp/tlm-app-$STAMP.html"
            grep -q 'TLM_LIVE_OU25_VOTES_V1' "/tmp/tlm-live-$STAMP.html"
            grep -q 'tlm-app-v13-responsive-20260904' "/tmp/tlm-sw-$STAMP.js"
            grep -q 'grid-template-columns:minmax(0,1fr) auto' "/tmp/tlm-index-$STAMP.html"
            grep -q 'white-space:nowrap' "/tmp/tlm-index-$STAMP.html"
            ! grep -qiE 'tlm-real-maint-results|Mise à jour importante TousLesMatchs|Maintenance technique des 27|maintenanceDays' "/tmp/tlm-app-$STAMP.html" "/tmp/tlm-index-$STAMP.html" "/tmp/tlm-results-$STAMP.html"
            ! grep -qE '15e (et|à) la 40e|15e-40e|n<=40|minute>40' "/tmp/tlm-index-$STAMP.html" "/tmp/tlm-faq-$STAMP.html" "/tmp/tlm-performance-$STAMP.html"
            grep -q '15e et la 45e minute' "/tmp/tlm-index-$STAMP.html"
            grep -q '15e et la 45e minute' "/tmp/tlm-faq-$STAMP.html"
            grep -q '15e et la 45e minute' "/tmp/tlm-performance-$STAMP.html"
            python3 -c "$(printf '%s' '' | base64 -d)" "/tmp/tlm-matches-$STAMP.json"

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            test -z "$(git status --porcelain --untracked-files=no)"
            echo "RESULT=OK"
            echo "BACKUP=$BACKUP"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"
            echo "SITE_CONTAINER=$(docker inspect -f '{{.Id}}' touslesmatchs-site | cut -c1-12)"
            trap - ERR

      - name: Capture mobile responsive proof
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          url="https://www.touslesmatchs.com/?responsive_proof=$stamp"
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size=390,844 --virtual-time-budget=12000 \
            --screenshot=/tmp/tlm-home-mobile-responsive.png "$url"
          test -s /tmp/tlm-home-mobile-responsive.png

      - name: Archive mobile responsive proof
        uses: actions/upload-artifact@v4
        with:
          name: tlm-home-mobile-responsive
          path: /tmp/tlm-home-mobile-responsive.png
          retention-days: 7

# deployment trigger: responsive-parity-20260904
