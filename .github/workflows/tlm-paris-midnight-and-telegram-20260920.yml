name: TLM Paris midnight and Telegram production repair

on:
  push:
    branches: [codex/telegram-recap-premium-20260920]
    paths: [.github/workflows/tlm-paris-midnight-and-telegram-20260920.yml]

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Apply bounded repair, test, deploy API, or roll back
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 18m
          script: |
            set -eu
            cd /opt/touslesmatchs
            umask 077
            test "$(git branch --show-current)" = "codex/production-repair-20260914"

            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup="/opt/backups/tlm-paris-midnight-$stamp"
            install -d -m 700 "$backup/scripts"
            cp -p scripts/ai_budget_guard.js "$backup/scripts/ai_budget_guard.js"
            cp -p scripts/telegram_client.js "$backup/scripts/telegram_client.js"
            install -d -m 700 "$backup/public"
            cp -p public/index.html "$backup/public/index.html"
            cp -p public/app.html "$backup/public/app.html"
            cp -p public/live-ia.html "$backup/public/live-ia.html"
            test -e scripts/test_budget_paris_rollover_20260920.js && cp -p scripts/test_budget_paris_rollover_20260920.js "$backup/scripts/" || true
            test -e scripts/test_telegram_financial_recap_20260920.js && cp -p scripts/test_telegram_financial_recap_20260920.js "$backup/scripts/" || true

            rollback() {
              cp -p "$backup/scripts/ai_budget_guard.js" scripts/ai_budget_guard.js
              cp -p "$backup/scripts/telegram_client.js" scripts/telegram_client.js
              cp -p "$backup/public/index.html" public/index.html
              cp -p "$backup/public/app.html" public/app.html
              cp -p "$backup/public/live-ia.html" public/live-ia.html
              if test -e "$backup/scripts/test_budget_paris_rollover_20260920.js"; then
                cp -p "$backup/scripts/test_budget_paris_rollover_20260920.js" scripts/
              else
                rm -f scripts/test_budget_paris_rollover_20260920.js
              fi
              if test -e "$backup/scripts/test_telegram_financial_recap_20260920.js"; then
                cp -p "$backup/scripts/test_telegram_financial_recap_20260920.js" scripts/
              else
                rm -f scripts/test_telegram_financial_recap_20260920.js
              fi
              docker compose up -d --build --no-deps api >/dev/null 2>&1 || true
            }
            trap 'rollback' ERR

            git fetch origin codex/telegram-recap-premium-20260920 codex/production-repair-20260914
            python3 - <<'PY'
            from pathlib import Path
            path = Path('scripts/ai_budget_guard.js')
            source = path.read_text()
            def replace(old, new):
                global source
                if new in source:
                    return
                if old not in source:
                    raise SystemExit('TARGET_NOT_FOUND=' + old.splitlines()[0])
                source = source.replace(old, new, 1)
            replace(
              'function buildRequestKey({ matchKey, modelKey, promptVersion }) {\n  const day = parisParts(Date.now()).day;',
              'function buildRequestKey({ matchKey, modelKey, promptVersion }, at = Date.now()) {\n  const day = parisBudget(at).day;')
            replace(
              '''function _todaySum(db, sql, params = []) {
              if (process.env.OPENROUTER_PARIS_SCHEDULE === "1") {
                const p=parisBudget();
                sql=sql.replaceAll("date(created_at) = date('now')", `datetime(created_at)>=datetime('${p.start}') AND datetime(created_at)<datetime('${p.end}')`);
              }
              const row = db.prepare(sql).get(...params);''',
              '''function scopeTodaySql(sql, at = Date.now()) {
              const p = parisBudget(at);
              return sql.replaceAll("date(created_at) = date('now')", `datetime(created_at)>=datetime('${p.start}') AND datetime(created_at)<datetime('${p.end}')`);
            }

            function _todaySum(db, sql, params = []) {
              if (process.env.OPENROUTER_PARIS_SCHEDULE === "1") sql = scopeTodaySql(sql);
              const row = db.prepare(sql).get(...params);''')
            replace('function tripBreaker(db, type, detail) {\n  ensureSchema(db);\n  const today = new Date().toISOString().slice(0, 10);',
                    'function tripBreaker(db, type, detail, at = Date.now()) {\n  ensureSchema(db);\n  const today = parisBudget(at).day;')
            replace('const alreadyAlertedToday = existing && existing.alerted_at && existing.alerted_at.slice(0, 10) === today;',
                    'const existingAlertDay = existing?.alerted_at ? parisParts(sqliteUtcMs(existing.alerted_at)).day : null;\n  const alreadyAlertedToday = existingAlertDay === today;')
            replace('function isBreakerTripped(db, type) {', 'function isBreakerTripped(db, type, at = Date.now()) {')
            replace('''  if (DAILY_SCOPED_BREAKERS.has(type)) {
                const today = new Date().toISOString().slice(0, 10);
                return row.tripped_at.slice(0, 10) === today;
              }''',
              '''  if (DAILY_SCOPED_BREAKERS.has(type)) {
                return parisParts(sqliteUtcMs(row.tripped_at)).day === parisBudget(at).day;
              }''')
            replace('''  const dailyMatches = new Set(db.prepare(`
                SELECT DISTINCT match_key FROM ai_call_budget_log
                WHERE date(created_at) = date('now') AND status = 'ok' AND match_key IS NOT NULL
              `).all().map((row) => dailyMatchIdentity(row.match_key)).filter(Boolean));''',
              '''  let dailyMatchesSql = `
                SELECT DISTINCT match_key FROM ai_call_budget_log
                WHERE date(created_at) = date('now') AND status = 'ok' AND match_key IS NOT NULL
              `;
              if (process.env.OPENROUTER_PARIS_SCHEDULE === "1") dailyMatchesSql = scopeTodaySql(dailyMatchesSql);
              const dailyMatches = new Set(db.prepare(dailyMatchesSql).all().map((row) => dailyMatchIdentity(row.match_key)).filter(Boolean));''')
            replace('tripBreaker, isBreakerTripped, buildRequestKey, CFG,', 'tripBreaker, isBreakerTripped, buildRequestKey, scopeTodaySql, CFG,')
            replace("const {parisParts,parisDayBounds}=require('./telegram_client');", "const {parisParts,parisDayBounds,sqliteUtcMs}=require('./telegram_client');")
            path.write_text(source)
            PY
            git show origin/codex/telegram-recap-premium-20260920:scripts/test_budget_paris_rollover_20260920.js > scripts/test_budget_paris_rollover_20260920.js
            python3 - <<'PY'
            from pathlib import Path
            style = '''<!-- TLM-CONSENSUS-STATUS-20260920 -->
            <style>
            .consensus-insufficient{color:#ff667f!important;font-weight:900!important;animation:tlmConsensusBad 1s ease-in-out infinite!important}
            .consensus-valid{color:#55efca!important;font-weight:900!important;animation:tlmConsensusGood 1.35s ease-in-out infinite!important}
            @keyframes tlmConsensusBad{50%{opacity:.4;text-shadow:0 0 12px rgba(255,70,100,.9)}}
            @keyframes tlmConsensusGood{50%{opacity:.55;text-shadow:0 0 12px rgba(34,211,238,.9)}}
            @media(prefers-reduced-motion:reduce){.consensus-insufficient,.consensus-valid{animation:none!important}}
            </style>'''
            script = '''<!-- TLM-CONSENSUS-STATUS-RUNTIME-20260920 -->
            <script>(function(){
            function paint(el,total){if(!el)return;var text=(el.textContent+' '+(total||'')).replace(/\\s+/g,' '),good=/\\b[45]\\s*\\/\\s*5\\b/.test(text)&&!/insuffisant|aucun signal/i.test(text),bad=/consensus insuffisant/i.test(text)||(/\\b[1-3]\\s*\\/\\s*5\\b/.test(text)&&!good);el.classList.toggle('consensus-valid',good);el.classList.toggle('consensus-insufficient',bad);}
            function refresh(){paint(document.getElementById('hero-consensus-label'),document.getElementById('hero-consensus-current')&&document.getElementById('hero-consensus-current').textContent);paint(document.getElementById('app-ai-result'),document.getElementById('app-ai-total')&&document.getElementById('app-ai-total').textContent);document.querySelectorAll('.mc-vote-verdict').forEach(function(el){var box=el.closest('.mc-vote-details');paint(el,box&&box.querySelector('.mc-vote-count')&&box.querySelector('.mc-vote-count').textContent);});}
            if(typeof compareHeroMatches==='function'){var previousCompare=compareHeroMatches;compareHeroMatches=function(a,b){var av=Number(a&&a.ou25&&a.ou25.vote_count||0),bv=Number(b&&b.ou25&&b.ou25.vote_count||0);if((av>0)!==(bv>0))return bv>0?1:-1;return previousCompare(a,b);};if(typeof loadHeroLive==='function')loadHeroLive();}
            new MutationObserver(refresh).observe(document.documentElement,{subtree:true,childList:true,characterData:true});refresh();
            })();</script>'''
            for name in ('public/index.html','public/app.html','public/live-ia.html'):
                path=Path(name); source=path.read_text()
                if 'TLM-CONSENSUS-STATUS-20260920' not in source:
                    source=source.replace('</head>',style+'\n</head>',1)
                if 'TLM-CONSENSUS-STATUS-RUNTIME-20260920' not in source:
                    source=source.replace('</body>',script+'\n</body>',1)
                path.write_text(source)
            PY

            node scripts/test_budget_paris_rollover_20260920.js
            node --check scripts/ai_budget_guard.js

            docker compose build api
            docker compose up -d --no-deps api
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:3001/current-pick >/dev/null; then break; fi
              test "$attempt" -lt 6
              sleep 5
            done
            docker exec -i touslesmatchs-api node - <<'NODE'
            const assert=require('assert');
            const guard=require('/app/ai_budget_guard');
            const req={matchKey:'rollover_probe',modelKey:'mistral',promptVersion:'v1'};
            assert.notEqual(guard.buildRequestKey(req,Date.parse('2026-09-19T21:59:59Z')),guard.buildRequestKey(req,Date.parse('2026-09-19T22:00:00Z')));
            console.log('RUNTIME_PARIS_ROLLOVER_OK=True');
            NODE
            curl -fsS https://www.touslesmatchs.com/api/health >/dev/null
            curl -fsS https://www.touslesmatchs.com/ | grep -q 'consensus-insufficient'
            curl -fsS https://www.touslesmatchs.com/app | grep -q 'consensus-valid'
            trap - ERR
            echo "DEPLOYMENT_OK=True"
            echo "BACKUP_CREATED=True"
