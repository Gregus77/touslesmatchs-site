name: Telegram runtime audit and explicit TEST probes
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, test, activate]
        default: audit
permissions:
  contents: read
concurrency:
  group: tlm-telegram-runtime-probe
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit runtime without exposing secrets
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            exec 9>/tmp/tlm-telegram-runtime-probe.lock
            flock -w 60 9
            python3 - <<'PY'
            import urllib.request, hashlib, base64, gzip, sys
            base='https://raw.githubusercontent.com/Gregus77/touslesmatchs-site/a492b425b02b30c6007c79c81fda6041f60f27c1/'
            manifest={'scripts/tlm_telegram_campaign_activate.py': 'ead27adfc06083b8cf3bcaf9b2dd139a0cdc3e46b5cacf489afc3b0df54e821a', 'scripts/telegram_client.js': 'f4304575546845312325bb06793d6224b66f2b0dd14d40ffa66d4c227cde48b0', 'scripts/test_telegram_campaign_20261009.js': '0d49a4cff9431197535db4e43ce3bd62c4461ed44b948c414ebdab75ad379327', 'scripts/tlm_telegram_runtime_probe.py': '7d0a3b820b4a29f0ad30ba9c227037977aa3f9d7544d2cfe81cd4c1be3e7edad'}
            sources={}
            for path,expected in manifest.items():
                with urllib.request.urlopen(base+path,timeout=30) as response: content=response.read()
                assert hashlib.sha256(content).hexdigest()==expected, 'source_integrity_failed'
                sources[path]=content
            mode='${{ inputs.mode }}'
            if mode=='activate':
                scope={'__name__':'tlm_campaign_activate'}
                exec(compile(sources['scripts/tlm_telegram_campaign_activate.py'],'activate.py','exec'),scope)
                pack=lambda b:base64.b64encode(gzip.compress(b)).decode()
                scope['main'](pack(sources['scripts/telegram_client.js']),pack(sources['scripts/test_telegram_campaign_20261009.js']))
            else:
                assert mode in ['audit','test']
                sys.argv=['probe','--mode',mode]
                exec(compile(sources['scripts/tlm_telegram_runtime_probe.py'],'probe.py','exec'),{'__name__':'__main__'})
            PY
