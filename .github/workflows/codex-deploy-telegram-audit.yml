name: Codex deploy Telegram audit correction

on:
  push:
    branches: [main]
    paths:
      - scripts/api_server.js
      - scripts/ai_budget_guard.js
      - scripts/test_ai_budget_guard.js
      - scripts/test_ou25_post_analysis_odds_20260905.js
      - scripts/test_ou25_consensus_3of5_20260905.js
      - public/index.html
      - public/faq.html
      - public/cgv.html
      - public/js/i18n.js
      - .github/workflows/codex-deploy-telegram-audit.yml

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy API and prove Telegram access
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs

            git fetch origin main
            test "$(git branch --show-current)" = "main"
            test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "origin/main"
            test -z "$(git status --porcelain --untracked-files=no)"

            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP="/opt/backups/tlm-telegram-audit-$STAMP"
            mkdir -p "$BACKUP"
            chmod 700 "$BACKUP"
            cp scripts/api_server.js "$BACKUP/api_server.js"
            cp scripts/ai_budget_guard.js "$BACKUP/ai_budget_guard.js"
            cp .env "$BACKUP/.env"
            cp data/tlm.db "$BACKUP/tlm.db"
            chmod 600 "$BACKUP/.env" "$BACKUP/tlm.db"

            git pull --ff-only origin main
            trap 'cp "$BACKUP/api_server.js" scripts/api_server.js; cp "$BACKUP/ai_budget_guard.js" scripts/ai_budget_guard.js; docker compose up -d --build api >/dev/null 2>&1 || true; git stash push -m "codex-preserved-failed-telegram-audit-$STAMP" -- scripts/api_server.js scripts/ai_budget_guard.js >/dev/null 2>&1 || true' ERR

            node --check scripts/api_server.js
            node --check scripts/ai_budget_guard.js
            node scripts/test_ou25_post_analysis_odds_20260905.js
            node scripts/test_ou25_consensus_3of5_20260905.js
            node scripts/test_public_quorum_copy_3of5_20260906.js
            grep -q 'TELEGRAM_AUDIT_FALSE_FAILURES_V1' scripts/api_server.js
            grep -q 'await test("Volume de signaux"' scripts/api_server.js
            ! grep -q 'await test("Diffusion Telegram"' scripts/api_server.js
            echo "TELEGRAM_AUDIT_CODE_OK"

            docker compose up -d --build api
            sleep 15
            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-api)" = "true"
            curl -fsSL "https://www.touslesmatchs.com/api/health?t=$STAMP" | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const x=JSON.parse(b);const t=x.integrations?.telegram;if(!x.ok||!t?.ok)process.exit(1);const expected=["gratuit","premium","ru gratuit","ru premium","admin"];if(expected.some(k=>t.channels?.[k]!==true))process.exit(1);if("standard" in (t.channels||{})||"ru standard" in (t.channels||{}))process.exit(1);console.log("PUBLIC_TELEGRAM_HEALTH_OK")})'
            docker exec touslesmatchs-api grep -q 'TELEGRAM_AUDIT_FALSE_FAILURES_V1' /app/server.js
            docker exec touslesmatchs-api grep -q 'CLIENT_OU25_MIN_VOTES = 3;' /app/server.js
            docker exec touslesmatchs-api grep -q 'spikeMaxCallsPerMatch' /app/ai_budget_guard.js
            docker cp scripts/test_ai_budget_guard.js touslesmatchs-api:/app/test_ai_budget_guard.js
            docker exec touslesmatchs-api node /app/test_ai_budget_guard.js
            curl -fsSL "https://www.touslesmatchs.com/api/public-signal-rules?t=$STAMP" | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const x=JSON.parse(b);if(!x.ok||x.min_votes!==3||x.min_confidence!==77||x.min_odd!==1.3||x.max_odd!==2.1||x.from_minute!==15||x.to_minute!==45)process.exit(1);console.log("PUBLIC_RULES_3_OF_5_OK")})'
            curl -fsSL "https://www.touslesmatchs.com/api/analysis-history?limit=1&t=$STAMP" | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const x=JSON.parse(b);if(!x.ok||x.verification?.rule!=="football_ou25_5_seats_min_3_votes_minute_15_45")process.exit(1);console.log("PUBLIC_HISTORY_RULE_3_OF_5_OK")})'
            curl -fsSL "https://www.touslesmatchs.com/?t=$STAMP" -o "$BACKUP/homepage.html"
            curl -fsSL "https://www.touslesmatchs.com/faq.html?t=$STAMP" -o "$BACKUP/faq.html"
            curl -fsSL "https://www.touslesmatchs.com/cgv.html?t=$STAMP" -o "$BACKUP/cgv.html"
            grep -qF '3 IA / 5 minimum' "$BACKUP/homepage.html"
            grep -qF 'au moins 3' "$BACKUP/faq.html"
            grep -qF 'accord minimum 3 IA' "$BACKUP/cgv.html"
            docker exec -i touslesmatchs-api node <<'NODE'
            const https = require("https");
            function call(method, payload = {}) {
              return new Promise((resolve, reject) => {
                const body = JSON.stringify(payload);
                const req = https.request({
                  host: "api.telegram.org",
                  path: "/bot" + process.env.TELEGRAM_BOT_TOKEN + "/" + method,
                  method: "POST", timeout: 12000,
                  headers: {"Content-Type":"application/json","Content-Length":Buffer.byteLength(body)}
                }, res => {
                  let raw = ""; res.on("data", d => raw += d);
                  res.on("end", () => { try { resolve(JSON.parse(raw)); } catch (e) { reject(e); } });
                });
                req.on("error", reject);
                req.on("timeout", () => req.destroy(new Error("timeout")));
                req.end(body);
              });
            }
            (async () => {
              if (!process.env.TELEGRAM_BOT_TOKEN) throw new Error("token absent");
              const me = await call("getMe");
              if (!me.ok || !me.result?.id) throw new Error("bot auth");
              const targets = [
                ["FR Gratuit", "TELEGRAM_CHANNEL_ID", "TELEGRAM_FREE_CHANNEL_ID"],
                ["FR Premium 14,90 €", "TELEGRAM_PREMIUM_CHANNEL_ID"],
                ["RU Gratuit", "TELEGRAM_RU_FREE_CHANNEL_ID"],
                ["RU Premium 14,90 €", "TELEGRAM_RU_PREMIUM_CHANNEL_ID"],
                ["Admin", "TELEGRAM_ADMIN_CHAT_ID"],
              ];
              for (const [label, ...keys] of targets) {
                const id = keys.map(k => process.env[k]).find(Boolean);
                if (!id) throw new Error(label + " absent");
                const result = await call("getChatMember", {chat_id:id,user_id:me.result.id});
                if (!result.ok || !["administrator","creator","member"].includes(result.result?.status) || result.result?.can_post_messages === false) {
                  throw new Error(label + " inaccessible");
                }
              }
              console.log("TELEGRAM_ACCESS_OK_4_CLIENT_CHANNELS");
            })().catch(error => { console.error("TELEGRAM_ACCESS_FAILED", error.message); process.exit(1); });
            NODE
            echo "API_AND_TELEGRAM_OK"

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            test -z "$(git status --porcelain --untracked-files=no)"
            trap - ERR
