name: Telegram and Goal05 production health audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify current Goal05 and Telegram production health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs

            node --check scripts/api_server.js
            node --check scripts/goal05_v2.js
            node --check scripts/telegram_client.js
            node scripts/test_goal05_policy_20261005.js
            node scripts/test_current_product_goal05_20261005.js

            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-api)" = "true"
            docker exec touslesmatchs-api grep -q 'goal05_v2_20261006' /app/server.js
            docker exec touslesmatchs-api sh -lc 'test -n "$TELEGRAM_BOT_TOKEN"'
            docker exec touslesmatchs-api sh -lc 'test -n "$TELEGRAM_GOAL05_CHANNEL_ID" || test -n "$TELEGRAM_PREMIUM_CHANNEL_ID"'

            curl -fsSL "https://www.touslesmatchs.com/api/health?t=$(date +%s)" |
              node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const x=JSON.parse(b);if(!x.ok)process.exit(1);const t=x.integrations?.telegram;if(t?.configured===false||t?.ok===false)process.exit(1);console.log("PUBLIC_TELEGRAM_HEALTH_OK")})'

            curl -fsSL "https://www.touslesmatchs.com/api/goal05/stats?t=$(date +%s)" |
              node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const x=JSON.parse(b);if(!x.ok||x.policyVersion!=="goal05_v2_20261006")process.exit(1);console.log("PUBLIC_GOAL05_STATS_OK")})'

            echo "GOAL05_TELEGRAM_AUDIT_OK"
