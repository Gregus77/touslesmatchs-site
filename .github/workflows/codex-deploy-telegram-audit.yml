name: Telegram runtime audit and explicit TEST probes
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, test]
        default: audit
permissions:
  contents: read
concurrency:
  group: tlm-telegram-runtime-probe
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit runtime without exposing secrets
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            exec 9>/tmp/tlm-telegram-runtime-probe.lock
            flock -w 60 9
            python3 -c 'import base64; exec(compile(base64.b64decode(""), "tlm_telegram_runtime_probe.py", "exec"))' --mode '${{ inputs.mode }}'
