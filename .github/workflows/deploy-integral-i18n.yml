name: Deploy integral public translations
on:
  push:
    branches: [main]
    paths:
      - public/js/i18n.js
      - public/js/i18n-auto.js
      - public/js/tlm-wow-theme.js
      - public/js/match-lifecycle.js
      - public/app.html
      - scripts/test_i18n_integral_20260906.js
      - scripts/test_match_lifecycle_20260906.js
      - scripts/test_current_product_goal05_20261005.js
      - .github/workflows/deploy-integral-i18n.yml
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy translations with backup and source checks
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 8m
          script: |
            set -Eeuo pipefail
            cd /opt/touslesmatchs
            exec 9>/tmp/tlm-production-deploy.lock
            flock -w 900 9
            echo "PRODUCTION_DEPLOY_LOCK_ACQUIRED"
            target='${{ github.sha }}'
            git fetch origin main
            git merge-base --is-ancestor "$target" origin/main
            test "$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/srv"}}{{.Source}}{{end}}{{end}}' touslesmatchs-site)" = /opt/touslesmatchs/public
            backup=$(mktemp -d /opt/backups/tlm-integral-i18n.XXXXXX)
            git status --porcelain --untracked-files=no > "$backup/tracked-status.txt"
            git diff > "$backup/tracked-working.patch"
            git diff --cached > "$backup/tracked-staged.patch"
            mkdir -p "$backup/js"
            cp -a public/js/i18n.js public/js/tlm-wow-theme.js public/js/match-lifecycle.js "$backup/js/"
            test ! -e public/js/i18n-auto.js || cp -a public/js/i18n-auto.js "$backup/js/"
            git rev-parse HEAD > "$backup/git-head.txt"
            rollback(){
              trap - ERR
              cp -a "$backup/js/i18n.js" "$backup/js/tlm-wow-theme.js" "$backup/js/match-lifecycle.js" public/js/
              if test -e "$backup/js/i18n-auto.js"; then cp -a "$backup/js/i18n-auto.js" public/js/; else rm -f public/js/i18n-auto.js; fi
              echo "FAILED: translations restored; BACKUP=$backup"
              exit 1
            }
            trap rollback ERR
            if test -s "$backup/tracked-status.txt"; then
              git stash push -m "codex-preserved-before-i18n-${{ github.run_id }}"
              echo "TRACKED_CHANGES_PRESERVED"
            fi
            if test "$(git branch --show-current)" != "main"; then git switch main; fi
            git branch --set-upstream-to=origin/main main
            git pull --ff-only origin main
            deploy_head="$(git rev-parse HEAD)"
            git merge-base --is-ancestor "$target" "$deploy_head"
            node --check public/js/i18n.js
            node --check public/js/i18n-auto.js
            node --check public/js/tlm-wow-theme.js
            node --check public/js/match-lifecycle.js
            node scripts/test_i18n_integral_20260906.js
            node scripts/test_match_lifecycle_20260906.js
            node scripts/test_current_product_goal05_20261005.js
            for file in i18n.js i18n-auto.js tlm-wow-theme.js match-lifecycle.js; do
              curl -fsS --max-time 30 "https://www.touslesmatchs.com/js/$file?v=$deploy_head" -o "$backup/$file.public"
              cmp "public/js/$file" "$backup/$file.public"
            done
            test "$(git rev-parse HEAD)" = "$deploy_head"
            test "$(git rev-parse origin/main)" = "$deploy_head"
            docker compose ps site
            trap - ERR
            echo "INTEGRAL_I18N_SOURCE_OK=$deploy_head"
            echo "BACKUP=$backup"
      - name: Browser audit in five translated languages
        shell: bash
        run: |
          set -euo pipefail
          pages=("" "live-ia.html" "performances.html" "bankroll.html" "dashboard.html" "app.html" "faq.html")
          langs=(en es pt ru zh)
          untranslated='>\\s*(Se connecter|Créer mon compte|Résultats Over|Votre signal|Fenêtre d.analyse|Votes IA|IA validées|Gestion intelligente|Ma bankroll|Mon espace|Questions fréquentes|Verdict du Concile)\\s*<'
          for lang in "${langs[@]}"; do
            for page in "${pages[@]}"; do
              name="${page:-home}"; name="${name%.html}"
              url="https://www.touslesmatchs.com/${page}?lang=${lang}&v=${{ github.sha }}&i18n=${{ github.sha }}"
              out="/tmp/${name}-${lang}.html"
              echo "AUDIT page=$name lang=$lang"
              google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$url" > "$out"
              grep -Eq "<html lang=\"$lang(-[A-Z]{2})?\"" "$out" || { echo "BAD_HTML_LANG page=$name lang=$lang"; exit 1; }
              if [[ "$page" == "app.html" ]] && [[ "$lang" != "fr" ]]; then
                visible="$out.visible"
                perl -0777 -pe 's{<(script|style|noscript|template)\b[^>]*>.*?</\1\s*>}{}gis; s{<[^>]+>}{\n}g' "$out" > "$visible"
                app_untranslated='(Votre signal [+]0,5 but équipe favorite|Suivi de la 30e à la 85e minute|Me connecter|Recevoir mon code par email|Nouveau sur TousLesMatchs|Je confirme avoir au moins 18 ans|Les signaux [+]0,5 but équipe favorite|Historique des analyses[.] Les envois Telegram)'
                if grep -Eiq "$app_untranslated" "$visible"; then
                  echo "UNTRANSLATED_APP_COPY page=app lang=$lang"
                  grep -Ein "$app_untranslated" "$visible"
                  exit 1
                fi
              fi
              if grep -En "$untranslated" "$out"; then
                echo "UNTRANSLATED_COPY page=$name lang=$lang"
                exit 1
              fi
            done
          done
          echo "INTEGRAL_I18N_BROWSER_OK"
      - name: Repeat audit twice to detect asynchronous regressions
        shell: bash
        run: |
          set -euo pipefail
          for pass in 2 3; do
            for lang in en pt ru zh; do
              out="/tmp/recheck-$pass-$lang.html"
              google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "https://www.touslesmatchs.com/live-ia.html?lang=$lang&pass=$pass&v=${{ github.sha }}" > "$out"
              grep -Eq "<html lang=\"$lang(-[A-Z]{2})?\"" "$out" || { echo "BAD_HTML_LANG pass=$pass lang=$lang"; exit 1; }
              if grep -En '>\s*(Se connecter|Fenêtre d.analyse|Votes IA|IA validées|Verdict|Vote du signal|Under du Concile|Over du Concile)\s*<' "$out"; then
                echo "UNTRANSLATED_COPY pass=$pass lang=$lang"
                exit 1
              fi
            done
          done
          echo "INTEGRAL_I18N_THREE_PASSES_OK"
