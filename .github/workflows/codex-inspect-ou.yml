name: Codex remove maintenance notices
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-inspect-ou.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            git fetch origin main
            git pull --ff-only origin main
            STAMP=$(date -u +%Y%m%d-%H%M%S)
            BACKUP=/opt/backups/tlm-maintenance-notices-$STAMP
            mkdir -p "$BACKUP"
            cp -a public/resultats-quotidiens.html "$BACKUP/"
            rollback() {
              cp -a "$BACKUP/resultats-quotidiens.html" public/resultats-quotidiens.html
              git add public/resultats-quotidiens.html
              git commit -m "revert: restore results page after failed verification" || true
              git push origin HEAD:main || true
              docker compose up -d --build site || true
            }
            trap rollback ERR
            python3 -c "import base64;exec(base64.b64decode(''))"
            ! grep -qE 'tlm-important-update|tlm-maintenance-results|TLM_MAINTENANCE_DAYS_START|Maintenance technique des 27' public/resultats-quotidiens.html
            git diff --check
            git add public/resultats-quotidiens.html
            git commit -m "fix: retirer les anciens messages de maintenance"
            git push origin HEAD:main
            docker compose up -d --build site
            sleep 5
            curl -fsS "https://www.touslesmatchs.com/resultats-quotidiens.html?t=$(date +%s)" -o /tmp/results.html
            ! grep -qE 'Mise à jour importante TousLesMatchs|Maintenance technique des 27|tlm-maintenance-results' /tmp/results.html
            grep -q 'id="lead-form"' /tmp/results.html
            echo "BACKUP=$BACKUP"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"
            trap - ERR
