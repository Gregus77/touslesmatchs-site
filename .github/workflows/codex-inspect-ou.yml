name: Codex deploy PWA maintenance and live votes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-inspect-ou.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Backup, patch, verify and deploy site only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs

            git fetch origin main
            test "$(git branch --show-current)" = "main"
            test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "origin/main"
            test -z "$(git status --porcelain --untracked-files=no)"
            read LOCAL_ONLY REMOTE_ONLY <<EOF_COUNTS
            $(git rev-list --left-right --count HEAD...origin/main)
            EOF_COUNTS
            test "$LOCAL_ONLY" = "0"
            git pull --ff-only origin main

            STAMP=$(date -u +%Y%m%d-%H%M%S)
            BACKUP=/opt/backups/tlm-pwa-votes-$STAMP
            FILES="public/app.html public/index.html public/live-ia.html public/resultats-quotidiens.html public/faq.html public/performances.html public/sw.js"
            install -d -m 700 "$BACKUP"
            for FILE in $FILES; do
              install -D -m 600 "$FILE" "$BACKUP/$FILE"
            done

            DEPLOY_COMMIT=""
            rollback() {
              set +e
              for FILE in $FILES; do
                cp -a "$BACKUP/$FILE" "$FILE"
              done
              git add $FILES
              if ! git diff --cached --quiet; then
                git commit -m "revert: restore PWA after failed verification"
                git push origin HEAD:main
              fi
              docker compose up -d --build site
              sleep 8
              curl -fsS "https://www.touslesmatchs.com/?rollback=$STAMP" >/dev/null
              echo "ROLLBACK_OK"
            }
            trap rollback ERR

            printf '%s' '' | base64 -d > /tmp/tlm-pwa-votes.patch
            git apply --check /tmp/tlm-pwa-votes.patch
            git apply /tmp/tlm-pwa-votes.patch
            rm -f /tmp/tlm-pwa-votes.patch

            git diff --check
            ! grep -RqiE 'TLM_REAL_MAINT_RESULTS|maintenanceDays|Mise à jour importante TousLesMatchs|Maintenance technique des 27|15e et la 40e|15e-40e|minute>40' public
            grep -q 'tlm-app-v12-maintenance-votes-20260903' public/sw.js
            grep -q 'function liveOu25Panel' public/live-ia.html
            grep -q 'Analysé .*ne pas jouer' public/live-ia.html
            grep -q 'signal éligible' public/live-ia.html

            node - <<'NODE_TEST'
            const fs=require("fs");
            for (const file of ["public/app.html","public/index.html","public/live-ia.html","public/resultats-quotidiens.html"]) {
              const html=fs.readFileSync(file,"utf8");
              const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
                .filter(m=>!/type=["']application\/ld\+json/i.test(m[1]))
                .map(m=>m[2]);
              for (const code of scripts) new Function(code);
            }
            NODE_TEST

            git add $FILES
            git commit -m "fix: actualiser la PWA et afficher les votes live"
            DEPLOY_COMMIT=$(git rev-parse HEAD)
            git push origin HEAD:main

            docker compose up -d --build site
            sleep 10
            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-site)" = "true"

            curl -fsS "https://www.touslesmatchs.com/app?cb=$STAMP" -o /tmp/tlm-app-public.html
            curl -fsS "https://www.touslesmatchs.com/live-ia?cb=$STAMP" -o /tmp/tlm-live-public.html
            curl -fsS "https://www.touslesmatchs.com/sw.js?cb=$STAMP" -o /tmp/tlm-sw-public.js
            curl -fsS "https://www.touslesmatchs.com/api/live-matches?cb=$STAMP" -o /tmp/tlm-live.json
            curl -fsS "https://www.touslesmatchs.com/api/health?cb=$STAMP" >/dev/null

            ! grep -qiE 'TLM_REAL_MAINT_RESULTS|Mise à jour importante TousLesMatchs|Maintenance technique des 27' /tmp/tlm-app-public.html
            grep -q 'tlm-app-v12-maintenance-votes-20260903' /tmp/tlm-sw-public.js
            grep -q 'function liveOu25Panel' /tmp/tlm-live-public.html
            grep -q 'Entre la 15e et la 45e' /tmp/tlm-app-public.html

            python3 - <<'PY_VERIFY'
            import json
            with open("/tmp/tlm-live.json", encoding="utf-8") as handle:
                data=json.load(handle)
            assert data.get("ok") is True
            for match in data.get("matches", []):
                ou25=match.get("ou25") or {}
                assert ou25.get("to_minute") == 45
                assert len(ou25.get("votes") or []) == 5
            PY_VERIFY

            test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"
            test "$(git rev-parse origin/main)" = "$DEPLOY_COMMIT"
            test -z "$(git status --porcelain --untracked-files=no)"
            echo "RESULT=OK"
            echo "BACKUP=$BACKUP"
            echo "DEPLOYED_COMMIT=$DEPLOY_COMMIT"
            echo "SITE_CONTAINER=$(docker inspect -f '{{.Id}}' touslesmatchs-site | cut -c1-12)"
            trap - ERR
