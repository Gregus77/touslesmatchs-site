name: Codex repair O/U window
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-inspect-ou.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            git fetch origin main
            git pull --ff-only origin main
            BEFORE=$(git rev-parse HEAD)
            STAMP=$(date -u +%Y%m%d-%H%M%S)
            BACKUP=/opt/backups/tlm-ou25-15-45-$STAMP
            mkdir -p "$BACKUP"
            cp -a scripts/api_server.js public/app.html "$BACKUP/"
            rollback() {
              echo "ROLLBACK vers $BEFORE"
              git reset --hard "$BEFORE"
              docker compose up -d --build api site || true
            }
            trap rollback ERR
            python3 -c "import base64;exec(base64.b64decode(''))"
            node --check scripts/api_server.js
            git diff --check
            git add scripts/api_server.js public/app.html
            git commit -m "fix: analyse O/U de 15 à 45 minutes"
            git push origin HEAD:main
            docker compose up -d --build api site
            sleep 12
            curl -fsS https://www.touslesmatchs.com/api/health >/tmp/tlm-health.json
            curl -fsS "https://www.touslesmatchs.com/api/live-matches?t=$(date +%s)" >/tmp/tlm-live.json
            python3 -c 'import json,re; d=json.load(open("/tmp/tlm-live.json")); ms=d.get("matches",d.get("live",[])); bad=[(m.get("home"),m.get("minute")) for m in ms if not re.fullmatch(r"[0-9]{1,3}['"'"'’′]?",str(m.get("minute","")).strip()) and m.get("client_product_eligible") is True]; assert not bad,bad; print("LIVE_VALIDATION_OK matches=",len(ms))'
            echo "BACKUP=$BACKUP"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"
            git status --short --branch
            docker compose ps api site
            trap - ERR
