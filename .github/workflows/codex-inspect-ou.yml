name: Codex Stripe read-only gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-inspect-ou.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            test "$(git branch --show-current)" = main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            docker exec touslesmatchs-api node -e "eval(Buffer.from('','base64').toString())"
            curl -fsS https://www.touslesmatchs.com/api/health >/dev/null
