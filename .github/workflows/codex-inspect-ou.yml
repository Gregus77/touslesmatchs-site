name: Codex deploy Telegram FR RU routing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-inspect-ou.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 12m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            git fetch origin main
            git pull --ff-only origin main
            STAMP=$(date -u +%Y%m%d-%H%M%S)
            BACKUP=/opt/backups/tlm-telegram-fr-ru-$STAMP
            mkdir -p "$BACKUP"
            cp -a scripts/api_server.js scripts/bookmakers.config.js "$BACKUP/"
            rollback() {
              cp -a "$BACKUP/api_server.js" scripts/api_server.js
              cp -a "$BACKUP/bookmakers.config.js" scripts/bookmakers.config.js
              git add scripts/api_server.js scripts/bookmakers.config.js
              git commit -m "revert: restore Telegram routing after failed verification" || true
              git push origin HEAD:main || true
              docker compose up -d --build api || true
            }
            trap rollback ERR
            python3 -c "import base64;exec(base64.b64decode(''))"
            node --check scripts/api_server.js
            node --check scripts/bookmakers.config.js
            node -e 'const c=require("./scripts/bookmakers.config"); const k=c.buildInlineKeyboard(); if(k.length!==2||k.some(r=>r.length!==2))process.exit(1); if(k.flat().map(x=>x.text).join(",")!=="Winamax,Betclic,Unibet,PMU")process.exit(2)'
            grep -q 'payload.reply_markup = { inline_keyboard: buildInlineKeyboard() }' scripts/api_server.js
            grep -q 'RU Premium' scripts/api_server.js
            git diff --check
            git add scripts/api_server.js scripts/bookmakers.config.js
            git commit -m "feat: miroiter les signaux russes et ajouter les bookmakers FR"
            git push origin HEAD:main
            docker compose up -d --build api
            sleep 12
            curl -fsS https://www.touslesmatchs.com/api/health >/dev/null
            docker exec touslesmatchs-api grep -q 'frenchClientSignal' /app/server.js
            docker exec touslesmatchs-api grep -q 'RU Premium' /app/server.js
            echo "BACKUP=$BACKUP"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"
            trap - ERR


