name: Codex repair Telegram quorum
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-inspect-ou.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 12m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            git fetch origin main
            git pull --ff-only origin main
            BEFORE=$(git rev-parse HEAD)
            STAMP=$(date -u +%Y%m%d-%H%M%S)
            BACKUP=/opt/backups/tlm-telegram-quorum-$STAMP
            mkdir -p "$BACKUP"
            cp -a scripts/api_server.js "$BACKUP/"
            rollback() {
              cp -a "$BACKUP/api_server.js" scripts/api_server.js
              git add scripts/api_server.js
              git commit -m "revert: restore Telegram quorum after failed verification" || true
              git push origin HEAD:main || true
              docker compose up -d --build api || true
            }
            trap rollback ERR
            python3 -c "import base64;exec(base64.b64decode(''))"
            node --check scripts/api_server.js
            git diff --check
            ! grep -q 'fiveOu25SeatsPresent' scripts/api_server.js
            grep -q 'clientOu25MatchEligible && ou25Only && enoughOu25SeatsPresent' scripts/api_server.js
            grep -q 'const CLIENT_OU25_CLIENT_MAX_MINUTE = 45;' scripts/api_server.js
            git add scripts/api_server.js
            git commit -m "fix: autoriser Telegram dès quatre votes concordants"
            git push origin HEAD:main
            docker compose up -d --build api
            sleep 12
            curl -fsS https://www.touslesmatchs.com/api/health >/dev/null
            curl -fsS "https://www.touslesmatchs.com/api/live-matches?t=$(date +%s)" -o /tmp/live.json
            python3 -c 'import json;d=json.load(open("/tmp/live.json"));m=d.get("matches",d.get("live",[]));assert all((x.get("ou25") or {}).get("to_minute")==45 for x in m);assert all(len((x.get("ou25") or {}).get("votes",[]))==5 for x in m);print("PUBLIC_RULES_OK")'
            docker exec touslesmatchs-api grep -q 'enoughOu25SeatsPresent' /app/server.js
            echo "BACKUP=$BACKUP"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"
            trap - ERR
