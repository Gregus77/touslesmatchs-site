name: Codex inspect production O/U
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codex-inspect-ou.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd /opt/touslesmatchs
            echo "=== GIT ==="
            git status --short --branch
            echo "HEAD=$(git rev-parse HEAD)"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            echo "=== DEFINITIONS ==="
            grep -nE '^(const|function) (CLIENT_OU25_CLIENT_MAX_MINUTE|CLIENT_OU25_MIN_VOTES|parseLiveMinuteValue|isClientOu25MatchEligible|clientOu25RequiredVotes)' scripts/api_server.js || true
            for n in $(grep -nE '^(const|function) (CLIENT_OU25_CLIENT_MAX_MINUTE|CLIENT_OU25_MIN_VOTES|parseLiveMinuteValue|isClientOu25MatchEligible|clientOu25RequiredVotes)' scripts/api_server.js | cut -d: -f1); do
              a=$((n-8)); [ $a -lt 1 ] && a=1; b=$((n+45)); echo "--- lines $a-$b ---"; sed -n "${a},${b}p" scripts/api_server.js
            done
            echo "=== EXACT 15-40 REFERENCES ==="
            grep -nE '15.?[-–].?40|<= ?40|to_minute: 40|minute>40|minute<=40|MINUTE.*40|MAX_MINUTE.*40|_15_40' scripts/api_server.js public/app.html public/live-ia.html || true
