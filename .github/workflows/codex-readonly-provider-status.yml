name: Codex read-only API Football status
on:
  push:
    branches: [codex/readonly-vps-audit-20261004]
    paths: [.github/workflows/codex-readonly-provider-status.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            cd /opt/touslesmatchs
            docker compose exec -T api node <<'NODE'
            const https=require('https');
            const key=process.env.API_FOOTBALL_KEY||process.env.API_SPORTS_KEY;
            if(!key){console.log('API_STATUS='+JSON.stringify({configured:false}));process.exit(0)}
            const req=https.get('https://v3.football.api-sports.io/status',{headers:{'x-apisports-key':key}},res=>{let b='';res.on('data',c=>b+=c);res.on('end',()=>{try{const d=JSON.parse(b);const x=d.response||{};console.log('API_STATUS='+JSON.stringify({http:res.statusCode,plan:x.subscription?.plan||null,end:x.subscription?.end||null,active:x.subscription?.active??null,requests:x.requests||null,errors:d.errors||{}}))}catch{console.log('API_STATUS='+JSON.stringify({http:res.statusCode,parse_error:true}))}})});
            req.setTimeout(12000,()=>req.destroy());req.on('error',e=>console.log('API_STATUS='+JSON.stringify({network:e.code||'error'})));
            NODE
