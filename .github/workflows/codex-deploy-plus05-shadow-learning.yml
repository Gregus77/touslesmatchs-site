name: Deploy plus05 shadow learning
on:
  push:
    branches: [codex/plus05-shadow-learning-20261004]
    paths: [.github/workflows/codex-deploy-plus05-shadow-learning.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 11m
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            oldsha=$(git rev-parse HEAD)
            test "$(git branch --show-current)" = "feat/plus05-favorite"
            test -z "$(git status --porcelain --untracked-files=no)"
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            envbak=".env.before-plus05-shadow-$stamp"
            cp .env "$envbak"
            docker compose exec -T api node -e '
              const D=require("better-sqlite3");
              const db=new D(process.env.DB_PATH||"/data/tlm.db",{readonly:true,fileMustExist:true});
              db.backup("/data/tlm-pre-plus05-shadow-'"$stamp"'.db").then(()=>db.close()).catch(e=>{console.error(e.message);process.exit(1)});
            '
            rollback(){
              echo "ROLLBACK=1"
              git reset --hard "$oldsha" || true
              cp "$envbak" .env || true
              docker compose build api >/dev/null 2>&1 || true
              docker compose up -d --no-deps --force-recreate api >/dev/null 2>&1 || true
            }
            trap rollback ERR
            git fetch origin feat/plus05-favorite
            git merge --ff-only origin/feat/plus05-favorite
            python3 - <<'PY'
            from pathlib import Path
            p=Path('.env')
            lines=p.read_text().splitlines()
            wanted={
              'AUTO_CONCILE_OBSERVER':'0',
              'JEV_ENABLED':'0',
              'JEV_PRODUCTION_MODE':'0',
              'PLUS05_ENABLED':'1',
              'PLUS05_DRY_RUN':'0',
              'PLUS05_JEV_SHADOW':'1',
            }
            seen=set(); out=[]
            for line in lines:
              if '=' in line:
                k=line.split('=',1)[0]
                if k in wanted:
                  out.append(f"{k}={wanted[k]}");seen.add(k);continue
              out.append(line)
            for k,v in wanted.items():
              if k not in seen: out.append(f"{k}={v}")
            p.write_text('\n'.join(out)+'\n')
            PY
            systemctl disable --now tlm-shadow-tournament.timer 2>/dev/null || true
            systemctl stop tlm-shadow-tournament.service 2>/dev/null || true
            docker compose build api
            docker compose up -d --no-deps --force-recreate api
            ok=0
            for i in $(seq 1 25); do
              if curl -fsS --max-time 5 "https://www.touslesmatchs.com/api/health?plus05shadow=$stamp" >/tmp/health.json 2>/dev/null; then
                if python3 - <<'PY'
            import json
            d=json.load(open('/tmp/health.json'))
            raise SystemExit(0 if d.get('ok') is True else 1)
            PY
                then ok=1;break;fi
              fi
              sleep 2
            done
            test "$ok" = 1
            echo "DEPLOY_HEAD=$(git rev-parse HEAD)"
            echo "DISK=$(df -P / | tail -1 | awk '{print $5}')"
            docker compose exec -T api node - <<'NODE'
            const cfg=require('./plus05_jev_shadow').config(process.env);
            const D=require('better-sqlite3'),db=new D(process.env.DB_PATH||'/data/tlm.db');
            const tables=new Set(db.prepare("select name from sqlite_master where type='table'").all().map(r=>r.name));
            console.log('FLAGS='+JSON.stringify({
              AUTO_CONCILE_OBSERVER:process.env.AUTO_CONCILE_OBSERVER,
              JEV_ENABLED:process.env.JEV_ENABLED,
              JEV_PRODUCTION_MODE:process.env.JEV_PRODUCTION_MODE,
              PLUS05_ENABLED:process.env.PLUS05_ENABLED,
              PLUS05_DRY_RUN:process.env.PLUS05_DRY_RUN,
              PLUS05_JEV_SHADOW:process.env.PLUS05_JEV_SHADOW
            }));
            console.log('JEV_PLUS05='+JSON.stringify({enabled:cfg.enabled,configured:cfg.configured,model:cfg.model}));
            console.log('SHADOW_TABLE='+tables.has('plus05_shadow_evals'));
            db.close();
            NODE
            echo "SHADOW_TIMER=$(systemctl is-enabled tlm-shadow-tournament.timer 2>/dev/null || true)|$(systemctl is-active tlm-shadow-tournament.timer 2>/dev/null || true)"
            docker compose logs --no-color --since 2m api | grep -E '\[plus05\] charge|\[auto-concile\] enabled' | tail -20 || true
            echo HEALTH_OK=1
            trap - ERR
