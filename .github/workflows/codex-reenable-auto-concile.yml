name: Codex re-enable auto Concile observer
on:
  push:
    branches: [codex/readonly-vps-audit-20261004]
    paths: [.github/workflows/codex-reenable-auto-concile.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Re-enable observer safely on production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/touslesmatchs
            test "$(git branch --show-current)" = "feat/plus05-favorite"
            test "$(git rev-parse HEAD)" = "ce49b4cdd895046f16396432ecc3dbc99959920d"
            test -z "$(git status --porcelain --untracked-files=no)"
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            backup=".env.before-auto-concile-$stamp"
            cp .env "$backup"
            rollback() {
              echo "REPAIR_ROLLBACK=1"
              cp "$backup" .env
              docker compose up -d --no-deps --force-recreate api >/dev/null 2>&1 || true
            }
            trap 'rollback' ERR
            python3 - <<'PY'
            from pathlib import Path
            p=Path('.env')
            s=p.read_text()
            key='AUTO_CONCILE_OBSERVER'
            lines=s.splitlines()
            found=False
            out=[]
            for line in lines:
              if line.startswith(key+'='):
                out.append(key+'=1'); found=True
              else: out.append(line)
            if not found: out.append(key+'=1')
            p.write_text('\n'.join(out)+'\n')
            PY
            docker compose up -d --no-deps --force-recreate api
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 "https://www.touslesmatchs.com/api/health?observer_repair=$stamp" >/tmp/health.json 2>/dev/null; then
                if python3 - <<'PY'
            import json
            d=json.load(open('/tmp/health.json'))
            raise SystemExit(0 if d.get('ok') is True else 1)
            PY
                then ok=1; break; fi
              fi
              sleep 2
            done
            test "$ok" = "1"
            test "$(docker compose exec -T api sh -lc 'printf %s "$AUTO_CONCILE_OBSERVER"')" = "1"
            sleep 35
            docker compose logs --no-color --since 2m api > /tmp/api-observer-repair.log
            grep -q "\[auto-concile\] enabled:" /tmp/api-observer-repair.log
            echo "AUTO_CONCILE_OBSERVER=1"
            grep "\[auto-concile\] enabled:" /tmp/api-observer-repair.log | tail -1
            grep "\[auto-concile\] live=" /tmp/api-observer-repair.log | tail -1 || true
            grep -E "API-Sports football (indisponible|saute|quota|bloque)|request limit for the day|daily request limit" /tmp/api-observer-repair.log | tail -3 || true
            echo "HEALTH_OK=1"
            trap - ERR
