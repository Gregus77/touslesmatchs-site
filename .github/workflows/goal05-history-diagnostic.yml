name: Goal05 history diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/goal05-history-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production Goal05 scanner history
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            docker exec touslesmatchs-api node - <<'NODE'
            const Database=require('better-sqlite3');
            const db=new Database('/data/tlm.db',{readonly:true});
            console.log('SCHEMA', JSON.stringify(db.prepare("PRAGMA table_info(goal05_scanner_history)").all()));
            console.log('ROWS', JSON.stringify(db.prepare("SELECT * FROM goal05_scanner_history ORDER BY rowid DESC LIMIT 30").all()));
            NODE
