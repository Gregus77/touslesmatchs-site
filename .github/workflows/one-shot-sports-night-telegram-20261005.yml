name: One-shot sports Goal05 Telegram 20261006

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-sports-night-telegram-20261005.yml"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Goal05 watchlist to owner Telegram
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/touslesmatchs
            docker exec touslesmatchs-api node -e "$(printf '%s' '' | base64 -d)"

# trigger: 2026-10-06T07:13 Europe/Paris
