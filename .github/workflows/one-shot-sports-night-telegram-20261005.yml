name: One-shot sports Goal05 Telegram 20261006

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-sports-night-telegram-20261005.yml"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Goal05 watchlist to owner Telegram
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/touslesmatchs
            docker exec -i touslesmatchs-api node <<'NODE'
            const https=require("https");
            const token=(process.env.HERMES_ADMIN_TLM_BOT||process.env.TELEGRAM_BOT_TOKEN||"").trim();
            const chatId=(process.env.TELEGRAM_ADMIN_CHAT_ID||process.env.TELEGRAM_HERMES_CHAT_ID||"").trim();
            if(!token||!chatId) throw new Error("telegram admin config missing");
            const text=`⚽ SCANNER +0,5 BUT — 06/10/2026 — PRÉ-SCAN PROPRIÉTAIRE

Règle active : Goal +0,5 but ÉQUIPE favorite V2.
⚠️ Nations League = groupes de 4 : adaptation propriétaire du critère Top5/Bottom5. Ce message n’est PAS un signal officiel.
Entrée possible uniquement en live 30’–85’, si la cible n’a pas marqué, cote réelle ≥ 1,60, 4/5 IA et score V2 vert confirmé.

1) 🟢 9,6/10 — ALBANIE vs SAINT-MARIN — 20:45
🎯 Cible : Albanie marque +0,5 but
Albanie : 2e du groupe, 6 pts, a marqué dans 3/3.
Saint-Marin : 4e, 0 pt, 14 buts encaissés en 3 matchs.
➡️ PRIORITÉ MAXIMALE À SURVEILLER.

2) 🟢 9,4/10 — SUISSE vs MACÉDOINE DU NORD — 20:45
🎯 Cible : Suisse marque +0,5 but
Suisse : 1re, 9 pts, 8 buts en 3 matchs.
Macédoine du Nord : 4e, 0 pt, 7 buts encaissés.
➡️ TRÈS FORTE SURVEILLANCE.

3) 🟢 9,3/10 — ANGLETERRE vs TCHÉQUIE — 20:45
🎯 Cible : Angleterre marque +0,5 but
Angleterre : 2e, 6 pts, 11 buts en 3 matchs.
Tchéquie : 4e, 0 pt, 7 buts encaissés en 3 matchs.
➡️ TRÈS FORTE SURVEILLANCE.

4) 🟢 9,0/10 — CROATIE vs ESPAGNE — 20:45
🎯 Cible : Espagne marque +0,5 but
Espagne : 1re, 9 pts, 10 buts en 3 matchs.
Croatie : 3e, 12 buts encaissés en 3 matchs, dont 0-7 contre l’Angleterre.
➡️ FORTE SURVEILLANCE, mais déplacement extérieur.

5) 🟠 7,8/10 — MOLDAVIE vs SLOVAQUIE — 20:45
🎯 Cible : Slovaquie marque +0,5 but
Slovaquie : 1re, 7 pts, a marqué dans 3/3.
➡️ Intéressant, mais dossier moins net que les 4 premiers.

🔴 ÉCARTÉS / PAS PRIORITAIRES :
• Kazakhstan – Îles Féroé : Kazakhstan déjà dans notre zone prudence.
• Écosse – Slovénie : rapport de force trop serré.
• Biélorussie – Finlande : faiblesse défensive adverse insuffisamment nette.
• Estonie – Islande : écart trop faible.
• Luxembourg – Bulgarie : attaque cible pas assez régulière.
• Amicaux internationaux : exclus du scanner principal.

✅ ORDRE DE SURVEILLANCE LIVE :
Albanie > Suisse > Angleterre > Espagne > Slovaquie

⚠️ Aucune entrée pré-match. Hermès doit attendre la fenêtre live et les conditions officielles.`;
            const body=JSON.stringify({chat_id:chatId,text,disable_web_page_preview:true});
            const req=https.request({hostname:"api.telegram.org",path:"/bot"+token+"/sendMessage",method:"POST",headers:{"Content-Type":"application/json","Content-Length":Buffer.byteLength(body)},timeout:15000},res=>{
              let raw="";
              res.on("data",d=>raw+=d);
              res.on("end",()=>{
                let p={}; try{p=JSON.parse(raw)}catch{}
                const ok=res.statusCode===200&&p.ok===true&&Number.isInteger(p.result?.message_id)&&p.result.message_id>0;
                if(!ok){console.error("TELEGRAM_SEND_OK=false HTTP="+res.statusCode);process.exit(1);}
                console.log("TELEGRAM_SEND_OK=true");
                console.log("TELEGRAM_MESSAGE_ID="+p.result.message_id);
              });
            });
            req.on("error",e=>{console.error("TELEGRAM_SEND_OK=false");console.error(e.message);process.exit(1);});
            req.on("timeout",()=>req.destroy(new Error("timeout")));
            req.write(body);
            req.end();
            NODE

# trigger: 2026-10-06T07:06 Europe/Paris
