name: TLM realtime signal audit

on:
  push:
    branches: [codex/realtime-signal-audit-20260905]
    paths:
      - ".github/workflows/tlm-realtime-signal-audit-20260905.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only production audit
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            LIVE="/tmp/tlm-live-$STAMP.json"
            HIST="/tmp/tlm-history-$STAMP.json"
            HEALTH="/tmp/tlm-health-$STAMP.json"
            RULES="/tmp/tlm-rules-$STAMP.json"
            trap 'rm -f "$LIVE" "$HIST" "$HEALTH" "$RULES"' EXIT

            echo "AUDIT_REALTIME_BEGIN"
            printf 'UTC='; date -u +%FT%TZ
            printf 'BRANCH='; git branch --show-current
            printf 'COMMIT='; git rev-parse HEAD
            docker compose ps

            curl -fsS --max-time 30 "http://127.0.0.1:3001/health?audit=$STAMP" -o "$HEALTH"
            curl -fsS --max-time 30 "http://127.0.0.1:3001/public-signal-rules?audit=$STAMP" -o "$RULES"
            curl -fsS --max-time 45 "http://127.0.0.1:3001/live-matches?audit=$STAMP" -o "$LIVE"
            curl -fsS --max-time 45 "http://127.0.0.1:3001/analysis-history?audit=$STAMP" -o "$HIST"
            node -e "$(printf '%s' '' | base64 -d)" "$HEALTH" "$RULES" "$LIVE" "$HIST"

            echo "ENV_STATUS"
            docker exec touslesmatchs-api node -e 'for(const k of ["API_FOOTBALL_KEY","TELEGRAM_BOT_TOKEN","OPENROUTER_API_KEY","PERPLEXITY_API_KEY","DEEPSEEK_API_KEY","MISTRAL_API_KEY","COHERE_API_KEY","OPENAI_API_KEY"]) console.log(k,process.env[k]?"SET":"EMPTY")'

            if test -f scripts/audit_votes_readonly_20260905.js; then
              node scripts/audit_votes_readonly_20260905.js || true
            fi

            echo "RECENT_FUNNEL_LOGS"
            docker logs touslesmatchs-api --since 4h 2>&1 | grep -Ei '\[auto-concile\]|\[recovery\]|\[signal-fort\]|\[ai-guard\]|telegram' | tail -n 350 || true
            echo "AUDIT_REALTIME_END"
