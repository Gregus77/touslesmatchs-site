name: Deploy TLM live window runtime fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-tlm-live-window-runtime.yml"

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy API and prove live window
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs

            TLM_OLD_HEAD="$(git rev-parse HEAD)"
            TLM_BRANCH="$(git branch --show-current)"
            TLM_UPSTREAM="$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')"
            TLM_REMOTE="$(git remote get-url origin)"
            printf 'BASELINE branch=%s commit=%s upstream=%s remote=%s\n' "$TLM_BRANCH" "$TLM_OLD_HEAD" "$TLM_UPSTREAM" "$TLM_REMOTE"
            git status --short --branch
            printf '%s\n' "UNTRACKED_BEGIN"
            git ls-files --others --exclude-standard
            printf '%s\n' "UNTRACKED_END"

            git fetch origin main
            test "$TLM_BRANCH" = "main"
            test "$TLM_UPSTREAM" = "origin/main"
            case "$TLM_REMOTE" in *Gregus77/touslesmatchs-site*) ;; *) echo "Dépôt inattendu" >&2; exit 2 ;; esac
            TLM_DIRTY="$(git status --porcelain --untracked-files=no)"
            test -z "$TLM_DIRTY" || { echo "Fichiers suivis modifiés:"; printf '%s\n' "$TLM_DIRTY"; exit 2; }
            TLM_COUNTS="$(git rev-list --left-right --count HEAD...origin/main)"
            test "$(printf '%s' "$TLM_COUNTS" | awk '{print $1}')" = "0"

            TLM_BACKUP="/opt/backups/live-window-runtime-$(date -u +%Y%m%dT%H%M%SZ)"
            install -d -m 700 "$TLM_BACKUP"
            cp -a scripts/api_server.js "$TLM_BACKUP/api_server.js"

            rollback_api() {
              TLM_EXIT=$?
              set +e
              cp -a "$TLM_BACKUP/api_server.js" scripts/api_server.js
              docker compose up -d --build api >/dev/null 2>&1
              sleep 12
              docker inspect -f '{{.State.Running}} restart={{.RestartCount}}' touslesmatchs-api
              curl -fsS --max-time 30 "https://www.touslesmatchs.com/api/health?rollback=$(date +%s)" >/dev/null
              git restore --source=HEAD --worktree -- scripts/api_server.js
              echo "ROLLBACK_API_OK — sauvegarde: $TLM_BACKUP" >&2
              exit "$TLM_EXIT"
            }

            git pull --ff-only origin main
            trap rollback_api ERR

            node --check scripts/api_server.js
            node -e "$(printf '%s' '' | base64 -d)"
            docker compose config -q

            docker compose up -d --build api
            sleep 15
            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-api)" = "true"
            TLM_RESTARTS="$(docker inspect -f '{{.RestartCount}}' touslesmatchs-api)"
            sleep 12
            test "$(docker inspect -f '{{.RestartCount}}' touslesmatchs-api)" = "$TLM_RESTARTS"
            test "$(sha256sum scripts/api_server.js | awk '{print $1}')" = "$(docker exec touslesmatchs-api sha256sum /app/server.js | awk '{print $1}')"

            TLM_STAMP="$(date +%s)"
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/api/health?window=$TLM_STAMP" -o "/tmp/tlm-health-$TLM_STAMP.json"
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/api/live-matches?window=$TLM_STAMP" -o "/tmp/tlm-live-$TLM_STAMP.json"
            python3 -c "$(printf '%s' '' | base64 -d)" "/tmp/tlm-health-$TLM_STAMP.json" "/tmp/tlm-live-$TLM_STAMP.json"

            ! docker logs --since 3m touslesmatchs-api 2>&1 | grep -Ei 'SyntaxError|UnhandledPromiseRejection|EADDRINUSE|FATAL'
            systemctl start tlm-autodirector.service || true

            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            test -z "$(git status --porcelain --untracked-files=no)"
            trap - ERR
            echo "RESULT=OK"
            echo "BACKUP=$TLM_BACKUP"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"
            echo "API_CONTAINER=$(docker inspect -f '{{.Id}}' touslesmatchs-api | cut -c1-12)"
