name: Protected current Goal05 product and legacy history
on: [push, pull_request]
permissions:
  contents: read
jobs:
  product-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Current +0.5 product rules and public surfaces
        run: |
          node scripts/test_goal05_policy_20261005.js
          node scripts/test_current_product_goal05_20261005.js
          node scripts/test_public_goal05_rules_copy_20261006.js
          node scripts/test_public_seo_active_goal05_20261007.js
      - name: Statistics coverage never invents data
        run: node scripts/test_stats_coverage_20260926.js
