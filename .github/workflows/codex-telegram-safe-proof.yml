name: Codex Telegram safe proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-telegram-safe-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prove Telegram delivery without exposing runtime data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs

            git fetch origin main
            test "$(git branch --show-current)" = "main"
            test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "origin/main"
            test -z "$(git status --porcelain --untracked-files=no)"
            git pull --ff-only origin main

            curl -fsS https://www.touslesmatchs.com/api/health >/dev/null
            docker inspect touslesmatchs-api >/dev/null
            docker exec touslesmatchs-api grep -q 'telegram_signal_deliveries' /app/server.js
            docker exec touslesmatchs-api grep -q 'frenchClientSignal' /app/server.js

            docker exec touslesmatchs-api node -e "$(printf '%s' '' | base64 -d)"

            git commit --allow-empty -m "test: prove Telegram admin delivery on production"
            git push origin HEAD:main
