name: Deploy Hermes control center

on:
  push:
    branches: [main]
    paths:
      - "CURRENT_RULES.md"
      - "CLAUDE.md"
      - "PROJECT_STATE.md"
      - "docs/HERMES_COUNCIL.md"
      - "docs/HERMES_OWNER_CONTROL.md"
      - ".env.example"
      - "scripts/tlm_guardian.py"
      - "scripts/tlm_owner_remote.py"
      - "scripts/test_hermes_control_center_20261005.py"
      - "ops/systemd/tlm-hermes-guardian.service"
      - "ops/systemd/tlm-owner-remote.service"
      - ".github/workflows/deploy-hermes-control-center.yml"

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy Hermes beside production checkout
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          # set -euo pipefail in the remote script already stops on errors.
          # appleboy script_stop injects shell guards after each line and corrupts Python heredocs.
          script_stop: false
          script: |
            set -euo pipefail

            PROJECT=/opt/touslesmatchs
            DEPLOY_ROOT=/opt/tlm-hermes-control
            STAGE="$(mktemp -d /tmp/tlm-hermes-control.XXXXXX)"
            BACKUP="/opt/backups/hermes-control-$(date -u +%Y%m%dT%H%M%SZ)"

            cleanup() { rm -rf "$STAGE"; }
            trap cleanup EXIT

            cd "$PROJECT"
            git fetch origin main

            # Never switch branch, reset, pull or touch tracked production files.
            git show origin/main:scripts/tlm_guardian.py > "$STAGE/tlm_guardian.py"
            git show origin/main:scripts/tlm_owner_remote.py > "$STAGE/tlm_owner_remote.py"
            git show origin/main:scripts/test_owner_remote_20260926.py > "$STAGE/test_owner_remote_20260926.py"
            git show origin/main:scripts/test_hermes_control_center_20261005.py > "$STAGE/test_hermes_control_center_20261005.py"
            git show origin/main:CURRENT_RULES.md > "$STAGE/CURRENT_RULES.md"
            git show origin/main:ops/systemd/tlm-hermes-guardian.service > "$STAGE/tlm-hermes-guardian.service"
            git show origin/main:ops/systemd/tlm-owner-remote.service > "$STAGE/tlm-owner-remote.service"

            python3 -m py_compile "$STAGE/tlm_guardian.py" "$STAGE/tlm_owner_remote.py"
            (
              cd "$STAGE"
              PYTHONPATH="$STAGE" python3 test_owner_remote_20260926.py
              PYTHONPATH="$STAGE" python3 test_hermes_control_center_20261005.py
            )

            grep -q "min_votes': 4" "$STAGE/tlm_guardian.py"
            ! grep -q "rules.get('min_votes')!=3" "$STAGE/tlm_guardian.py"
            grep -q "automatic_execution.*False" "$STAGE/tlm_owner_remote.py"
            grep -q "gpt-4o-mini-transcribe" "$STAGE/tlm_owner_remote.py"
            grep -q "30 et 85" "$STAGE/CURRENT_RULES.md"
            grep -q "4 IA sur 5" "$STAGE/CURRENT_RULES.md"

            install -d -m 700 "$BACKUP"
            if [ -d "$DEPLOY_ROOT" ]; then cp -a "$DEPLOY_ROOT" "$BACKUP/control-root"; fi
            cp -a /etc/systemd/system/tlm-hermes-guardian.service "$BACKUP/" 2>/dev/null || true
            cp -a /etc/systemd/system/tlm-owner-remote.service "$BACKUP/" 2>/dev/null || true

            OWNER_CHANGED=0
            if ! cmp -s "$STAGE/tlm_owner_remote.py" "$DEPLOY_ROOT/tlm_owner_remote.py" 2>/dev/null || ! cmp -s "$STAGE/tlm-owner-remote.service" /etc/systemd/system/tlm-owner-remote.service 2>/dev/null; then
              OWNER_CHANGED=1
            fi
            GUARDIAN_CHANGED=0
            if ! cmp -s "$STAGE/tlm_guardian.py" "$DEPLOY_ROOT/tlm_guardian.py" 2>/dev/null || ! cmp -s "$STAGE/tlm-hermes-guardian.service" /etc/systemd/system/tlm-hermes-guardian.service 2>/dev/null; then
              GUARDIAN_CHANGED=1
            fi

            install -d -m 700 "$DEPLOY_ROOT"
            install -m 0700 "$STAGE/tlm_guardian.py" "$DEPLOY_ROOT/tlm_guardian.py"
            install -m 0700 "$STAGE/tlm_owner_remote.py" "$DEPLOY_ROOT/tlm_owner_remote.py"
            install -m 0600 "$STAGE/CURRENT_RULES.md" "$DEPLOY_ROOT/CURRENT_RULES.md"

            install -m 0644 "$STAGE/tlm-hermes-guardian.service" /etc/systemd/system/tlm-hermes-guardian.service
            install -m 0644 "$STAGE/tlm-owner-remote.service" /etc/systemd/system/tlm-owner-remote.service

            systemctl daemon-reload

            # Stop exact legacy Python processes only when replacing their modern service.
            if [ "$OWNER_CHANGED" = "1" ]; then
              pkill -f '^(/usr/bin/)?python3 /opt/touslesmatchs/scripts/tlm_owner_remote[.]py            from pathlib import Path
            values={}
            for line in Path('/opt/touslesmatchs/.env').read_text().splitlines():
                if '=' in line and not line.lstrip().startswith('#'):
                    k,v=line.split('=',1);values[k.strip()]=v.strip().strip('"').strip("'")
            raise SystemExit(0 if values.get('HERMES_ADMIN_TLM_BOT') and values.get('TELEGRAM_ADMIN_CHAT_ID') else 1)
            PY
            then
              systemctl enable tlm-owner-remote.service >/dev/null
              if [ "$OWNER_CHANGED" = "1" ] || ! systemctl is-active --quiet tlm-owner-remote.service; then
                systemctl restart tlm-owner-remote.service
              fi
              systemctl is-active --quiet tlm-owner-remote.service
              REMOTE="active"
            else
              systemctl disable --now tlm-owner-remote.service 2>/dev/null || true
              REMOTE="waiting_for_bot_or_chat"
            fi

            for i in $(seq 1 25); do
              if python3 - <<'PY'
            import json
            from pathlib import Path
            p=Path('/opt/touslesmatchs/data/hermes_guardian_state.json')
            if not p.exists(): raise SystemExit(1)
            try: state=json.loads(p.read_text())
            except Exception: raise SystemExit(1)
            goal=state.get('goal05') or {}
            ok=(goal.get('min_votes')==4 and goal.get('from_minute')==30 and goal.get('to_minute')==85 and float(goal.get('min_real_fresh_odd',0))==1.60)
            raise SystemExit(0 if ok else 1)
            PY
              then break; fi
              sleep 3
            done

            python3 - <<'PY'
            import json
            from pathlib import Path
            state=json.loads(Path('/opt/touslesmatchs/data/hermes_guardian_state.json').read_text())
            goal=state.get('goal05') or {}
            assert goal.get('min_votes') == 4
            assert goal.get('from_minute') == 30
            assert goal.get('to_minute') == 85
            assert float(goal.get('min_real_fresh_odd')) == 1.60
            print('HERMES_GOAL05_STATE_OK')
            print('GOAL05_ENABLED=' + str(goal.get('enabled')))
            print('GOAL05_PUSH_ENABLED=' + str(goal.get('push_enabled')))
            print('INCIDENTS=' + json.dumps(state.get('incidents',[]), ensure_ascii=False))
            PY

            echo "REMOTE=$REMOTE"
            echo "OWNER_CHANGED=$OWNER_CHANGED"
            echo "GUARDIAN_CHANGED=$GUARDIAN_CHANGED"
            echo "SOURCE_COMMIT=$(git rev-parse origin/main)"
            echo "BACKUP=$BACKUP"

            # Read-only diagnostic: latest owner voice audit + OpenAI transcription capability.
            TLM_ROOT="$PROJECT" PYTHONPATH="$DEPLOY_ROOT" python3 - <<'PY'
            import json, urllib.request, urllib.error
            from pathlib import Path
            from tlm_guardian import config

            p=Path('/opt/touslesmatchs/data/owner_remote_commands.jsonl')
            if p.exists():
                rows=[]
                for line in p.read_text().splitlines()[-200:]:
                    try: row=json.loads(line)
                    except Exception: continue
                    if row.get('source')=='voice':
                        rows.append(row)
                if rows:
                    last=rows[-1]
                    update_id=last.get('update_id')
                    print('OWNER_VOICE_FOUND')
                    print('VOICE_AUTHORIZED=' + str(bool(last.get('authorized'))))
                    print('VOICE_UPDATE_ID=' + str(update_id))
                    results=[]
                    for line in p.read_text().splitlines()[-300:]:
                        try: row=json.loads(line)
                        except Exception: continue
                        if row.get('phase')=='result' and row.get('source')=='voice' and row.get('update_id')==update_id:
                            results.append(row)
                    if results:
                        result=results[-1]
                        print('VOICE_RESULT_FOUND')
                        print('VOICE_TRANSCRIPTION_OK=' + str(bool(result.get('transcription_ok'))))
                        print('VOICE_TRANSCRIPTION_ERROR=' + str(result.get('transcription_error')))
                        print('VOICE_INTENT=' + str(result.get('intent')))
                        print('VOICE_REPLY_MESSAGE_ID=' + str(result.get('reply_message_id')))
                    else:
                        print('VOICE_RESULT_FOUND=False')

            env=config()
            key=env.get('OPENAI_API_KEY','')
            print('OPENAI_KEY_PRESENT=' + str(bool(key)))
            if key:
                model=env.get('HERMES_TRANSCRIPTION_MODEL','gpt-4o-mini-transcribe')
                req=urllib.request.Request(
                    'https://api.openai.com/v1/models/' + model,
                    headers={'Authorization':'Bearer ' + key}
                )
                try:
                    with urllib.request.urlopen(req,timeout=20) as response:
                        print('OPENAI_TRANSCRIPTION_MODEL_HTTP=' + str(response.status))
                except urllib.error.HTTPError as e:
                    print('OPENAI_TRANSCRIPTION_MODEL_HTTP=' + str(e.code))
                except Exception as e:
                    print('OPENAI_TRANSCRIPTION_MODEL_HTTP=network_error')

            groq=env.get('GROQ_API_KEY','')
            print('GROQ_KEY_PRESENT=' + str(bool(groq)))
            if groq:
                model=env.get('HERMES_GROQ_TRANSCRIPTION_MODEL','whisper-large-v3-turbo')
                req=urllib.request.Request(
                    'https://api.groq.com/openai/v1/models/' + model,
                    headers={'Authorization':'Bearer ' + groq}
                )
                try:
                    with urllib.request.urlopen(req,timeout=20) as response:
                        print('GROQ_TRANSCRIPTION_MODEL_HTTP=' + str(response.status))
                except urllib.error.HTTPError as e:
                    print('GROQ_TRANSCRIPTION_MODEL_HTTP=' + str(e.code))
                except Exception:
                    print('GROQ_TRANSCRIPTION_MODEL_HTTP=network_error')
            PY

            # Synthetic, non-user audio proof for Gemini transcription.
            TLM_ROOT="$PROJECT" PYTHONPATH="$DEPLOY_ROOT" python3 - <<'PY'
            import io, wave, math, struct, urllib.error
            from tlm_guardian import config
            from tlm_owner_remote import _transcribe_gemini

            env=config()
            key=env.get('GOOGLE_API_KEY','')
            model=env.get('HERMES_GEMINI_TRANSCRIPTION_MODEL','gemini-3.5-flash-lite')
            if not key:
                raise SystemExit('GEMINI_SYNTHETIC_NO_KEY')

            rate=16000
            frames=[]
            for i in range(rate):
                sample=int(6000*math.sin(2*math.pi*440*i/rate))
                frames.append(struct.pack('<h',sample))
            buf=io.BytesIO()
            with wave.open(buf,'wb') as w:
                w.setnchannels(1)
                w.setsampwidth(2)
                w.setframerate(rate)
                w.writeframes(b''.join(frames))
            audio=buf.getvalue()

            try:
                text=_transcribe_gemini(audio,'.wav',key,model)
                print('GEMINI_SYNTHETIC_AUDIO_OK')
                print('GEMINI_SYNTHETIC_TEXT_LEN='+str(len(text)))
            except urllib.error.HTTPError as e:
                body=e.read(800).decode('utf-8','replace')
                print('GEMINI_SYNTHETIC_HTTP='+str(e.code))
                print('GEMINI_SYNTHETIC_BODY='+body.replace('\n',' ')[:800])
                raise
            PY

            echo "HERMES_OWNER_REMOTE_JOURNAL_BEGIN"
            journalctl -u tlm-owner-remote.service --since "15 minutes ago" --no-pager -n 120 2>/dev/null | tail -n 120 || true
            echo "HERMES_OWNER_REMOTE_JOURNAL_END"
