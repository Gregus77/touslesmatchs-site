name: TLM safe end-to-end signal audit

on:
  push:
    branches: [codex/audit-signal-pipeline-20260905-v2]
    paths: [".github/workflows/tlm-safe-signal-audit.yml", "scripts/audit_signal_pipeline_readonly_20260905.js"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous counters only
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            git fetch origin codex/audit-signal-pipeline-20260905-v2 >/dev/null
            docker exec touslesmatchs-api grep -q 'API-Sports football jour/live' /app/server.js
            echo "RUNTIME_PATCH=1"
            git show origin/codex/audit-signal-pipeline-20260905-v2:scripts/audit_signal_pipeline_readonly_20260905.js > /tmp/tlm-signal-audit.js
            docker cp /tmp/tlm-signal-audit.js touslesmatchs-api:/tmp/tlm-signal-audit.js >/dev/null
            docker exec -e NODE_PATH=/app/node_modules touslesmatchs-api node /tmp/tlm-signal-audit.js
            rm -f /tmp/tlm-signal-audit.js
            docker exec touslesmatchs-api rm -f /tmp/tlm-signal-audit.js
            LOGS="$(docker logs touslesmatchs-api --since 2h 2>&1 || true)"
            echo "LOG_COUNTS auto_cycles=$(printf '%s' "$LOGS" | grep -c '\[auto-concile\] live=' || true) analyses_started=$(printf '%s' "$LOGS" | grep -c '\[auto-concile\] analyse snapshot:' || true) no_real_odds=$(printf '%s' "$LOGS" | grep -c 'sans cote reelle' || true) ai_errors=$(printf '%s' "$LOGS" | grep -Eic '\[concile\].*(erreur|timeout|echec)' || true) telegram_errors=$(printf '%s' "$LOGS" | grep -Eic 'telegram.*(error|failed|echec|inaccessible)' || true) snapshot_errors=$(printf '%s' "$LOGS" | grep -c '\[auto-concile\] snapshot check:' || true) cycle_errors=$(printf '%s' "$LOGS" | grep -c '\[auto-concile\] cycle:' || true)"
            printf '%s' "$LOGS" | python3 -c 'import sys,re,json; p=re.compile(r"\[auto-concile\] live=(\d+) eligible=(\d+) analysed_this_cycle=(\d+) skipped_low_trust=(\d+) skipped_sans_cote_reelle=(\d+)"); rows=[dict(zip(("live","eligible","analysed","low_trust","no_odds"),map(int,m.groups()))) for line in sys.stdin for m in [p.search(line)] if m]; print("CYCLE_COUNTERS",json.dumps(rows[-12:],separators=(",",":")))'
