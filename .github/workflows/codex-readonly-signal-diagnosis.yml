name: Codex plus05 runtime diagnosis
on:
  push:
    branches: [codex/readonly-vps-audit-20261004]
    paths: [.github/workflows/codex-readonly-signal-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read plus05 runtime state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            cd /opt/touslesmatchs
            docker exec touslesmatchs-api node -e "console.log(JSON.stringify({PLUS05_ENABLED:process.env.PLUS05_ENABLED,PLUS05_DRY_RUN:process.env.PLUS05_DRY_RUN,PLUS05_REQUIRE_HISTORY:process.env.PLUS05_REQUIRE_HISTORY,PLUS05_TICK_MS:process.env.PLUS05_TICK_MS,API_FOOTBALL_KEY:Boolean(process.env.API_FOOTBALL_KEY)}))"
            echo LOGS_BEGIN
            docker logs --since 10m touslesmatchs-api 2>&1 | grep -E '\[plus05\]|API-Sports|api-sports' | tail -120 || true
            echo LOGS_END
            docker exec touslesmatchs-api node - <<'NODE'
            const D=require('better-sqlite3'),db=new D(process.env.DB_PATH||'/data/tlm.db',{readonly:true,fileMustExist:true});
            console.log('WATCH='+JSON.stringify(db.prepare("select day,count(*) n,max(created_at) latest from plus05_watchlist group by day order by day desc limit 5").all()));
            console.log('SIG='+JSON.stringify(db.prepare("select count(*) n,max(sent_at) latest from plus05_signals").all()));
            db.close();
            NODE
