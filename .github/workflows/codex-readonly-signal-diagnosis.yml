name: Codex read-only signal diagnosis
on:
  push:
    branches: [codex/readonly-vps-audit-20261004]
    paths: [.github/workflows/codex-readonly-signal-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only production evidence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            cd /opt/touslesmatchs
            python3 - <<'PY'
            import subprocess,json,re
            def run(args):
                p=subprocess.run(args,capture_output=True,text=True,timeout=45)
                return p.stdout+p.stderr
            print("AUDIT_BEGIN")
            print("BRANCH",run(["git","branch","--show-current"]).strip())
            print("COMMIT",run(["git","rev-parse","HEAD"]).strip())
            js = """
            const keys=['PLUS05_ENABLED','PLUS05_DRY_RUN','PLUS05_REQUIRE_HISTORY','PLUS05_SEND_RESULTS','PLUS05_TICK_MS','AUTO_CONCILE_OBSERVER','JEV_ENABLED','JEV_PRODUCTION_MODE','JEV_MIN_DECISION_CONFIDENCE'];
            for(const k of keys) console.log(k+'='+(process.env[k]??'ABSENT'));
            for(const k of ['API_SPORTS_KEY','API_FOOTBALL_KEY','OPENROUTER_API_KEY','PERPLEXITY_API_KEY','DEEPSEEK_API_KEY','MISTRAL_API_KEY']) console.log(k+'_PRESENT='+Boolean(process.env[k]));
            const fs=require('fs');
            for(const name of ['plus05_boot','plus05_engine','plus05_favorite']) console.log(name+'_MODULE='+fs.existsSync('/app/'+name+'.js'));
            try {
              const Database=require('better-sqlite3');
              const db=new Database(process.env.DB_PATH||'/data/tlm.db',{readonly:true,fileMustExist:true});
              const tables=db.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map(r=>r.name);
              for(const t of ['plus05_watchlist','plus05_signals','concile_analyses','jev_decisions']) {
                if(!tables.includes(t)){console.log(t+'_ABSENT');continue;}
                console.log(t+'_COUNT='+db.prepare('SELECT count(*) n FROM '+t).get().n);
                if(t==='plus05_watchlist') console.log('WATCH_REASONS='+JSON.stringify(db.prepare("SELECT day,last_reason,count(*) n FROM plus05_watchlist GROUP BY day,last_reason ORDER BY day DESC LIMIT 30").all()));
                if(t==='plus05_signals') console.log('SIGNAL_DAYS='+JSON.stringify(db.prepare("SELECT date(sent_at/1000,'unixepoch') day,dry_run,outcome,count(*) n FROM plus05_signals GROUP BY day,dry_run,outcome ORDER BY day DESC LIMIT 30").all()));
                if(t==='jev_decisions') console.log('JEV_REASONS='+JSON.stringify(db.prepare("SELECT substr(created_at,1,10) day,decision_source,count(*) n FROM jev_decisions WHERE created_at>='2026-09-20' GROUP BY day,decision_source ORDER BY day DESC LIMIT 30").all()));
              }
              db.close();
            } catch(e) {console.log('DB_AUDIT_ERROR='+e.code);}
            """
            print(run(["docker","compose","exec","-T","api","node","-e",js]))
            logs=run(["docker","compose","logs","--no-color","--since","336h","--tail","50000","api"])
            for pattern in ['jev_low_confidence','daily request limit','rateLimit','Cannot find module','historique_non_verifie','attaquants_non_verifies','quorum_insuffisant','cote_absente','cote_sous_1_60','siege non configure','reponse vide','initialisation impossible','classement_indisponible','championnat_a_groupes','forme_favori_incomplete','forme_adversaire_incomplete','tick','watchlist']:
                count=len(re.findall(re.escape(pattern),logs,re.I))
                print("LOG_COUNT",pattern,count)
            for line in logs.splitlines():
                if '[plus05] charge' in line:
                    m=re.search(r'champion[n]?ats=\\d+ actif=(?:true|false) essai_a_blanc=(?:true|false)',line)
                    if m:print("BOOT",m.group(0))
            print("AUDIT_END")
            PY
