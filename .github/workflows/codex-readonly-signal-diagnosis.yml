name: Codex deploy plus05 primary UI
on:
  push:
    branches: [codex/readonly-vps-audit-20261004]
    paths: [.github/workflows/codex-readonly-signal-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Deploy public +0.5 positioning
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/touslesmatchs
            test "$(git branch --show-current)" = "feat/plus05-favorite"
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin feat/plus05-favorite
            git pull --ff-only origin feat/plus05-favorite
            grep -Fq 'Votre signal<br>+0,5 but.' public/index.html
            grep -Fq 'Signaux +0,5 but équipe favorite, votes IA et justification factuelle' public/index.html
            grep -Fq 'Les signaux +0,5 but équipe favorite et les alertes membres' public/app.html
            grep -Fq 'Stratégie principale : +0,5 but de l’équipe du Top 5 face aux 5 derniers.' public/live-ia.html
            docker restart touslesmatchs-api >/dev/null
            sleep 8
            curl -fsS --max-time 20 "https://www.touslesmatchs.com/api/health?plus05=$(date +%s)" >/tmp/health.json
            python3 - <<'PY'
            import json
            d=json.load(open('/tmp/health.json'))
            assert d.get('ok') is True
            print('DEPLOY_PLUS05_UI_OK')
            PY
