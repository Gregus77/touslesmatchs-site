name: Deploy Goal05 current product 20261005

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-goal05-current-product-20261005.yml"

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy unified Goal05 product with preserved history
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/touslesmatchs
            target='${{ github.sha }}'
            git fetch origin main
            git show "${target}:scripts/deploy_goal05_current_product_20261005.sh" > /tmp/deploy_goal05_current_product_20261005.sh
            chmod 700 /tmp/deploy_goal05_current_product_20261005.sh
            bash -n /tmp/deploy_goal05_current_product_20261005.sh
            bash /tmp/deploy_goal05_current_product_20261005.sh "$target"

# robust script runner trigger
