name: Deploy OpenRouter budget split

on:
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "scripts/ai_budget_guard.js"
      - "scripts/analysis_engine.js"
      - "scripts/test_ai_budget_guard.js"
      - ".github/workflows/deploy-openrouter-budget-split.yml"

permissions:
  contents: read

concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Backup, configure, deploy and verify
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 12m
          script: |
            set -Eeuo pipefail
            cd /opt/touslesmatchs
            TLM_OLD_HEAD="$(git rev-parse HEAD)"
            TLM_BACKUP="/opt/backups/openrouter-budget-split-$(date +%Y%m%d-%H%M%S)"
            install -d -m 700 "$TLM_BACKUP"
            cp -a .env "$TLM_BACKUP/.env"
            chmod 600 "$TLM_BACKUP/.env"
            for TLM_FILE in docker-compose.yml scripts/ai_budget_guard.js scripts/analysis_engine.js scripts/test_ai_budget_guard.js; do
              install -D "$TLM_FILE" "$TLM_BACKUP/$TLM_FILE"
            done

            rollback() {
              TLM_EXIT=$?
              set +e
              cp -a "$TLM_BACKUP/.env" .env
              for TLM_FILE in docker-compose.yml scripts/ai_budget_guard.js scripts/analysis_engine.js scripts/test_ai_budget_guard.js; do
                cp -a "$TLM_BACKUP/$TLM_FILE" "$TLM_FILE"
              done
              docker compose up -d --build --force-recreate api >/dev/null 2>&1
              echo "ROLLBACK_OK — configuration précédente restaurée — sauvegarde: $TLM_BACKUP" >&2
              exit "$TLM_EXIT"
            }

            git fetch origin main
            test "$(git branch --show-current)" = "main"
            test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "origin/main"
            test -z "$(git status --porcelain --untracked-files=no)"
            TLM_COUNTS="$(git rev-list --left-right --count HEAD...origin/main)"
            test "$(printf '%s' "$TLM_COUNTS" | awk '{print $1}')" = "0"
            git pull --ff-only origin main
            trap rollback ERR

            python3 - <<'PY'
            from pathlib import Path
            path = Path('.env')
            wanted = {
                'OPENROUTER_DAILY_BUDGET_EUR': '4',
                'OPENROUTER_HERMES_DAILY_BUDGET_EUR': '0.5',
                'OPENROUTER_CONCILE_DAILY_BUDGET_EUR': '3',
            }
            lines = path.read_text().splitlines()
            seen = set()
            out = []
            for line in lines:
                key = line.split('=', 1)[0].strip() if '=' in line else ''
                if key in wanted:
                    if key not in seen:
                        out.append(f'{key}={wanted[key]}')
                        seen.add(key)
                else:
                    out.append(line)
            for key, value in wanted.items():
                if key not in seen:
                    out.append(f'{key}={value}')
            path.write_text('\n'.join(out) + '\n')
            PY
            chmod 600 .env

            node --check scripts/ai_budget_guard.js
            node --check scripts/analysis_engine.js
            docker run --rm -e NODE_PATH=/app/node_modules -v "$PWD/scripts:/tests:ro" -w /tests touslesmatchs-api node test_ai_budget_guard.js
            docker compose config -q

            TLM_STARTED_BEFORE="$(docker inspect -f '{{.State.StartedAt}}' touslesmatchs-api)"
            docker compose up -d --build --force-recreate api
            sleep 20
            test "$(docker inspect -f '{{.State.Running}}' touslesmatchs-api)" = "true"
            TLM_STARTED_AFTER="$(docker inspect -f '{{.State.StartedAt}}' touslesmatchs-api)"
            test "$TLM_STARTED_BEFORE" != "$TLM_STARTED_AFTER"

            docker exec touslesmatchs-api sh -lc '
              test "$OPENROUTER_DAILY_BUDGET_EUR" = "4"
              test "$OPENROUTER_HERMES_DAILY_BUDGET_EUR" = "0.5"
              test "$OPENROUTER_CONCILE_DAILY_BUDGET_EUR" = "3"
            '
            echo 'RUNTIME_BUDGETS_OK global=4 hermes=0.5 concile=3'
            test "$(sha256sum scripts/ai_budget_guard.js | awk '{print $1}')" = "$(docker exec touslesmatchs-api sha256sum /app/ai_budget_guard.js | awk '{print $1}')"
            test "$(sha256sum scripts/analysis_engine.js | awk '{print $1}')" = "$(docker exec touslesmatchs-api sha256sum /app/analysis_engine.js | awk '{print $1}')"

            TLM_HEALTH="$(curl -fsS --max-time 30 "https://www.touslesmatchs.com/api/health?budget=$(date +%s)")"
            printf '%s' "$TLM_HEALTH" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h.get("ok") is not False; print("PUBLIC_API_HEALTH_OK")'
            docker logs touslesmatchs-api --since 2m 2>&1 | grep -Fq '[auto-concile] enabled'
            echo 'AUTO_CONCILE_ENABLED_OK'
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            test -z "$(git status --porcelain --untracked-files=no)"

            trap - ERR
            echo "DEPLOY_OK — plafonds global=4 EUR, Hermes=0.5 EUR, Concile=3 EUR — sauvegarde: $TLM_BACKUP — précédent: $TLM_OLD_HEAD"
