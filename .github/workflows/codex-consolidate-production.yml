name: Codex consolidate production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-consolidate-production.yml

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Backup and consolidate VPS source of truth
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /opt/touslesmatchs
            STAMP="$(date -u +%Y%m%d-%H%M%S)"
            BACKUP="/opt/backups/tlm-full-consolidation-$STAMP"
            export BACKUP
            install -d -m 700 "$BACKUP" "$BACKUP/databases"
            echo "BACKUP_BEGIN=$BACKUP"
            git status --short --branch > "$BACKUP/git-status.before.txt"
            git rev-parse HEAD > "$BACKUP/git-head.before.txt"
            git branch --show-current > "$BACKUP/git-branch.before.txt"
            git show-ref > "$BACKUP/git-refs.before.txt"
            git bundle create "$BACKUP/repository-all-refs.bundle" --all
            if [ -f .env ]; then cp -a .env "$BACKUP/env.before"; chmod 600 "$BACKUP/env.before"; fi
            python3 -c "import base64;exec(base64.b64decode(''))"
            tar --warning=no-file-changed --ignore-failed-read -czf "$BACKUP/project-full.tar.gz" --exclude='*.db-wal' --exclude='*.db-shm' -C /opt touslesmatchs
            sha256sum "$BACKUP/repository-all-refs.bundle" "$BACKUP/project-full.tar.gz" > "$BACKUP/SHA256SUMS"
            find "$BACKUP" -type f -exec chmod go-rwx {} +
            echo "BACKUP_OK=$BACKUP"
            git fetch origin main agent/android-fcm-v107
            OLD_MAIN="$(git rev-parse origin/main)"
            OLD_BRANCH="$(git branch --show-current)"
            OLD_HEAD="$(git rev-parse HEAD)"
            install -d .github/workflows
            curl -fsSL "https://raw.githubusercontent.com/Gregus77/touslesmatchs-site/main/.github/workflows/codex-vps-baseline.yml" -o .github/workflows/codex-vps-baseline.yml
            git add -u
            for path in .github/workflows/codex-vps-baseline.yml scripts/shadow_tournament_worker.js scripts/tlm_hourly_director.py scripts/verify_ou25_reliability_guard.js; do [ ! -f "$path" ] || git add -- "$path"; done
            git config user.name "TousLesMatchs Production"
            git config user.email "production@touslesmatchs.com"
            git commit -m "chore: consolidate current VPS production state"
            NEW_HEAD="$(git rev-parse HEAD)"
            SAFE_TAG="backup/pre-consolidation-main-$STAMP"
            git tag "$SAFE_TAG" "$OLD_MAIN"
            git push origin "refs/tags/$SAFE_TAG"
            git push --force-with-lease="main:$OLD_MAIN" origin "$NEW_HEAD:refs/heads/main"
            git branch -M main
            git branch --set-upstream-to=origin/main main
            git fetch origin main
            printf 'OLD_VPS_BRANCH=%s\n' "$OLD_BRANCH"
            printf 'OLD_VPS_HEAD=%s\n' "$OLD_HEAD"
            printf 'OLD_MAIN=%s\n' "$OLD_MAIN"
            printf 'NEW_MAIN=%s\n' "$NEW_HEAD"
            printf 'BACKUP_TAG=%s\n' "$SAFE_TAG"
            printf 'FINAL_BRANCH=%s\n' "$(git branch --show-current)"
            printf 'FINAL_HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'REMOTE_MAIN=%s\n' "$(git rev-parse origin/main)"
            echo "FINAL_STATUS_BEGIN"
            git status --short --branch
            echo "FINAL_STATUS_END"
