name: Inspect Hermes notification services 20261006

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-hermes-notification-services-20261006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only notification service inspection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -euo pipefail
            for unit in tlm-hourly-director.service tlm-hourly-director.timer tlm-autodirector.service tlm-autodirector.timer tlm-hermes-guardian.service; do
              echo "=== $unit ==="
              systemctl is-active "$unit" 2>/dev/null || true
              systemctl is-enabled "$unit" 2>/dev/null || true
              systemctl cat "$unit" 2>/dev/null || true
            done
