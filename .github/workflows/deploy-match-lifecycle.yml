name: Deploy match lifecycle display
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/app.html
      - public/faq.html
      - public/js/i18n.js
      - public/js/i18n-auto.js
      - public/js/tlm-wow-theme.js
      - public/js/match-lifecycle.js
      - scripts/test_i18n_integral_20260906.js
      - public/sw.js
      - scripts/test_match_lifecycle_20260906.js
      - scripts/test_public_quorum_copy_3of5_20260906.js
      - .github/workflows/deploy-match-lifecycle.yml
permissions:
  contents: read
concurrency:
  group: tlm-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy scoped lifecycle fix with backup
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -Eeuo pipefail
            cd /opt/touslesmatchs
            target='${{ github.sha }}'
            test "$(git branch --show-current)" = main
            test "$(git rev-parse --abbrev-ref '@{upstream}')" = origin/main
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git merge-base --is-ancestor HEAD "$target"
            test "$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/srv"}}{{.Source}}{{end}}{{end}}' touslesmatchs-site)" = /opt/touslesmatchs/public
            while IFS= read -r file; do
              case "$file" in
                CHANGELOG.md|public/index.html|public/app.html|public/faq.html|public/sw.js|public/js/i18n.js|public/js/i18n-auto.js|public/js/tlm-wow-theme.js|public/js/match-lifecycle.js|scripts/test_i18n_integral_20260906.js|scripts/test_homepage_consensus_20260905.js|scripts/test_match_lifecycle_20260906.js|scripts/test_public_quorum_copy_3of5_20260906.js|.github/workflows/deploy-integral-i18n.yml|.github/workflows/deploy-match-lifecycle.yml) ;;
                *) echo "STOP: unrelated change: $file"; exit 1 ;;
              esac
            done < <(git diff --name-only HEAD "$target")
            backup=$(mktemp -d /opt/backups/tlm-match-lifecycle.XXXXXX)
            cp -a public/index.html public/app.html public/faq.html public/sw.js public/js/i18n.js public/js/tlm-wow-theme.js public/js/match-lifecycle.js "$backup/"
            test ! -e public/js/i18n-auto.js || cp -a public/js/i18n-auto.js "$backup/"
            git rev-parse HEAD > "$backup/git-head.txt"
            rollback() {
              trap - ERR
              cp -a "$backup/index.html" public/index.html
              cp -a "$backup/app.html" public/app.html
              cp -a "$backup/faq.html" public/faq.html
              cp -a "$backup/sw.js" public/sw.js
              cp -a "$backup/i18n.js" "$backup/tlm-wow-theme.js" "$backup/match-lifecycle.js" public/js/
              if test -e "$backup/i18n-auto.js"; then cp -a "$backup/i18n-auto.js" public/js/; else rm -f public/js/i18n-auto.js; fi
              echo "FAILED: public pages restored; BACKUP=$backup"
              exit 1
            }
            trap rollback ERR
            git merge --ff-only "$target"
            node scripts/test_homepage_consensus_20260905.js
            node scripts/test_match_lifecycle_20260906.js
            node scripts/test_public_quorum_copy_3of5_20260906.js
            node scripts/test_i18n_integral_20260906.js
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/js/match-lifecycle.js?v=$target" -o "$backup/helper-public.js"
            cmp public/js/match-lifecycle.js "$backup/helper-public.js"
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/?v=$target" -o "$backup/home-public.html"
            cmp public/index.html "$backup/home-public.html"
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/app.html?v=$target" -o "$backup/app-public.html"
            cmp public/app.html "$backup/app-public.html"
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/faq.html?v=$target" -o "$backup/faq-public.html"
            cmp public/faq.html "$backup/faq-public.html"
            curl -fsS --max-time 30 "https://www.touslesmatchs.com/js/i18n.js?v=$target" -o "$backup/i18n-public.js"
            cmp public/js/i18n.js "$backup/i18n-public.js"
            for file in i18n-auto.js tlm-wow-theme.js; do
              curl -fsS --max-time 30 "https://www.touslesmatchs.com/js/$file?v=$target" -o "$backup/$file.public"
              cmp "public/js/$file" "$backup/$file.public"
            done
            docker compose ps --services --status running
            trap - ERR
            echo "MATCH_LIFECYCLE_DEPLOYED=$target"
            echo "BACKUP=$backup"
      - name: Capture rendered site and app
        shell: bash
        run: |
          set -euo pipefail
          for page in home app; do
            url="https://www.touslesmatchs.com/?lifecycle=${{ github.sha }}"
            if [ "$page" = app ]; then url="https://www.touslesmatchs.com/app.html?lifecycle=${{ github.sha }}"; fi
            google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=12000 --dump-dom "$url" > "/tmp/$page-lifecycle.html"
            grep -q 'match-lifecycle.js' "/tmp/$page-lifecycle.html"
            ! grep -Eqi 'minimum (de )?4 (IA )?(sur|de) 5|au moins 4 votes sur 5|at least 4 of 5 AIs agree' "/tmp/$page-lifecycle.html"
            google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=12000 --screenshot="/tmp/$page-lifecycle.png" "$url"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: match-lifecycle-visual-proof
          path: |
            /tmp/*-lifecycle.png
            /tmp/*-lifecycle.html
          retention-days: 7
