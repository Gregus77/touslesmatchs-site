services:
  site:
    build: .
    container_name: touslesmatchs-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /opt/touslesmatchs/site:/srv
      - /opt/touslesmatchs/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - web

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: touslesmatchs-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID_PREMIUM=${STRIPE_PRICE_ID_PREMIUM}
      - STRIPE_PRICE_ID_VIP=${STRIPE_PRICE_ID_VIP}
      - STRIPE_PRICE_ID_ELITE=${STRIPE_PRICE_ID_ELITE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PREMIUM_CHANNEL_ID=${TELEGRAM_PREMIUM_CHANNEL_ID}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
    volumes:
      - api_data:/data
      - /opt/touslesmatchs/shared:/shared:ro
    networks:
      - web
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/live-matches', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  council:
    build:
      context: .
      dockerfile: council/Dockerfile
    container_name: touslesmatchs-council
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PREMIUM_CHANNEL_ID=${TELEGRAM_PREMIUM_CHANNEL_ID}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
    volumes:
      - council_data:/app/data
    networks:
      - web

  hermes-admin:
    build:
      context: .
      dockerfile: council/Dockerfile
    container_name: touslesmatchs-hermes-admin
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-c", "import time; print('[hermes-admin] Standby mode — waiting for admin bot script'); exec('while True: time.sleep(3600)')"]
    environment:
      - HERMES_ADMIN_TLM_BOT=${HERMES_ADMIN_TLM_BOT}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - council_data:/app/data
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
  council_data:
  api_data:

networks:
  web:
    driver: bridge
