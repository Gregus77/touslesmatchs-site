services:
  site:
    build: .
    container_name: touslesmatchs-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: touslesmatchs-api
    restart: unless-stopped
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID_PREMIUM=${STRIPE_PRICE_ID_PREMIUM}
      - STRIPE_PRICE_ID_VIP=${STRIPE_PRICE_ID_VIP}
      - STRIPE_PRICE_ID_ELITE=${STRIPE_PRICE_ID_ELITE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PREMIUM_CHANNEL_ID=${TELEGRAM_PREMIUM_CHANNEL_ID}
    volumes:
      - api_data:/data
    networks:
      - web
    expose:
      - "3001"

  council:
    build:
      context: .
      dockerfile: council/Dockerfile
    container_name: touslesmatchs-council
    restart: unless-stopped
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PREMIUM_CHANNEL_ID=${TELEGRAM_PREMIUM_CHANNEL_ID}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
    volumes:
      - council_data:/app/data
    networks:
      - web

  hermes-admin:
    build:
      context: .
      dockerfile: council/Dockerfile
    container_name: touslesmatchs-hermes-admin
    restart: unless-stopped
    working_dir: /app
    environment:
      - HERMES_ADMIN_TLM_BOT=${HERMES_ADMIN_TLM_BOT}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - council_data:/app/data
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
  council_data:
  api_data:

networks:
  web:
    driver: bridge
