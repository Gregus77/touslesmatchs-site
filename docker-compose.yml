services:
  site:
    build: .
    container_name: touslesmatchs-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /opt/touslesmatchs/site:/srv
      - /opt/touslesmatchs/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - web

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: touslesmatchs-api
    restart: unless-stopped
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - FOOTBALL_DATA_KEY=${FOOTBALL_DATA_KEY}
      - THESPORTSDB_API_KEY=${THESPORTSDB_API_KEY}
      - AUTO_CONCILE_MULTISPORT=${AUTO_CONCILE_MULTISPORT}
      - SHADOW_DAILY_CAP=${SHADOW_DAILY_CAP}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      # Clés lues par api_server.js mais qui n'étaient PAS transmises : sans elles,
      # Perplexity-Web et Cohere-Command retombent silencieusement sur llama-3.3-70b
      # (Groq) — soit le même modèle que Claude Chief, ce qui annule la diversité du
      # Concile. Une variable absente du .env vaut "" : comportement identique à avant.
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      # Identifiants de modèles surchargeables (corriger un ID sans redéployer)
      - OR_QWEN_MODEL=${OR_QWEN_MODEL}
      - OR_KIMI_MODEL=${OR_KIMI_MODEL}
      # Emails Brevo (nurturing, codes d'accès) — inopérants sans ces variables
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      # Secret de signature des sessions : sans lui, un secret aléatoire est régénéré
      # à chaque redémarrage et TOUS les membres connectés sont déconnectés.
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID_PREMIUM=${STRIPE_PRICE_ID_PREMIUM}
      - STRIPE_PRICE_ID_VIP=${STRIPE_PRICE_ID_VIP}
      - STRIPE_PRICE_ID_ELITE=${STRIPE_PRICE_ID_ELITE}
      - STRIPE_PRICE_ID_CARTE=${STRIPE_PRICE_ID_CARTE}
      - STRIPE_PRICE_ID_STANDARD=${STRIPE_PRICE_ID_STANDARD}
      - TESTER_GRANT_EMAIL=${TESTER_GRANT_EMAIL}
      - TESTER_GRANT_EXPIRES=${TESTER_GRANT_EXPIRES}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_STANDARD_CHANNEL_ID=${TELEGRAM_STANDARD_CHANNEL_ID}
      - TELEGRAM_PREMIUM_CHANNEL_ID=${TELEGRAM_PREMIUM_CHANNEL_ID}
      - TELEGRAM_ELITE_CHANNEL_ID=${TELEGRAM_ELITE_CHANNEL_ID}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - TELEGRAM_FREE_CHANNEL_ID=${TELEGRAM_FREE_CHANNEL_ID}
      - SHOW_TELEGRAM_MEMBER_COUNT=${SHOW_TELEGRAM_MEMBER_COUNT}
    volumes:
      # Bind-mount sur le disque hôte : la base survit à `docker compose down -v`,
      # `docker volume rm` et `docker system prune --volumes`. NE JAMAIS remettre
      # un volume nommé ici — c'est ce qui a effacé les stats en juillet 2026.
      - /opt/touslesmatchs/data:/data
      - /opt/touslesmatchs/data/picks:/picks
      - /opt/touslesmatchs/data/var:/var/touslesmatchs
      - /opt/touslesmatchs/shared:/shared:ro
    networks:
      - web
    ports:
      - "127.0.0.1:3001:3001"

  council:
    build:
      context: .
      dockerfile: council/Dockerfile
    container_name: touslesmatchs-council
    restart: unless-stopped
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_CHIEF_MODEL=${OPENROUTER_CHIEF_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PREMIUM_CHANNEL_ID=${TELEGRAM_PREMIUM_CHANNEL_ID}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
    volumes:
      - council_data:/app/data
    networks:
      - web

  hermes-admin:
    build:
      context: .
      dockerfile: council/Dockerfile
    container_name: touslesmatchs-hermes-admin
    restart: unless-stopped
    working_dir: /app
    # time.sleep(float('inf')) plante avec "OverflowError: timestamp out of range
    # for platform time_t" sur cette plateforme — boucle de redemarrage en continu
    # depuis 4 jours (trouve lors de l'audit budget du 28/07/2026, invisible
    # jusque-la : `docker ps` affichait juste "Restarting"). Une boucle infinie
    # avec un sommeil long et fini ne plante jamais et consomme un temps CPU nul.
    command: ["python", "-c", "import time; print('[hermes-admin] Idle — admin via api_server.js — aucun appel IA depuis ce service'); [time.sleep(3600) for _ in iter(int, 1)]"]
    environment:
      - HERMES_ADMIN_TLM_BOT=${HERMES_ADMIN_TLM_BOT}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - council_data:/app/data
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
  council_data:
  # api_data supprimé : la base API est désormais bind-montée sur /opt/touslesmatchs/data
  # (voir service api) pour survivre à toute opération Docker destructive.

networks:
  web:
    driver: bridge
